  {
    id: 1, domain: "Mobile Devices", weight: 13, color: "#e94560",
    topics: [
      { title: "1.1 — Hardware Replacement", sections: [
        { heading: "Replaceable Laptop Components", content: `**Commonly user-replaceable:**
• **Battery** — external latch or bottom panel. Some modern laptops have internal batteries requiring disassembly
• **RAM (SO-DIMM)** — bottom access panel or keyboard removal. Push side clips to release, insert at angle
• **HDD/SSD (2.5" or M.2)** — bottom access panel. SATA or M.2 slot
• **Wireless card (M.2/Mini PCIe)** — under bottom panel. Disconnect antenna wires first (note which goes where)
• **Keyboard** — held by screws from bottom or clips from top. Ribbon cable underneath

**Typically require professional repair:**
• **Display assembly** — requires removing bezel, disconnecting video cable, swapping LCD/LED panel
• **Webcam/microphone** — embedded in display bezel, delicate ribbon cables
• **Biometric reader (fingerprint)** — integrated into power button or trackpad
• **NFC scanner** — embedded in chassis, not user-serviceable
• **Wi-Fi antenna** — routed through display hinge, requires full disassembly. If disconnected during service, Wi-Fi signal drops dramatically.

Before disassembly: power off, disconnect from power, remove the battery (if removable), use an **anti-static wrist strap** to prevent ESD damage. Document screw locations — different lengths go in different holes.` },
        { heading: "Display Technologies", content: `**LCD panel types:**

| Type | Strengths | Weaknesses | Best For |
|------|-----------|------------ |----------|
| **IPS** | Best color accuracy, widest viewing angles (178°) | Slower response, more expensive | Photo/video editing, general use |
| **TN** | Fastest response (1ms), cheapest | Worst viewing angles and color | Competitive gaming, budget |
| **VA** | Best contrast ratio (deep blacks) | Slowest response, ghosting risk | Movies, dark rooms |

**OLED** — each pixel emits own light. True blacks (pixel turns off). Best contrast of any display. Risk of **burn-in** from static images. Used in phones, tablets, high-end monitors.

**Mini-LED** [NEW] — thousands of tiny LEDs as backlight zones behind LCD. Better contrast than standard LCD (precise local dimming), no burn-in risk. Middle ground between LCD and OLED.

**Display attributes** [NEW for 1201]:
• **Pixel density (PPI)** — pixels per inch. Higher = sharper. A 4K 27" has higher PPI than 4K 32".
• **Refresh rate** — times per second display updates. 60Hz standard, 120/144Hz for gaming.
• **Screen resolution** — 1080p (1920×1080), 1440p (2560×1440), 4K (3840×2160)
• **Color gamut** — range of reproducible colors. sRGB standard; DCI-P3 and Adobe RGB are wider.

**Display components:**
• **Backlight** — LED array behind LCD panel providing illumination
• **Inverter** — converts DC to AC for older CCFL backlights (legacy — modern LEDs don't need it)
• **Digitizer** — touch-sensing layer. Converts finger/stylus position to digital coordinates
• **Touch screen** — display + digitizer combined. Capacitive (electrical charge from fingers) vs. resistive (pressure-based, less common)` }
      ]},
      { title: "1.1 Deep Dive — CertMaster Additions", sections: [
        { heading: "ESD & Electrical Safety (Laptop Disassembly)", content: `**Electrostatic Discharge (ESD)** is the #1 killer of internal components during service. Even ESD you can't feel (below ~3,000V) damages chips. A noticeable shock is 3,000V+; chips fail at 30V.

**Required ESD precautions before opening any laptop / PC:**
• **Power off completely** and **unplug** from AC. For laptops, **remove the battery** if possible.
• **ESD wrist strap** clipped to bare metal of chassis (unpainted screw hole, PSU case). Strap contains a 1 MΩ resistor — don't substitute plain wire.
• **ESD mat** under the device — provides second grounding path.
• **Self-ground** by touching the metal chassis before handling components if no strap is available (lesser protection).
• Work on **hard, non-carpeted surface**. Avoid wool sweaters, low humidity.
• Store components in **anti-static bags** (silver/pink), NOT regular plastic bags (plastic generates static).

**Other hazards:**
• **CRT monitors and laser printer fusers retain dangerous voltage** after unplugging — do NOT open these without specific training.
• **Power supplies contain capacitors** that hold charge — don't open a PSU; replace as a unit.
• **Lithium batteries** — never puncture, crush, or heat. See swollen battery symptom.` },
        { heading: "Laptop Battery Chemistry & AC Adapters", content: `**Laptop battery types:**
• **Lithium-ion (Li-ion)** — most common. High energy density, no memory effect, ~300–500 charge cycles to 80% capacity. Swell when failing.
• **Lithium Polymer (LiPo)** — flexible form factor (used in thin/ultraportable laptops, phones, tablets). Same chemistry risks as Li-ion.
• **NiMH / NiCd** — legacy, rarely seen. NiCd had memory effect; toxic (cadmium).

**AC adapter ("brick" / power brick):**
• Converts AC wall power (110–240V) to DC for the laptop (typically **19–20V** DC output; voltage stamped on the adapter and must match the laptop spec).
• **Wattage** must meet or exceed laptop requirement — undersized adapter won't charge under load; oversized is fine.
• **Polarity** on barrel connectors: center usually positive (+). USB-C PD adapters negotiate voltage dynamically (5/9/15/20V at varying current).
• **Symptoms of failure**: laptop runs on battery only, intermittent charging, adapter gets unusually hot, visible damage to cable/brick.
• Always use OEM or quality third-party adapter — wrong voltage can permanently damage the motherboard.` },
        { heading: "Biometrics & Near-Field Scanner Details", content: `**Biometric authentication on laptops/mobile:**
• **Fingerprint reader** — scans ridge patterns. Common on ThinkPads, MacBooks (Touch ID), enterprise laptops. Sensor types: **capacitive** (electrical pattern, most common) and **optical** (camera-based). Sensor often integrated into power button or trackpad.
• **Facial recognition** — Windows Hello uses IR camera to detect face depth (can't be spoofed by photo). Requires IR-capable webcam.
• **Iris scan** — less common on laptops, more on enterprise mobile devices.
• All biometric data is stored **hashed** in the TPM (laptop) or Secure Enclave (Apple) — not the raw image.

**Near-Field Scanner / NFC on mobile devices:**
• Works at **~4 cm range**, 13.56 MHz frequency.
• Uses: **contactless payment** (Apple Pay, Google Pay, Samsung Pay — emulates contactless credit card), quick Bluetooth/Wi-Fi pairing, reading NFC tags (smart posters, inventory), transit cards.
• **Passive NFC tags** are unpowered; drawn power from the phone's field. **Active NFC** (in phones) transmits.
• Security concerns: **skimming** at close range, relay attacks. Most phones require screen unlock for payment NFC transactions.` },
        { heading: "Webcam, Microphone & Wi-Fi Antenna Placement", content: `**Webcam / Camera (integrated):**
• Usually mounted in the **display bezel** — top-center is standard, though some laptops (older Dells, some gaming) placed it at the bottom ("nose-cam" — unflattering angle).
• Connected via a **thin ribbon cable** routed through the **display hinge** to the motherboard.
• **IR (infrared)** cameras added for Windows Hello facial recognition — detect depth to prevent photo spoofing.
• **Privacy shutter** — physical slider covering lens. Newer business laptops include this as a feature.
• **Replacement:** rarely user-serviceable; requires removing the display bezel and disconnecting delicate ribbon cable. If a webcam fails, most users use an external USB webcam as workaround.

**Troubleshooting:**
• Camera not detected → Device Manager → Imaging devices. Disable/re-enable. Check privacy settings (Settings → Privacy → Camera).
• Blocked by OS privacy switch or BIOS — some laptops have a function key that toggles camera power.

**Microphone:**
• Tiny MEMS microphones embedded in the display bezel (often dual-mic for stereo and noise cancellation) or chassis near the keyboard.
• Connected via ribbon cable similar to webcam.
• **Replacement:** usually requires display bezel removal.

**Troubleshooting:**
• No audio input → Settings → Sound → Input device. Check app permissions.
• Low volume → Disable exclusive mode, check mic boost in advanced properties.
• Background noise → Check "noise suppression" feature in Windows 11 or via vendor software (Dell Optimizer, Lenovo Vantage).

**Wi-Fi Antenna — placement matters:**
• Internal laptops have **two or three antennas** — thin foil/wire elements routed through the **display hinge** and laid along the top/sides of the display panel.
• Display-mounted location maximizes signal (display is tallest point; signals clear of keyboard RF noise).
• When disconnected from the Wi-Fi card during service (or not fully seated), Wi-Fi range drops dramatically — signal may still show "connected" but unstable at distance.
• **Aux and main antennas** are labeled on the M.2 Wi-Fi card; white/main and black/aux (vendor specific). **Reversing them works but may reduce MIMO performance.**
• Most laptops route 2 antennas for 2×2 MIMO; some newer 6E/Wi-Fi 7 cards need 2 or 3.

**Replacement tips:**
• Before removing the display assembly: **note where each antenna cable is routed** (pictures of service manual).
• When reinstalling: press the gold connector straight down onto the card — don't slide; it pops onto a micro-coaxial socket.
• **U.FL / MHF4 connectors** — common micro-coax, fragile; do not reuse if visibly damaged.

**Symptom: very weak Wi-Fi after service** → one or both antennas disconnected. Open the unit, verify both connectors are seated on the Wi-Fi card.` }
      ]},
      { title: "1.2 — Accessories & Connectivity", sections: [
        { heading: "Connection Methods & Accessories", content: `**Connection types:**
• **USB-C** — reversible. Carries data, video (DisplayPort Alt Mode), and power (USB PD up to 240W). Used with USB 3.x, Thunderbolt 3/4, USB4
• **Micro-USB** — older Android phones. Being phased out
• **Mini-USB** — legacy (old cameras, GPS). Rarely seen
• **Lightning** — Apple proprietary. iPhones pre-15, some iPads
• **NFC** — ~4 cm range. Contactless payments, quick Bluetooth pairing
• **Bluetooth** — ~10m range (Class 2). Peripherals, audio, file transfer. Operates on 2.4 GHz
• **Tethering/Hotspot** — share cellular data via Wi-Fi (most common), USB (most stable), or Bluetooth (slowest)

**Accessories:**
• **Docking station** — multiple ports (USB, HDMI, DisplayPort, Ethernet, audio) through single connection. Turns laptop into desktop setup. Often provides charging.
• **Port replicator** — simpler than dock. Adds ports without additional functionality like charging
• **Stylus** — active (powered, Bluetooth-paired, pressure-sensitive) or passive (capacitive screen)
• **Trackpad / Drawing pad / Track points** — trackpad is the flat surface; drawing pad is external input for creative work; **track point** is the small pointing-stick nub (e.g., red nub on ThinkPads) between keyboard keys
• **Headsets, speakers, webcam** — common peripherals` }
      ]},
      { title: "1.3 — Network Connectivity & App Support", sections: [
        { heading: "Cellular, Wi-Fi & Bluetooth", content: `**Cellular standards:**
• **3G** — legacy, being decommissioned by carriers
• **4G/LTE** — current standard for most areas. Typical 10–50 Mbps
• **5G** — newest. Three types: low-band (good range, modest speed), mid-band (balance), mmWave (extremely fast, very short range)

**SIM / eSIM** [NEW]:
• **SIM (Subscriber Identity Module)** — physical card identifying subscriber to carrier. Contains IMSI, authentication keys. Sizes: Standard → Micro → Nano (current)
• **eSIM (embedded SIM)** — built into device. Activated digitally, no physical card. Allows multiple carrier profiles on one device.

**Bluetooth pairing process:**
1. Put device in discoverable mode
2. Select from device list on phone/laptop
3. Confirm PIN/code
4. Test connectivity

**Location services:**
• **GPS** — satellite-based. Most accurate outdoors. 3–5 meter accuracy
• **Cellular location** — triangulation from cell towers. Less accurate, works indoors
• Used for: navigation, find my device, geotagging, location-based policies` },
        { heading: "MDM & Mobile Sync [NEW for 1201]", content: `**MDM (Mobile Device Management)** — software for organizations to remotely manage, configure, and secure mobile devices.

• **Corporate-owned vs. BYOD** — different levels of control and privacy
• **Policy enforcement** — require screen lock, encrypt device, restrict app installs, remote wipe if lost/stolen
• **Corporate applications** — pushed to devices via MDM (email, VPN, custom business apps)
• **Cloud storage** — MDM can configure automatic sync to corporate cloud services

**Mobile device synchronization:**
• **Calendar sync** — events synced across devices via cloud (iCloud, Google, Exchange)
• **Contacts sync** — contact list synced across devices
• **Business applications / Mail** — corporate email via Exchange, Google Workspace, etc.
• **Data caps** — cellular data limits. MDM can enforce Wi-Fi-only for large transfers` }
      ]},
      { title: "1.3 Deep Dive — CertMaster Additions", sections: [
        { heading: "Mobile Email Configuration (EAS, Autodiscover)", content: `**Protocols a mobile device may use for email:**
| Protocol | Port | Role |
|----------|------|------|
| **SMTP** | 25 / 587 (submit) / 465 (SSL) | **Outgoing** mail from device to server |
| **POP3** | 110 / 995 (SSL) | Downloads mail, typically **removes from server** |
| **IMAP** | 143 / 993 (SSL) | Keeps mail on server, syncs folders across devices |
| **Exchange ActiveSync (EAS)** | HTTPS (443) | Microsoft protocol — **push email + calendar + contacts + remote wipe + policy enforcement**. Default for Exchange Online / Microsoft 365 accounts on iOS/Android. |
| **MAPI / Exchange Web Services (EWS)** | HTTPS (443) | Outlook desktop/web protocols. |

**Autodiscover** — feature where the mail client finds server settings from just the email address + password. Looks up DNS records (autodiscover.domain.com, SRV records) and contacts the server for configuration. Commercial providers (Outlook.com, Gmail, iCloud) have this built in; corporate Exchange relies on internal DNS.

**Commercial vs. corporate email setup:**
• **Commercial** (Gmail, iCloud, Yahoo): just email + password. Autodiscover handles the rest.
• **Corporate/ISP** (manual): server address (IMAP/SMTP), port, SSL/TLS setting, authentication method. Ask user's IT department or ISP for these.` },
        { heading: "MDM vs. EMM & Mobile Security Policies", content: `**MDM (Mobile Device Management)** — controls the **device** (enforces passcode, encryption, remote wipe, app install restrictions).

**EMM (Enterprise Mobility Management)** — broader than MDM. Adds:
• **Mobile Application Management (MAM)** — controls specific apps without full device control (important for BYOD where user owns the device)
• **Mobile Content Management (MCM)** — secures and controls files/documents on the device
• **Identity management** — SSO integration

**UEM (Unified Endpoint Management)** — newest iteration. Manages mobile + PC + IoT from one console.

**Common enforceable policies:**
• Minimum OS version, passcode complexity, screen lock timeout
• **Remote wipe** — factory reset lost/stolen devices. Corporate wipe can remove only corporate data (leaving personal data intact on BYOD).
• **Geofencing** — restrict device functions based on location (e.g., disable camera on-premises at a secure facility)
• **Containerization** — separate work profile from personal profile (Android Work Profile, iOS managed apps)
• App whitelisting / blacklisting

**Location services on mobile:**
• **GPS** — satellite, 3–5 m accuracy outdoors, doesn't work indoors
• **A-GPS (Assisted GPS)** — uses cellular network to get initial satellite info faster
• **Cellular triangulation** — tower-based, works indoors, less accurate (~100+ m)
• **Wi-Fi positioning** — device looks up known Wi-Fi SSIDs in a crowdsourced database, very accurate in urban areas` },
        { heading: "Mobile VPN Configuration", content: `**Why mobile VPNs:** Encrypt traffic on public Wi-Fi, reach corporate resources from remote locations, bypass geo-blocks, maintain privacy.

**VPN types supported natively on mobile OSes:**
| Protocol | iOS | Android | Notes |
|----------|-----|---------|-------|
| **IKEv2/IPsec** | ✓ | ✓ | **Recommended default** — handles network transitions (Wi-Fi ↔ cellular) gracefully |
| **L2TP/IPsec** | ✓ | ✓ | Legacy, slower than IKEv2 |
| **IPsec** | ✓ | ✓ | Cisco IPSec, native client apps |
| **OpenVPN** | via app | via app | Requires OpenVPN Connect app |
| **WireGuard** | via app | via app | Modern, fast, simpler; requires WireGuard app |
| **SSL/TLS VPN** | via app | via app | Cisco AnyConnect, Palo Alto GlobalProtect, Fortinet FortiClient |
| **PPTP** | Removed iOS 10+ | Removed Android 12+ | **Insecure — do NOT use** |

**Two enrollment methods:**
• **Manual configuration** — admin provides server address, username, shared secret/cert, authentication method
• **MDM-pushed profile** — corporate MDM (Intune, Jamf, Workspace ONE) pushes a **VPN configuration profile** that auto-provisions. User just taps to connect.

**iOS VPN setup (manual):**
1. Settings → General → VPN & Device Management → VPN → Add VPN Configuration
2. Choose type (IKEv2 / IPsec / L2TP)
3. Fill in: Description, Server, Remote ID, Local ID, Authentication (Username/password or Certificate)
4. Toggle **Send All Traffic** if you want full tunnel (default) or off for split-tunnel.

**Android VPN setup:**
1. Settings → Network & Internet → VPN → +
2. Name, Type, Server address, credentials
3. Android 12+ supports IKEv2/IPsec natively; earlier versions used L2TP/IPsec or required an app
4. **Always-on VPN** option — OS blocks non-VPN traffic when VPN is disconnected (prevents leaks)

**Per-app VPN (enterprise):**
• MDM can configure **per-app VPN** — only specific apps (Outlook, browser, company apps) route through the VPN, leaving personal apps on the direct internet
• Preserves user privacy on BYOD devices

**Always-On VPN (corporate):**
• Forces all traffic through VPN at all times; if VPN fails, apps lose network access
• Required for environments where policy mandates no direct-internet use
• Configured via MDM profile

**Troubleshooting mobile VPN:**
| Symptom | Likely cause |
|---------|--------------|
| **Connects, no internet** | Split-tunnel misconfigured, DNS not being pushed, routing conflict |
| **Disconnects on Wi-Fi handoff** | L2TP/PPTP dropout — switch to IKEv2 (designed for mobility) |
| **Slow VPN** | Server distance/load, encryption overhead, cellular bandwidth, MTU mismatch |
| **Cert errors** | Certificate expired, clock out of sync (NTP), root CA not trusted on device |
| **Auth failed** | Wrong credentials, MFA token, account locked, expired user certificate |

**VPN vs ZTNA (modern alternative):** Zero Trust Network Access (ZTNA) is replacing traditional VPNs in many enterprises. Instead of full network access, ZTNA grants per-application access based on identity + device posture (Zscaler, Cloudflare Access, Tailscale). Mentioned for awareness; traditional VPN still primary on the exam.` }
      ]}
    ]
  },
  {
    id: 2, domain: "Networking", weight: 23, color: "#00b4d8",
    topics: [
      { title: "2.1 — Ports & Protocols", sections: [
        { heading: "Port Numbers (Brain Dump Material)", content: `Memorize these cold — tested heavily:

| Port | Protocol | TCP/UDP | Purpose |
|------|----------|---------|---------|
| 20/21 | **FTP** | TCP | File transfer (20=data, 21=control) |
| 22 | **SSH/SFTP/SCP** | TCP | Secure remote access, secure file transfer |
| 23 | **Telnet** | TCP | Remote access — **UNENCRYPTED** (insecure) |
| 25 | **SMTP** | TCP | Sending email (outbound) |
| 53 | **DNS** | TCP/UDP | Domain name resolution |
| 67/68 | **DHCP** | UDP | IP assignment (67=server, 68=client) |
| 80 | **HTTP** | TCP | Web traffic — unencrypted |
| 110 | **POP3** | TCP | Receiving email — downloads and **deletes** from server |
| 143 | **IMAP** | TCP | Receiving email — keeps mail **on server**, syncs |
| 137-139 | **NetBIOS/NetBT** | TCP/UDP | Legacy Windows name resolution and file sharing |
| 389 | **LDAP** | TCP/UDP | Directory services (Active Directory queries) |
| 443 | **HTTPS** | TCP | Secure web — encrypted with TLS |
| 445 | **SMB/CIFS** | TCP | Windows file and printer sharing |
| 3389 | **RDP** | TCP/UDP | Remote Desktop Protocol |

⚠️ **SNMP 161/162 was on the 1101 but is NOT listed in the 1201 port objectives.** Don't include in brain dump.

**POP3 vs IMAP:**
• **POP3 (110)** — downloads to device, **removes from server**. Single-device use.
• **IMAP (143)** — keeps mail **on server**, syncs across devices. Better for multiple devices.` },
        { heading: "TCP vs UDP", content: `Both at **Layer 4 (Transport)** of OSI model.

**TCP (Transmission Control Protocol)** — connection-oriented. Guarantees delivery via **3-way handshake** (SYN → SYN-ACK → ACK). Retransmits lost packets. Used when accuracy matters.
Analogy: certified mail — you get confirmation of delivery.
Examples: HTTP/HTTPS, FTP, SSH, SMTP, POP3, IMAP

**UDP (User Datagram Protocol)** — connectionless. Best-effort delivery, no handshake, no retransmission. Faster but unreliable. Used when speed matters.
Analogy: shouting across a room — fast, no guarantee.
Examples: DNS queries, DHCP, streaming video, VoIP, TFTP

**Key combinations:**
• **DNS uses both** — UDP for standard queries (fast), TCP for zone transfers (reliable)
• **RDP uses both** — TCP and UDP
• **DHCP uses UDP** (67/68)` }
      ]},
      { title: "2.1 Deep Dive — CertMaster Additions", sections: [
        { heading: "Port Ranges & the 3-Way Handshake", content: `**IANA port ranges** (65,536 total ports, 0–65535):
• **0–1023: Well-known ports** — assigned to core services (HTTP 80, SSH 22, etc.). All the numbers on the brain-dump table above fall here.
• **1024–49151: Registered ports** — reserved for specific applications (e.g., MySQL 3306, PostgreSQL 5432, Minecraft 25565).
• **49152–65535: Dynamic / Ephemeral / Private ports** — short-lived client-side ports. When your browser hits port 80, your machine picks a random ephemeral port (e.g., 53472) as the source.

**TCP 3-way handshake** (connection establishment):
1. Client → Server: **SYN** (synchronize — "I want to connect, here's my sequence number")
2. Server → Client: **SYN-ACK** (acknowledges client's SYN, sends its own sequence number)
3. Client → Server: **ACK** (acknowledges server — connection established)

After the 3-way handshake, data flows. Connection teardown uses **FIN / FIN-ACK / ACK** (similar pattern). UDP has no handshake.

**Secure variants of insecure protocols** (know these pairs):
| Insecure | Secure equivalent | Secure port |
|----------|-------------------|-------------|
| HTTP (80) | HTTPS | **443** |
| FTP (20/21) | SFTP (over SSH) / FTPS (over TLS) | **22** / 990 |
| Telnet (23) | SSH | **22** |
| SMTP (25) | SMTPS / SMTP + STARTTLS | 465 / 587 |
| POP3 (110) | POP3S | 995 |
| IMAP (143) | IMAPS | 993 |
| LDAP (389) | LDAPS | 636 |

Exam tip: if the scenario mentions **credentials sent in clear text** or **compliance/security concerns**, the answer is almost always the secure equivalent.` }
      ]},
      { title: "2.2 — Wireless Technologies", sections: [
        { heading: "Frequency Bands & Channel Selection [NEW]", content: `| Band | Range | Penetration | Speed | Congestion |
|------|-------|-------------|-------|------------|
| **2.4 GHz** | Longest (best) | Best (through walls) | Slowest | Worst (most congested) |
| **5 GHz** | Medium | Moderate | Faster | Less congested |
| **6 GHz** [NEW] | Shortest | Least | Fastest | Least (newest, fewest devices) |

**Channel selection** [NEW for 1201]:
• **2.4 GHz** — 11 channels in US. Only **1, 6, and 11** don't overlap — always use these three
• **5 GHz** — many more non-overlapping channels, less interference
• **6 GHz** — most available channels, least congestion. Used by Wi-Fi 6E and Wi-Fi 7
• **Wider channels** = faster speeds but fewer non-overlapping channels. 80 MHz is a good balance.` },
        { heading: "802.11 Standards & Other Wireless", content: `The 1201 generalizes 802.11 rather than testing each individually:
• **802.11n (Wi-Fi 4)** — 2.4 + 5 GHz, up to 600 Mbps, introduced MIMO
• **802.11ac (Wi-Fi 5)** — **5 GHz only**, up to 6.9 Gbps, MU-MIMO
• **802.11ax (Wi-Fi 6/6E)** — 2.4 + 5 + 6 GHz, OFDMA, better in dense environments
• **802.11be (Wi-Fi 7)** — 2.4 + 5 + 6 GHz, up to 46 Gbps theoretical

Key: Wi-Fi 5 is **5 GHz only**. Wi-Fi 6E adds **6 GHz** band.

**Bluetooth** — ~10m (Class 2), 2.4 GHz. Pairing: discoverable → select → PIN → test.
**NFC** — ~4 cm. Contactless payments, quick pairing.
**RFID** — inventory tracking, access badges. Passive tags (powered by reader's signal) and active tags (battery-powered, longer range).` }
      ]},
      { title: "2.2 Deep Dive — CertMaster Additions", sections: [
        { heading: "Wireless Security Protocols (WEP → WPA3)", content: `**Evolution of Wi-Fi security** — exam WILL test these:

| Protocol | Year | Encryption | Status |
|----------|------|-----------|--------|
| **WEP (Wired Equivalent Privacy)** | 1997 | RC4 stream cipher, 40/104-bit keys | **Broken — cracked in minutes. Never use.** |
| **WPA (Wi-Fi Protected Access)** | 2003 | **TKIP** (Temporal Key Integrity Protocol) | Interim fix for WEP. Deprecated. |
| **WPA2** | 2004 | **AES-CCMP** (128-bit) | **Current baseline.** Vulnerable to KRACK attack on handshake. |
| **WPA3** | 2018 | **AES-GCMP** + SAE (Simultaneous Authentication of Equals) | Current best. Replaces PSK handshake, forward secrecy, stronger against offline dictionary attacks. |

**Authentication modes:**
• **Personal / PSK (Pre-Shared Key)** — single password shared by all users. Home/small office. Called **"WPA2-Personal"** or **"WPA3-Personal"** in settings.
• **Enterprise / 802.1X** — each user authenticates with unique credentials via a **RADIUS server**. Corporate networks. Called **"WPA2-Enterprise"**. Uses EAP (Extensible Authentication Protocol) methods like PEAP, EAP-TLS.

**WPS (Wi-Fi Protected Setup)** — simplified pairing via 8-digit PIN or push-button. **INSECURE** — PIN is brute-forceable in hours. **Disable WPS** on any production network.` },
        { heading: "SSID, BSSID, RSSI, and Channel Planning", content: `**Identifiers:**
• **SSID (Service Set Identifier)** — human-readable network name (e.g., "HomeWiFi"). Up to 32 characters. **Disabling SSID broadcast** does NOT secure a network — the SSID is still visible in probe requests; it's security theater.
• **BSSID (Basic SSID)** — the MAC address of the access point's radio. In multi-AP networks, every AP has the same SSID but a unique BSSID. Clients roam between BSSIDs.
• **ESSID (Extended SSID)** — a set of APs with the same SSID forming one roaming network.

**RSSI (Received Signal Strength Indicator)** — measured in **dBm** (negative values; closer to 0 is stronger):
• **−30 dBm** — excellent, right next to AP
• **−50 to −60 dBm** — strong, reliable
• **−67 dBm** — minimum for VoIP/video
• **−70 dBm** — minimum for reliable data
• **−80 dBm and worse** — unreliable
Every **3 dB drop = half the signal power**. A Wi-Fi analyzer app shows RSSI to help with placement.

**Non-overlapping channels on 2.4 GHz (US):** Only **1, 6, and 11**. The 11 channels otherwise overlap — if two nearby APs are on channel 1 and channel 3, they interfere with each other. With 5 GHz (24+ non-overlapping 20 MHz channels) and 6 GHz (more still), channel planning is easier.

**Channel width trade-off** — wider channel = faster speed but fewer non-overlapping channels. Common widths: 20 MHz (most compatible), 40 MHz, 80 MHz (Wi-Fi 5+), 160 MHz (Wi-Fi 6+).` },
        { heading: "Wi-Fi Modes, MIMO/MU-MIMO/OFDMA, Power Metrics, PAN Tech (Lesson 5D)", content: `**Wi-Fi infrastructure vs ad-hoc mode:**
• **Infrastructure mode** — clients (stations) connect to a central **Access Point (AP)**. This is what 99% of Wi-Fi networks use. In IEEE 802.11 terminology, an infrastructure group is a **BSS (Basic Service Set)**. The AP's radio MAC address is the **BSSID (Basic Service Set Identifier)**.
• **Ad-hoc mode** — stations connect directly to each other peer-to-peer, no AP. Rare today.
• **IBSS (Independent BSS)** — the formal name for an ad-hoc Wi-Fi group.
• **ESS (Extended Service Set)** — multiple APs sharing the same SSID for roaming across a large area.

**Distribution System (DS)** — the wired network (Ethernet) connecting APs to the rest of the LAN. APs act as **bridges** between the wireless BSS and the wired DS.

**Three Wi-Fi frequency bands — full trade-off table:**

| Band | Indoor range | Penetration | Congestion | Data rate | Notes |
|------|-------------|-------------|------------|-----------|-------|
| **2.4 GHz** | **~45 m / 150 ft** | **Best** (through walls/floors) | **Highest** (microwaves, Bluetooth, many Wi-Fi networks) | Lower | Only 3 non-overlapping channels (1/6/11) in US |
| **5 GHz** | ~30 m / 100 ft | Medium | Moderate | Higher | 20+ non-overlapping 20 MHz channels |
| **6 GHz** | **~15 m / 50 ft** | **Worst** | **Lowest** (newest) | **Highest** | Many wide channels available; Wi-Fi 6E+ only |

Realistically, clients connect at **full speed only within 1/3 to 1/2 of nominal range**.

**Dynamic Frequency Selection (DFS)** — required on certain 5 GHz channels (U-NII-2 sub-bands). If the AP detects **radar** signals on that channel, it must switch to a different channel to avoid interfering with aviation/weather radar.

**U-NII (Unlicensed National Information Infrastructure)** sub-bands — divisions of the 5 GHz frequency range: U-NII-1, U-NII-2A, U-NII-2C, U-NII-3. Different ones have different power and DFS requirements.

**Modulation techniques:**
| Modulation | Used by | Characteristics |
|-----------|---------|-----------------|
| **DSSS (Direct-Sequence Spread Spectrum)** | 802.11b | Spreads signal across 22 MHz, interference-resistant, slower |
| **OFDM (Orthogonal Frequency-Division Multiplexing)** | 802.11a/g/n/ac/ax | Divides channel into narrow sub-carriers, efficient, high speed |
| **OFDMA (Orthogonal Frequency-Division Multiple Access)** | Wi-Fi 6 (ax) | OFDM + simultaneous multiple-user access. Massive density improvement. |

**Regional 2.4 GHz channel rules:**
• **Americas/US**: channels 1–11 legal
• **Europe**: 1–13 legal
• **Japan**: 1–14 legal

**Wi-Fi standards — the summary everyone needs:**

| Standard | Wi-Fi # | Year | Band | Max rate | Channel widths | Innovations |
|----------|---------|------|------|----------|----------------|-------------|
| **802.11a** | — | 1999 | 5 GHz | 54 Mbps | 20 MHz | First 5 GHz |
| **802.11b** | — | 1999 | 2.4 GHz | 11 Mbps | 22 MHz (DSSS) | First mainstream Wi-Fi |
| **802.11g** | — | 2003 | 2.4 GHz | 54 Mbps | 20 MHz (OFDM) | Speed of 'a' in 2.4 GHz band |
| **802.11n** | **Wi-Fi 4** | 2009 | 2.4 + 5 GHz | 600 Mbps | 20 / **40 MHz** | **MIMO**, channel bonding, dual-band |
| **802.11ac** | **Wi-Fi 5** | 2014 | **5 GHz only** | ~6.9 Gbps | up to **160 MHz** | **Downlink MU-MIMO**, 8 streams |
| **802.11ax** | **Wi-Fi 6** | 2019 | 2.4 + 5 GHz | ~9.6 Gbps | up to 160 MHz | **OFDMA**, uplink MU-MIMO, better density |
| **802.11ax (Wi-Fi 6E)** | Wi-Fi 6E | 2021 | +**6 GHz** | ~9.6 Gbps | up to 160 MHz | Adds 6 GHz band |
| **802.11be** | **Wi-Fi 7** | 2024 | 2.4 + 5 + 6 GHz | **~46 Gbps** | up to **320 MHz** | **MLO (Multi-Link Operation)**, **MRU (Multi-Resource Units)** |

**MIMO (Multiple Input Multiple Output)** — multiple antennas transmit/receive streams simultaneously. Notation **2×2**, **3×3**, **4×4** = (TX antennas × RX antennas).

**MU-MIMO (Multi-User MIMO)**:
• **Downlink MU-MIMO (Wi-Fi 5)** — AP talks to **up to 4 clients simultaneously** using separate beams.
• **Uplink MU-MIMO (Wi-Fi 6)** — clients can transmit to AP simultaneously. Up to 8 clients.

**OFDMA** (Wi-Fi 6+) — divides a channel into smaller **resource units (RUs)** that can be allocated to different clients at the same time. Huge benefit in crowded environments (airports, stadiums, dorms).

**Wi-Fi 7 MLO (Multi-Link Operation)** — single device connects to an AP simultaneously over 2.4 + 5 + 6 GHz bands. Can send data across multiple bands at once, or use one as primary and others as failover.

**Dual-band vs tri-band APs:**
• **Dual-band AP** — one 2.4 GHz radio + one 5 GHz radio
• **Tri-band AP** — one 2.4 GHz radio + **two 5 GHz radios** (more capacity), OR 2.4 + 5 + 6 GHz (Wi-Fi 6E/7)

**Channel bonding**: combining adjacent channels for more bandwidth. 2 × 20 MHz → 40 MHz (Wi-Fi 4+). **Only practical in 5 GHz/6 GHz** due to 2.4 GHz congestion.

**SSID (Service Set Identifier):**
• **Up to 32 bytes** (typically 32 ASCII characters).
• Best practice: ASCII letters, digits, hyphens, underscores. Avoid spaces, special characters, non-ASCII — some client devices misbehave.
• Can be **broadcast (visible)** or **hidden (not in AP's beacon)**. Hiding is security-by-obscurity only — easy to detect with a Wi-Fi analyzer.

**Same SSID for both bands vs. separate:**
• **Same SSID**: client and AP negotiate band based on signal strength ("band steering"). Simpler for users.
• **Separate SSIDs** (e.g., "HomeNet" and "HomeNet-5G"): user chooses. Gives explicit control.

**Wireless signal strength — dBm scale (logarithmic):**
• **0 dBm = 1 milliwatt (1 mW)**
• Negative values = fractions of a milliwatt
• **-30 dBm ≈ 0.001 mW = excellent** (right next to the AP)
• **-65 dBm = good**, reliable for most use
• **-80 dBm = poor**, likely packet loss/drops
• **+3 dB = ~double the power**, **-3 dB = half the power**

**Signal-to-Noise Ratio (SNR)**:
• SNR = Signal (dBm) − Noise (dBm), expressed as dB
• Example: signal -65 dBm, noise -90 dBm → SNR = **25 dB (good)**
• Example: signal -65 dBm, noise -80 dBm → SNR = **15 dB (marginal)**
• **Higher SNR = better connection**. Dropping signal strength OR rising noise hurts performance equally.

**Wi-Fi analyzer** — software (on laptop or phone) or dedicated hardware that shows:
• All SSIDs in range with their signal strength and channel
• Channel overlap / congestion graphs
• Connection speed, security type
Use when diagnosing slow Wi-Fi to find less-congested channels. Software examples: **inSSIDer**, **NetSpot**, **WiFi Analyzer** app.

**Long-range fixed wireless** (site-to-site bridging):
• Uses high-gain **directional microwave antennas** (often parabolic dishes) aimed at each other.
• Line-of-sight required — obstructions (trees, buildings, Earth's curvature at distance) block signal.
• Range: **up to ~30 miles** with proper alignment.
• **Licensed spectrum** — purchased exclusive rights (FCC in US); interference can be legally addressed.
• **Unlicensed spectrum** — public bands (2.4/5 GHz, 900 MHz); interference risk, power limits.

**FCC (Federal Communications Commission)** — US regulator of radio spectrum.

**Signal power components for fixed wireless:**
| Component | Meaning | Units |
|-----------|---------|-------|
| **Transmit power** | Radio output strength | dBm |
| **Antenna gain** | Directionality boost (focus beam, not omnidirectional) | **dBi** (decibels isotropic) |
| **EIRP (Effective Isotropic Radiated Power)** | TX power + antenna gain | dBm |

**Tradeoff**: at 2.4 GHz, +3 dBi gain allows -1 dBm TX reduction (preserves EIRP while going higher-gain).

**Personal Area Networking technologies (not Wi-Fi):**

**Bluetooth:**
| Version | Max speed | Range |
|---------|-----------|-------|
| 1.x / 2.x (classic) | 1–3 Mbps | 10 m (30 ft) |
| 3/4 (with HS) | up to **24 Mbps** (via 802.11 radio offload) | Similar |
| **5** | Up to 2 Mbps native | **up to 240 m (800 ft)** |

• **Pairing**: security procedure to authenticate two devices — a PIN or numeric confirmation shared briefly. Creates a trusted shared key.
• **BLE (Bluetooth Low Energy)** — introduced in **v4**. For battery-powered IoT sensors and beacons that transmit briefly and rarely. **Not backward-compatible with classic Bluetooth**, but devices can support both modes.
• **Bluetooth 5** — **4× the range, 2× the speed, 8× the messaging** compared to 4. Lower power.

**RFID (Radio Frequency Identification):**
| Type | Powered? | Typical range |
|------|----------|---------------|
| **Passive RFID** | Unpowered — activated by reader's field | **Up to ~25 cm** (close-range) — some active systems reach further |
| **Active RFID** | Battery-powered | **Up to 100 m** |

Used for: inventory tags, parcel tracking, access badges, electronic locks.

**NFC (Near Field Communication):**
• **Peer-to-peer variant of RFID** — each device can be both reader and tag.
• **Max range: ~4 cm (1.6 inches)** — very short by design (security).
• Data rates: **106, 212, or 424 Kbps**.
• **Primary uses**:
  — **Contactless payment** (Apple Pay, Google Pay, credit card tap-to-pay)
  — **Security/access badges** (modern corporate ID cards)
  — **Shelf labels** (retail stock)
  — **Device pairing** (tap-to-pair Bluetooth headphones)` }
      ]},
      { title: "2.3 — Networked Host Services", sections: [
        { heading: "Server Roles & Internet Appliances", content: `| Server | Purpose |
|--------|---------|
| **DNS** | Translates domain names to IP addresses |
| **DHCP** | Automatically assigns IP, subnet, gateway, DNS to clients |
| **File server** | Centralized file storage and sharing |
| **Print server** | Manages network printers and print queues |
| **Mail server** | Email sending (SMTP) and receiving (POP3/IMAP) |
| **Syslog** | Collects and stores log data from network devices |
| **Web server** | Hosts websites (HTTP/HTTPS) |
| **AAA server** | Authentication, Authorization, Accounting. RADIUS and TACACS+ protocols |
| **Database server** [NEW] | Hosts databases (SQL Server, MySQL, PostgreSQL) |
| **NTP server** [NEW] | Network Time Protocol. Synchronizes clocks across devices. Critical for log correlation and authentication |

**Internet appliances:**
• **Spam gateway** — filters email before reaching mail server. Blocks spam, phishing, malware
• **UTM (Unified Threat Management)** — all-in-one: firewall + antivirus + IDS/IPS + content filtering + VPN
• **Load balancer** — distributes traffic across multiple servers
• **Proxy server** — intermediary between clients and internet. Caches content, filters URLs, provides anonymity

**Legacy/embedded:** **SCADA** — controls industrial equipment (power plants, water treatment). Weak security, must be isolated.
**IoT devices** — smart devices with weak default passwords, rarely updated firmware. Best practice: isolate on separate VLAN.` }
      ]},
      { title: "2.3 Deep Dive — CertMaster Additions", sections: [
        { heading: "Remote Access Protocols & Proxy Types", content: `**Remote access / remote management** (know these distinctions):
| Protocol | Port | Encrypted? | Platform | Use |
|----------|------|-----------|----------|-----|
| **RDP** | 3389 | Yes | Windows native | Full graphical desktop — "takes over" the remote session |
| **SSH** | 22 | Yes | Linux/Unix, network gear | Encrypted command-line access |
| **Telnet** | 23 | **NO** | Legacy | Unencrypted CLI — DO NOT use on production networks |
| **VNC (Virtual Network Computing)** | 5900 | **Not by default** (tunnel over SSH/VPN) | Cross-platform | Open source alternative to RDP |
| **RMM (Remote Monitoring & Management)** | Varies | Yes | Cross-platform | Agent-based tools like ConnectWise, NinjaRMM — used by MSPs |

**Proxy server types:**
• **Forward proxy** — sits between **internal clients** and the internet. Filters outbound requests, caches content, logs usage, enforces policy. Common in schools/corporations.
• **Reverse proxy** — sits between **the internet** and internal servers. Distributes load, terminates SSL, hides internal server details. Examples: NGINX, HAProxy, Cloudflare.

**SNMP (Simple Network Management Protocol)** — network device monitoring. **Ports 161 (queries) / 162 (traps)**.
• **Manager** polls agents for health metrics (SNMP GET)
• **Agent** on each device responds and can send **SNMP traps** (unsolicited alerts pushed to the manager) on events like link-down, temperature alarm, port flap
• **Versions**: v1 (clear-text community strings — insecure), v2c (same, slightly improved), **v3 (encrypted, authenticated — use this)**
• Note: SNMP is not listed in 1201 port objectives, but appears in Module 7A of the CertMaster content — know the trap concept.

**NTP (Network Time Protocol)** — UDP port **123**. Hierarchical stratum levels (Stratum 0 = atomic clock / GPS, Stratum 1 = servers directly attached to Stratum 0, etc.). Critical for log correlation, Kerberos authentication (>5 min clock skew = auth failure), certificate validation.` }
      ]},
      { title: "2.4 — Network Configuration Concepts", sections: [
        { heading: "DNS Record Types", content: `| Record | Purpose | Example |
|--------|---------|---------|
| **A** | Maps hostname to **IPv4** address | webserver.example.com → 192.168.1.10 |
| **AAAA** | Maps hostname to **IPv6** address | webserver.example.com → 2001:db8::1 |
| **CNAME** [NEW] | Alias — points one name to another name | www.example.com → webserver.example.com |
| **MX** | Mail exchange — directs email to mail servers | example.com → mail.example.com |
| **TXT** | Stores text data for email security | SPF, DKIM, DMARC |

**TXT record subtypes:**
• **SPF** — lists authorized mail servers for a domain
• **DKIM** — email signature verification
• **DMARC** — policy for handling failed SPF/DKIM checks

**CNAME** is new for 1201. A CNAME has no IP of its own — it points to another DNS name that resolves to an IP.` },
        { heading: "DHCP, VLAN, VPN", content: `**DHCP concepts:**
• **Lease** — IP address assigned for a set time period
• **Reservation** — permanently assigns a specific IP to a specific MAC address via DHCP
• **Scope** — the range of IPs DHCP can assign (e.g., 192.168.1.100–200)
• **Exclusions** [NEW] — specific addresses within scope that DHCP will NOT assign (reserved for static devices like printers, servers)

**VLAN (Virtual LAN):**
• Logically separates traffic on the same physical switch
• Devices on VLAN 10 cannot reach VLAN 20 without a router (inter-VLAN routing)
• Use cases: separate departments, isolate IoT, improve security, reduce broadcast traffic

**VPN (Virtual Private Network):**
• Encrypted tunnel over the internet for secure remote access
• **Site-to-site** — connects two office networks
• **Client-to-site** — remote user connects to office network` },
        { heading: "DHCP Reservations, DNS Records, VLANs, VPNs (Lesson 6D)", content: `**DHCP scope detail:**
• **Scope** = the range of IPs a DHCP server can offer on a given subnet.
• Must **exclude any statically-assigned IPs** (router's own LAN IP, servers, printers with fixed addresses).
• Example: SOHO router LAN IP 192.168.0.1; DHCP scope 192.168.0.**100 to 192.168.0.199** → 100 usable dynamic leases, leaving .2–.99 for static assignments if needed.

**DHCP lease renewal:**
• Client tries to **renew** the lease at **50% of lease duration** (T1 timer) by contacting the server that originally issued it.
• If that fails, at **87.5% (T2 timer)** the client tries **any** DHCP server on the network.
• If both fail, the lease expires → client releases the IP → restarts DORA process.

**DHCP ports**:
• **Server listens on UDP 67**, **client listens on UDP 68**.
• Both client→server and server→client messages use **broadcast** until the client has a confirmed IP.

**ARP check**: after DHCPACK, the client **broadcasts an ARP message** to verify no other device is already using the offered IP. If a conflict is detected, the client **declines** the address and requests a different one.

**DHCP reservations** (aka **static DHCP / fixed leases**):
• DHCP server is configured with **a list of MAC addresses** and the IP each should always receive.
• When one of those devices requests a lease, the server issues **that specific reserved IP**.
• **Alternative to pure static** assignment — keeps central management on the DHCP server.
• Commonly used for **printers, VoIP phones, cameras, servers** that need predictable IPs but shouldn't be configured manually per device.
• Some OSes send a **Client Identifier** rather than pure MAC — configure the reservation with the ID the client actually sends.

**Hostnames and FQDN structure:**
• **Hostname** — the name of a single machine (e.g., \`workstation-3\`). Must be unique on the local network.
• **FQDN (Fully Qualified Domain Name)** — hostname + domain suffix. Example: \`nut.widget.example\` = host \`nut\` in domain \`widget.example\`.
• **TLD (Top-Level Domain)** — the rightmost label. Categories:
  — **Generic**: \`.com\`, \`.org\`, \`.net\`, \`.info\`, \`.biz\`
  — **Sponsored**: \`.gov\`, \`.edu\`, \`.mil\`
  — **Country code (ccTLD)**: \`.uk\`, \`.ca\`, \`.de\`, \`.jp\`
• **Trailing dot** in \`www.example.com.\` represents the DNS root zone — almost always omitted in URLs; the resolver adds it.
• **DNS is managed by ICANN** (icann.org). **13 root-level servers** (A–M) distributed globally.

**DNS resolution process** (recursive):
1. Client app (stub resolver) checks local cache.
2. If missing, queries its configured DNS server (resolver) over **UDP/TCP port 53**.
3. Resolver, if no cache hit, queries a **root server** (if configured for recursion).
4. Root returns the TLD name server.
5. Resolver queries TLD name server → gets authoritative name server for the domain.
6. Resolver queries authoritative server → gets the record.
7. Resolver caches and returns to client.
8. Client caches result locally.

**DNS record types (memorize):**

| Record | Purpose |
|--------|---------|
| **A** | Maps a hostname to an **IPv4 address** (32-bit). Example: \`www.example.com → 93.184.216.34\` |
| **AAAA** ("quad-A") | Maps a hostname to an **IPv6 address** (128-bit). Example: \`www.example.com → 2606:2800:220:1:248:1893:25c8:1946\` |
| **CNAME (Canonical Name)** | **Alias** that points one hostname to another hostname. Useful for redirects or after acquisitions (redirect old domain → new domain). |
| **MX (Mail eXchanger)** | Identifies the **email server(s)** for a domain. Has a **preference value** — lowest number = primary. The MX target must itself have an A or AAAA record. |
| **NS (Name Server)** | Identifies the authoritative DNS server(s) for a zone |
| **PTR (Pointer)** | Reverse lookup — maps an **IP back to a hostname** (for logging, authentication) |
| **TXT (Text)** | **Free-form text data** for service configuration. Now mostly used for email authentication (SPF, DKIM, DMARC) and domain verification (prove you own the domain to Google/Microsoft/etc.) |
| **SOA (Start of Authority)** | Metadata record at the top of every zone: primary NS, admin email, serial number, refresh/expire timers |
| **SRV (Service)** | Identifies servers providing a specific service (used by Active Directory, SIP, Minecraft, etc.) |

**Email authentication trio (all stored as TXT records):**

**SPF (Sender Policy Framework):**
• TXT record published by a domain identifying which IPs are **authorized to send email** from that domain.
• **Only ONE SPF record per domain**.
• Actions on failure: \`-all\` (hard fail — reject), \`~all\` (soft fail — flag), \`+all\` (pass — accept anyway, rarely used).

**DKIM (DomainKeys Identified Mail):**
• Cryptographic signature. Domain publishes a **public key in a TXT record**.
• Sending server signs outgoing mail with the matching private key.
• Receiving server verifies signature using the public key from DNS → confirms the mail really came from an authorized server for that domain.
• Complements or replaces SPF.

**DMARC (Domain-based Message Authentication, Reporting, and Conformance):**
• Published as a **TXT record**.
• Tells receiving servers **what to do with mail that fails SPF and/or DKIM**: **none** (monitor), **quarantine** (spam folder), or **reject** (bounce).
• Also sets up **reporting** — receivers send aggregate failure reports back to the sender for analysis.
• Most robust of the three. Enforces SPF+DKIM.

**VLAN expanded detail:**
• **VLAN ID range: 1–4094** (12-bit field in 802.1Q tag; 0 and 4095 reserved).
• **VLAN 1 is the default VLAN** — all managed-switch ports default here unless reconfigured.
• Usable range for custom VLANs: **2 to 4094**.
• Each VLAN is **its own broadcast domain** and needs **its own IP subnet, DHCP pool, and default gateway**.
• Hosts in different VLANs **cannot communicate directly** even if plugged into the same switch — **traffic must go through an IP router** (or a Layer 3 switch with routing enabled).

**VLAN security benefit** — each VLAN can be treated as a **separate security zone** with firewall filtering between them. Isolate IoT devices, guest Wi-Fi, VoIP phones, etc.

**Voice VLANs** — a specific use case. VoIP phone traffic put on its own VLAN so **QoS policies** can prioritize voice packets over data traffic for call quality.

**VPN detail:**
• Connects remote computer to the office LAN as if it were physically plugged in.
• **Tunneled** (encapsulated in another protocol) through the public internet.
• **Encrypted** so attackers on the public internet can't read the traffic.

**VPN types:**
| Type | Use case |
|------|----------|
| **Remote access / Client-to-site** | Individual user (laptop, phone) connects to office LAN from home, coffee shop, hotel |
| **Site-to-site** | Branch office's router connects to HQ's router — all traffic between sites is encrypted |
| **Intranet VPN** | Additional encryption within an already-private network (for sensitive segments) |

**VPN process:**
1. Client establishes connection to the **VPN gateway / concentrator** on the office edge.
2. Gateway **authenticates** the user (credentials, MFA, certificate).
3. **Encrypted tunnel** established.
4. Client's outbound traffic is encapsulated in the tunnel, decrypted at the gateway, forwarded onto the LAN.
5. Return traffic flows back through the same tunnel.

**Common VPN protocols** (beyond A+ scope but worth recognizing):
• **IPsec** — industry standard; operates at Layer 3
• **OpenVPN** — open-source SSL/TLS-based
• **WireGuard** — modern, fast, simpler than IPsec
• **SSTP** (Microsoft), **L2TP/IPsec**, **PPTP** (legacy, insecure — don't use)

**Split tunneling** — VPN client sends only work-related traffic through the tunnel; personal browsing goes directly to the internet. Saves bandwidth; many orgs disable it for security compliance.` },
        { heading: "File/Print Servers, SMB/CIFS/Samba, FTP Modes, SMTP/POP/IMAP Ports, LDAP/RADIUS/TACACS+ (Lesson 7A)", content: `**File and print server core protocols:**

**SMB (Server Message Block)** — the file and print sharing protocol for Windows networks:
• Runs directly over **TCP/445**.
• **SMB 1** — **disabled by default** on modern Windows due to **serious security vulnerabilities** (WannaCry used SMB1 exploits). Only enable if required for legacy Windows 2000 / XP support.
• **SMB 2 and SMB 3** — current versions. SMB 3 adds encryption and multichannel.
• **CIFS (Common Internet File System)** — technically refers only to a specific SMB v1 dialect, but often used as a generic synonym for SMB.
• **Samba** — open-source SMB implementation for Linux/UNIX and most **NAS appliances**. Lets a Windows client access a Linux host as if it were a Windows file server.

**Print server**:
• Implemented as hardware (networked print server box) or software (role on a Windows/Linux machine).
• Centralizes printer management, **queues print jobs**, may support **hold-and-release** (user authenticates at the printer to release their jobs — privacy for HR/legal).
• Can serve many users via a single managed print queue rather than each PC talking to the printer directly.

**NetBIOS / NetBT ports** — legacy Windows networking:
• **UDP 137** — NetBIOS **name services** (broadcast name resolution)
• **UDP 138** — NetBIOS **datagram service**
• **TCP 139** — NetBIOS **session service** (file sharing over NetBIOS)
• **Obsolete** on modern networks — DNS + SMB-over-445 replaces all of these.
• **Should be disabled** unless you need to support Windows 2000 or earlier.

**FTP — active vs. passive mode:**
| Mode | How data connection is opened |
|------|-------------------------------|
| **Active** | Control on TCP 21; **data on TCP 20**. Server initiates the data connection back to the client. Problematic through NAT/firewalls. |
| **Passive (PASV)** | Control on TCP 21; **data on a server-assigned port** (high port). Client initiates the data connection. **Firewall-friendly** — the default mode today. |

**FTP security variants** (plain FTP is insecure — passwords in plaintext):
| Variant | Port | Based on |
|---------|------|----------|
| **FTPS (FTP Secure)** | TCP 990 (implicit) or 21 (explicit) | FTP + **SSL/TLS** encryption |
| **SFTP (SSH File Transfer Protocol)** | **TCP 22** | Uses **SSH tunnel** — NOT FTP at all despite the name |

**Database servers (covered briefly on the exam):**
| Type | Description | Examples |
|------|-------------|----------|
| **Relational (SQL)** | Data in tables (rows/columns) with defined relationships. Queried with **SQL (Structured Query Language)**. | Oracle, MySQL, MariaDB, Microsoft SQL Server, PostgreSQL |
| **Non-relational (NoSQL)** | Flexible schema — documents, key-value pairs, graphs. Scales horizontally easily. | MongoDB, CouchDB, Redis, Amazon DynamoDB |

**HTTPS implementation detail:**
• Uses **TLS (Transport Layer Security)** — evolved from Netscape's **SSL (Secure Sockets Layer)** in the 1990s.
• Web server installs a **digital certificate** issued by a trusted **CA (Certificate Authority)**.
• Certificate contains the server's **public key**; the matching **private key** stays on the server only.
• During handshake, client and server use the key pair to negotiate an encrypted session with a chosen **cipher suite**.
• Browser shows a **padlock icon** in the address bar when connected to a valid HTTPS server.
• **HSTS (HTTP Strict Transport Security)** — tells browsers to always use HTTPS for a domain (reject plain HTTP).

**TLS variants**:
• **TLS** — for TCP-based protocols (HTTPS, SMTPS, IMAPS, etc.)
• **DTLS (Datagram TLS)** — for UDP-based protocols. Used in some VPNs (e.g., Cisco AnyConnect).

**When you see "S" at end of a protocol** (HTTPS, SMTPS, IMAPS, POP3S, LDAPS, FTPS): security is usually **SSL/TLS**.

**Mail server port table** — memorize all of these:

| Protocol | Port | Encryption | Role |
|----------|------|-----------|------|
| **SMTP (server-to-server relay)** | **TCP 25** | Usually insecure / STARTTLS | Message transfer between mail servers (MTAs) |
| **SMTP submission (client-to-server)** | **TCP 587** | STARTTLS (required by convention) | Mail client sends a new message to its outgoing server (MSA) |
| **SMTPS (legacy, implicit TLS)** | TCP 465 | SSL/TLS | Historically used; submission on 587 is preferred |
| **POP3** | **TCP 110** | Insecure | Retrieve mail to client (deletes from server by default) |
| **POP3S** | **TCP 995** | SSL/TLS | Secure POP3 |
| **IMAP** | **TCP 143** | Insecure | Retrieve/manage mail on server (multi-device sync) |
| **IMAPS** | **TCP 993** | SSL/TLS | Secure IMAP |

**POP3 vs IMAP**:
• **POP3** — downloads messages then **deletes from server** (typically). Single-device use. Simpler.
• **IMAP** — messages **stay on server**, client creates a view. **Multi-device sync** (phone + laptop + webmail all see same folder state). Required for modern use.

**SMTP flow example**:
1. User clicks Send → client submits message to **its own SMTP server over port 587** (authenticated, encrypted).
2. Client's SMTP server **looks up the recipient domain's MX record** in DNS.
3. Client's SMTP server connects to recipient's SMTP server **over port 25** (server-to-server relay).
4. Recipient's SMTP server accepts the message and hands it to the mailbox (IMAP/POP) server.
5. Recipient's client connects to the mailbox server (**port 993 IMAPS** or 995 POP3S) to retrieve mail.

**LDAP (Lightweight Directory Access Protocol)** — query/update a directory database (Active Directory, OpenLDAP):
• **Insecure: TCP/UDP 389**
• **Secure (LDAPS): TCP 636** (SSL/TLS)
• **X.500** — the original directory-standard that LDAP operates against.
• Used for **Single Sign-On (SSO)** across enterprise apps.

**AAA (Authentication, Authorization, Accounting):**

| Component | Role |
|-----------|------|
| **Supplicant** | The device requesting access (user's PC/phone/VPN client) |
| **Authenticator / NAS (Network Access Server)** | The network device enforcing access — switch, wireless AP, VPN gateway. Also called "AAA client." |
| **AAA server** | The actual identity/authentication service holding credentials |

With AAA, the network access points **don't store credentials** — they just forward authentication requests to the central AAA server.

**RADIUS (Remote Authentication Dial-In User Service):**
• **Ports: UDP 1812 (authentication) + UDP 1813 (accounting)** — older deployments may also use 1645/1646.
• Commonly used to authenticate **users** joining the network (802.1X, Wi-Fi Enterprise, VPN).
• Encrypts only the password, not the full packet.

**TACACS+ (Terminal Access Controller Access Control System Plus):**
• **Port: TCP 49**
• Commonly used to authenticate **administrators to network devices** (switches, routers, firewalls) — role-based command authorization.
• Encrypts the entire packet.
• Cisco-developed but implemented by many vendors.

**RADIUS vs TACACS+ quick comparison**:
| Feature | RADIUS | TACACS+ |
|---------|--------|---------|
| Transport | UDP | TCP |
| Encryption | Password only | Entire packet |
| Typical use | User network access (Wi-Fi, VPN) | Admin access to network devices |
| Combines AAA | Auth+Authz merged | **Separates** authentication, authorization, accounting |

**Remote terminal protocols — table:**

| Protocol | Port | Encryption | Use |
|----------|------|-----------|-----|
| **Telnet** | **TCP 23** | **None — plaintext** | Legacy command-line access. Avoid. |
| **SSH (Secure Shell)** | **TCP 22** | Encrypted | **Current standard** for command-line remote access to Linux, network devices. Also carries SCP, SFTP. |
| **RDP (Remote Desktop Protocol)** | **TCP 3389** | Encrypted | Microsoft's **graphical** remote desktop protocol. Windows servers and workstations. |
| **VNC (Virtual Network Computing)** | **TCP 5900** | Usually unencrypted (use SSH tunnel or VPN) | Cross-platform graphical remote access |

**NTP stratum levels** — how accurate a time source is:
| Stratum | Source | Example |
|---------|--------|---------|
| **Stratum 0** | Reference clock itself | **Atomic clock**, GPS receiver |
| **Stratum 1** | Primary server synced directly to Stratum 0 | Dedicated NTP server with GPS feed |
| **Stratum 2** | Synced to Stratum 1 | Public time servers like pool.ntp.org |
| **Stratum 3+** | Synced to Stratum 2+ | Enterprise internal NTP servers |
| Stratum 16 | Unsynchronized / unreachable | Failure indicator |

**NTP protocol details:**
• **NTP port: UDP 123**
• Microsoft Windows uses \`time.windows.com\` by default; query with \`w32tm /query /status\`.
• **NTS (Network Time Security)** — ratified 2020 — adds TLS encryption. Port **TCP 4460**.

**SNMP (Simple Network Management Protocol)** detail:
• **SNMP query: UDP 161** (network management system → agent)
• **SNMP trap: UDP 162** (agent → management station, for unsolicited alerts)
• Components:
  — **Agent** on the managed device — maintains a **MIB (Management Information Base)** database of stats
  — **Management system / NMS** — polls agents and displays stats; receives traps
• **SNMPv1 and v2c — avoid**. Community strings sent in plaintext. Weak security.
• **SNMPv3** — supports authentication and encryption. **Use this.**

**Syslog** — open event-logging protocol:
• **Port: UDP 514**
• De facto standard for network devices (routers, switches, firewalls, Linux servers).
• **Log collector / syslog server** aggregates messages from many sources for centralized review.
• Message format: **PRI code** (facility + severity) + header (timestamp, hostname) + message content.
• **Severity levels** (0–7, lowest = most severe): emerg, alert, crit, err, warning, notice, info, debug.

**SSO (Single Sign-On)** — user authenticates **once** and gains access to multiple systems without re-entering credentials. Implemented via Active Directory + Kerberos, or SAML/OAuth/OpenID Connect for web apps.` },
        { heading: "Proxies, Spam Gateway, UTM, Load Balancer, Legacy/Embedded (Lesson 7B)", content: `**Proxy server detail:**
A proxy is an application-layer intermediary. Unlike NAT (which just rewrites IP/port at the network layer), a proxy **reads the full request** (e.g., an HTTP GET), **inspects it**, then fulfills it to the destination on behalf of the client. When the response returns, the proxy inspects and forwards it back.

**Forward vs reverse proxy:**
| Type | Direction | Use |
|------|-----------|-----|
| **Forward proxy** | **Protects clients** — clients inside the network use proxy to reach external servers | Content filtering, caching, logging user web access |
| **Reverse proxy** | **Protects servers** — external clients reach internal servers via the proxy | Load balancing, TLS termination, hiding server details, WAF |

**Transparent vs non-transparent proxy:**
| Mode | Client config required? | How |
|------|------------------------|-----|
| **Transparent** | **No** — client unaware of the proxy | Network routes force traffic through the proxy |
| **Non-transparent** | **Yes** — browser/app configured with proxy IP+port | Port **8080** by convention for HTTP proxies |

**Proxy functions:**
• **Content filtering** — block inappropriate/unauthorized sites
• **Access rules** — time-of-day, total time, bandwidth quota
• **Caching** — frequently requested content (e.g., OS updates) served locally → faster, less WAN bandwidth
• **Logging** — central record of who visited what (legal/compliance and incident response)

**Security appliance types (consolidated):**
| Type | What it does |
|------|--------------|
| **Firewall** | Allow/block based on ACL (source/dest IP, port, protocol) |
| **IDS (Intrusion Detection System)** | **Monitors** traffic for known malicious patterns → raises alerts. Passive. |
| **IPS (Intrusion Prevention System)** | **Blocks** traffic matching malicious patterns. Active — sits inline. |
| **Antivirus / anti-malware gateway** | Scans traffic for known malware signatures |
| **Spam gateway / email security** | **Verifies SPF/DKIM/DMARC** + filters spam/phishing **before it reaches user mailboxes** |
| **Content filter** | Blocks access to prohibited outbound sites/categories |
| **DLP (Data Loss/Leak Prevention)** | **Scans outgoing traffic** for confidential info (credit cards, SSNs, tagged documents) and blocks unauthorized transmission |
| **UTM (Unified Threat Management)** | Combines many of the above into one appliance — single console, single vendor support |
| **NGFW (Next-Generation Firewall)** | Application-aware firewall with DPI, user identity integration, IPS built in |

**Load balancer:**
• Distributes client requests across a pool of servers providing the same function.
• Clients see a single **virtual IP / virtual server address**; the load balancer forwards to actual backend servers.
• **Algorithms**: round-robin, least connections, weighted, source IP hash (for affinity).
• **Persistence / "sticky sessions"** — keeps a client connected to the same backend server for session continuity (shopping cart, multi-step form).
• Used for: web servers, email, streaming media, web conferencing.
• Benefits: **high availability** (dead server → removed from pool automatically), **horizontal scaling**, **performance**.

**Legacy systems — definition and handling:**
• **Legacy system** — no longer supported by the vendor (vendor out of business, product EOL, deprecated).
• **EOL (End-of-Life)** — formal designation that the vendor will no longer patch or support the product.
• Problem: no new security patches for newly discovered vulnerabilities.
• **Mitigation strategies**:
  — **Network isolation** — put on its own VLAN with strict firewall rules
  — **Compensating controls** — IDS monitoring, host-based firewall, application allowlisting
  — **Monitor carefully** — any communication with the legacy system is logged and alerted
  — **Long-term**: plan migration to a supported platform

**Embedded systems** — electronic devices designed for a **specific dedicated function**. Range from simple (IV drip rate controller) to complex (power plant). Typically have firmware rather than a general-purpose OS.

**ICS (Industrial Control System) — components to know:**
| Component | Role |
|-----------|------|
| **PLC (Programmable Logic Controller)** | Embedded controller that runs the automation logic |
| **Actuator** | Physical device the PLC operates (valve, motor, breaker, pump) |
| **Sensor** | Input device monitoring state (temperature, pressure, level, flow) |
| **HMI (Human-Machine Interface)** | Control panel or software an operator uses to interact with PLCs |
| **Control server** | Central coordinator for process automation |
| **Data historian** | Database recording every reading / event for later analysis / compliance |
| **OT network (Operational Technology)** | The network of embedded/control devices. **Separate from IT network.** |

**SCADA (Supervisory Control and Data Acquisition):**
• Like a control server but for **large-scale, multi-site** systems (electric grid, water utility, pipeline).
• Usually software on standard computers, communicating with **field devices** (remote PLCs).
• Uses WAN (cellular, satellite, leased lines) to reach geographically distributed devices.
• **Security risk**: historically designed for isolated networks; increasingly connected to IT networks → attack surface.

**Industries using ICS/SCADA:** power generation & distribution, water/wastewater treatment, natural gas/oil pipelines, telecom infrastructure, manufacturing, transportation (rail signals, traffic lights).

**Internet of Things (IoT):**
• Smart devices: lightbulbs, thermostats, refrigerators, doorbells, security cameras, voice assistants, smart locks, irrigation controllers.
• Typically run **minimal Linux/Android** kernels.
• Often **"headless"** — no direct input/display; managed via smartphone app or voice.

**IoT components:**
• **Hub / control system** — coordinates communication between smart devices and the internet. Examples: Amazon Echo, Google Home, SmartThings hub, Hubitat.
• **Smart devices** — endpoints that do the actual function. Connect to hub (or direct to Wi-Fi).

**IoT wireless protocols** (besides Wi-Fi):
| Protocol | Band | Range | Notes |
|----------|------|-------|-------|
| **Zigbee** | 2.4 GHz (mostly) | ~10–100 m | Mesh network — devices relay for each other. Low power. |
| **Z-Wave** | **Sub-GHz** (908 MHz in US, 868 MHz in EU) | Better wall penetration than 2.4 GHz | Mesh. Proprietary. Widely used for smart-home. |
| **Bluetooth / BLE** | 2.4 GHz | 10–240 m | Common for wearables, peripherals |
| **Thread** | 2.4 GHz | Similar to Zigbee | IPv6-based mesh, backed by Matter standard |
| **Matter** | over Wi-Fi, Thread, Ethernet | n/a | Newer cross-vendor compatibility standard (2022+) |

**IoT security concerns:**
• Weak/default passwords (admin/admin common out of the box)
• Rarely or never updated firmware
• No secure boot or encrypted storage on cheap devices
• Potential **spying** (cameras, microphones) if compromised
• **Mitigation**: put IoT on its own **VLAN** isolated from trusted LAN; change default credentials; disable unneeded features (remote access, UPnP); keep firmware updated.` }
      ]},
      { title: "2.4 Deep Dive — CertMaster Additions", sections: [
        { heading: "DHCP DORA Process & 802.1Q VLAN Tagging", content: `**DHCP DORA** — the 4-step process by which a client gets an IP lease. You WILL see this on the exam:

1. **Discover** — client broadcasts "I need an IP" (source 0.0.0.0 → destination 255.255.255.255, UDP port 67). Client has no IP yet.
2. **Offer** — DHCP server(s) reply with an available IP + lease terms (broadcast or unicast back to the MAC).
3. **Request** — client broadcasts acceptance of one specific offer (important: if multiple DHCP servers offered, this tells the others to release their reservation).
4. **Acknowledge (ACK)** — server confirms the lease, sends final IP / mask / gateway / DNS / lease duration.

Mnemonic: **D**iscover **O**ffer **R**equest **A**cknowledge → **DORA**.

**DHCP relay (IP helper)** — DHCP discovery is broadcast and doesn't cross routers. In multi-subnet networks, configure a DHCP relay/helper on the router to forward requests to a central DHCP server.

**Lease renewal** — client attempts renewal at **50% of lease time** (T1 timer) directly to the issuing server; if no response, tries again at **87.5%** (T2 timer, broadcast). On full expiration, client returns to Discover state.

**802.1Q VLAN tagging**:
• IEEE standard for carrying multiple VLANs on one switch port (a **"trunk port"**)
• Inserts a **4-byte tag** into the Ethernet frame header containing a 12-bit VLAN ID (1–4094 usable)
• **Access port** — belongs to ONE VLAN; frames leaving are untagged. Endpoints (PCs, printers) plug here.
• **Trunk port** — carries multiple VLANs tagged. Switch-to-switch links, or switch-to-router ("router-on-a-stick")
• **Native VLAN** — untagged VLAN on a trunk (default VLAN 1). Security best practice: change native VLAN from 1 and don't use it for data.

**DNS TTL** — each DNS record has a Time-To-Live; resolvers cache for that duration. Low TTL = faster propagation of changes but more query load.` }
      ]},
      { title: "2.5 — Networking Hardware", sections: [
        { heading: "Network Devices", content: `| Device | OSI Layer | Function |
|--------|-----------|----------|
| **Router** | Layer 3 (Network) | Connects different networks using IP addresses. NAT, firewall, DHCP |
| **Switch (managed)** | Layer 2 (Data Link) | Forwards frames by MAC address. VLANs, port security, PoE |
| **Switch (unmanaged)** | Layer 2 | Plug-and-play. No configuration. Just forwards frames |
| **Access Point (AP)** | Layer 2 | Provides Wi-Fi to wired network. NOT a router (doesn't route) |
| **Patch panel** | Layer 1 (Physical) | Central termination point for network cables |
| **Firewall** | Layer 3-7 | Filters traffic by rules (IP, port, protocol). Hardware or software |
| **PoE switch/injector** | Layer 1-2 | Delivers electrical power AND data over Ethernet |
| **Cable modem** | Layer 1-2 | ISP connection via coaxial cable |
| **DSL modem** | Layer 1-2 | ISP connection via phone line |
| **ONT** | Layer 1 | Terminates fiber optic from ISP. Converts optical → electrical |
| **NIC** | Layer 2 | Every NIC has a unique **physical MAC address** |

**Physical MAC address** [NEW for 1201]: 48-bit hardware identifier (e.g., AA:BB:CC:DD:EE:FF). Assigned at factory. Layer 2. Switches use MAC addresses to forward frames.

**PoE standards** (PSE output / device received):
• **802.3af (PoE)** — 15.4W / 12.95W. Basic devices (IP phones, basic APs)
• **802.3at (PoE+)** — 30W / 25.5W. PTZ cameras, advanced APs
• **802.3bt (PoE++)** — Type 3: 60W, Type 4: 90W / 71.3W. High-draw devices` }
      ]},
      { title: "2.5 Deep Dive — CertMaster Additions", sections: [
        { heading: "Network Topologies & PoE Deployment Methods", content: `**Physical vs. logical topology** — physical is how cables run; logical is how data flows.

| Topology | Description | Use | Failure mode |
|----------|-------------|-----|--------------|
| **Star** | All devices connect to a central switch | **Dominant** for LANs today | Switch failure = all devices down; one cable failure = one device |
| **Bus** | All devices share one cable trunk | Legacy coax Ethernet (10BASE2) | Any break breaks the whole segment |
| **Ring** | Each device connects to the next in a loop | Token Ring, FDDI (legacy), some WAN/SAN | Break kills the ring unless dual-ring |
| **Mesh** | Every device connects to every other (full mesh) or many (partial mesh) | WAN backbones, wireless mesh Wi-Fi (Eero, Orbi) | Extremely redundant; expensive |
| **Hybrid** | Mix of above | Most real networks | Varies |

**Physical MAC address** (bears repeating): **48-bit** hardware identifier, written hex like **AA:BB:CC:DD:EE:FF**. First 24 bits = OUI (Organizationally Unique Identifier — identifies manufacturer); last 24 bits = device-specific. Shown by \`ipconfig /all\` (Windows) or \`ip link\` / \`ifconfig\` (Linux).

**PoE deployment — two methods to deliver power:**
• **PoE switch** (endspan) — every port on the switch can supply power. Best for greenfield deployments.
• **PoE injector** (midspan) — a small inline device placed between a non-PoE switch and a powered device. Takes regular power from a wall outlet and injects it onto the Ethernet cable. Used to add PoE to one or two devices without replacing the switch.

**PoE power budget** — a PoE switch has a total wattage budget (e.g., 370W). If every port is drawing max PoE+, it can exceed budget. Know the sum of connected device draw.` },
        { heading: "Switch Operation, PoE Wattage Detail, Patch Panel (Lesson 5B)", content: `**How a switch learns MAC addresses:**
1. Device sends a frame → switch reads the **source MAC** from the frame header.
2. Switch **adds (source MAC ↔ port #)** to its MAC address table.
3. For an unknown **destination MAC**, switch **floods** the frame out all ports (except the one it came in on).
4. When that destination replies, its source MAC is learned and added to the table.
5. Subsequent frames to that MAC go only out the correct port — no more flooding.

This process is called **"MAC learning" / "bridging table build-up"**. The table typically ages entries out after 5 minutes of inactivity.

**Switch is a separate collision domain per port** — every port has a **full-duplex connection**. No CSMA/CD collisions on modern switched networks. Old hubs (not switches) were one big collision domain.

**MAC address bit-level detail**:
• **6 bytes = 48 bits = 12 hex digits**
• Format: \`00:60:8C:12:3A:BC\` (colon), \`00-60-8C-12-3A-BC\` (hyphen), or \`00608C123ABC\` (none)
• **First byte's two least-significant bits are flags**:
  — **Bit 0** (last bit): 0 = individual (unicast), 1 = multicast/group
  — **Bit 1**: 0 = universally administered (factory), 1 = locally administered (software-assigned)
• Example: \`01:13:10:6B:17:A8\` → first byte 01 = \`00000001\` → last bit = 1 → **multicast address**.

**Patch panel infrastructure**:
• Wall port (RJ45) in a user's office → horizontal cable through wall → patch panel at wiring closet.
• Cable terminates on the **back of the patch panel** at an **IDC (Insulation Displacement Connector) punchdown block** — typically 110 or 66 style.
• Front of patch panel has **pre-wired RJ45 jacks** matching the back IDCs.
• A **patch cord** (short Ethernet cable) connects the patch panel's front port to a **switch port**.
• Changing a user's network connection = swap the patch cord at the panel, not re-running cables through walls.
• **Labeling is critical** — label each wall port, each patch panel port, each patch cord so you know "desk jack 2A4" goes to "panel port 14" goes to "switch 3 port 22".

**Switch types — detail:**
| Type | Ports | Configuration | Use case | Typical form |
|------|-------|---------------|----------|--------------|
| **Unmanaged switch** | 4–8 | **None** — plug and play | Home, SOHO, inside a consumer router | Small plastic box |
| **Managed switch** | 24 or 48 | Web GUI or CLI (Telnet/SSH) | Corporate LANs | 1U rack unit, multiple uplink ports |
| **Modular / chassis switch** | 100s | Web/CLI + SNMP/API | Large enterprise, data center | Large chassis with hot-swappable line cards |

Managed switch features (exam might test): **VLAN tagging (802.1Q), port mirroring, Spanning Tree (STP), Link Aggregation (LAG/LACP), QoS, ACLs, SNMP management, PoE control**.

**Uplink ports** — higher-speed ports on a switch for connecting to other switches or the core. A 48-port Gigabit switch often has 2–4 x SFP+ 10 Gbps uplink ports.

**PoE IEEE standards — EXACT wattage (this WILL be tested):**

| Standard | Names | Max delivered | Usable at PD | Max current | Typical loads |
|----------|-------|---------------|--------------|-------------|---------------|
| **802.3af** | **Type 1 PoE**, 2-pair PoE | **15.4 W** | **~13 W** (after 100m cable drop) | 350 mA @ 48V | Basic VoIP phones, basic APs, basic cameras |
| **802.3at** | **PoE+**, **Type 2 PoE** | ~30 W | **~25 W** | 600 mA | Advanced APs, PTZ cameras, video phones |
| **802.3bt (Type 3)** | **PoE++**, **4PPoE** | ~60 W | **~51 W** | higher | LED lighting, digital signage, POS |
| **802.3bt (Type 4)** | **PoE++**, **4PPoE** | ~90 W | **~73 W** | highest | Large LED lights, small thin clients, demanding APs |

**PoE mechanics**:
1. **Detection phase** — switch sends a low-voltage signal to check if the attached device is a PoE-enabled PD (Powered Device). Non-PoE devices won't respond; switch keeps power OFF so regular PCs aren't damaged.
2. **Classification** — switch and PD negotiate the power class/amount needed.
3. **Operation** — switch supplies the agreed voltage continuously.

**PoE terminology**:
• **PSE (Power Sourcing Equipment)** — the thing supplying power
  — **Endspan PSE** = PoE switch (power supplied from the switch port itself)
  — **Midspan PSE** = PoE injector (separate inline device between non-PoE switch and PD)
• **PD (Powered Device)** — the thing receiving power (AP, phone, camera)

**PoE injector constraints**:
• Injector is inline — switch→injector→device
• **Total cable length still limited to 100 m** end-to-end (per Ethernet spec).
• The injector needs its own AC power input.
• Useful when you have a legacy non-PoE switch and only a few PoE devices.

**PoE power budget check** — sum up the max draw of all connected PDs. If a 370W budget switch has 24 ports, **you can't run 24 x Type 4 (73W) devices** (would need 1,752W). Design accordingly.` }
      ]},
      { title: "2.6 — SOHO Network Configuration", sections: [
        { heading: "IP Addressing", content: `**IPv4** — 32-bit, four octets: 192.168.1.100

**Private IP ranges (RFC 1918)** — not routable on internet:
