5. **If PSU is good but system still won't POST** — it's the motherboard, CPU, or RAM. Remove non-essential components to minimum (CPU + 1 RAM stick + GPU if no iGPU), try to POST.

**Power supply tester vs. multimeter — exam distinction:**
• **PSU tester** → quickly verifies PSU output WITHOUT requiring the PC to power on. Self-contained.
• **Multimeter** → measures voltage/resistance/continuity in a circuit. Useful for checking individual rails, cables, fuses, surge protectors. More versatile but requires understanding what reading to expect.

**POST (Power-On Self-Test)** recap — the BIOS/UEFI runs this at startup. Tests CPU, RAM, video. Patterns you may see:

**Beep codes** (classic AMI / Award / Phoenix BIOS — modern UEFI boards often drop beeping for on-board LED debug):
• **1 short** — POST passed, normal
• **No beep** — PSU dead, motherboard dead, or no speaker connected
• **Continuous short beeps** — PSU or motherboard failure
• **Long repeating beep** — RAM not detected or failed
• **1 long + 2 or 3 short** — video card / display adapter failure
• **Series of short beeps** — CPU or cache failure

**POST debug LEDs** — modern motherboards have 4 LEDs (CPU / DRAM / VGA / BOOT) that light sequentially during POST and stay lit on the step that failed. Much easier than beep codes.

**POST code display** — some boards have a 2-digit hex display (e.g., Q-Code on ASUS). Check the manual for what each code means.

**Crash screens by OS** (proprietary crash screens — new for 1201):
• **Windows BSOD (Blue Screen of Death)** — kernel-level fault. Stop codes like IRQL_NOT_LESS_OR_EQUAL, PAGE_FAULT_IN_NONPAGED_AREA. Common causes: bad RAM, failing storage, bad drivers, overheating.
• **macOS kernel panic** — multilingual "You need to restart your computer" screen, gray/spinning globe on newer macOS. Similar causes.
• **Linux kernel panic** — text on black screen with a call trace. Hang requires hard reboot.
• **Purple Screen of Death (PSOD)** — VMware ESXi hypervisor equivalent.

Always capture the stop code or error message **before rebooting** — that's the most valuable diagnostic info.

**Common power issue symptoms → causes:**
| Symptom | Probable cause |
|---------|----------------|
| System won't turn on at all | PSU dead, cable, switch off, motherboard dead, front panel wiring |
| System turns on briefly then shuts off | Short circuit, CPU overheating (no paste, fan not spinning), PSU protection tripping |
| Random shutdowns under load | PSU undersized, thermal throttling, failing VRM, loose power cable |
| Burning smell | **Power off immediately.** Capacitor blown, PSU failure, shorted component |
| Sparks / smoke | **Unplug. Evacuate.** Fire hazard. |` },
        { heading: "PSU Power-On Sequence, Beep Codes, MBR vs GPT, Crash Screens (Lesson 4B)", content: `**PSU power-on sequence** (what happens when you press power):
1. PSU receives AC and the "power on" signal via the green PS_ON# wire shorted to ground.
2. **+12V supply rises first** — fans and hard-disk spindles begin spinning up.
3. PSU internally tests +5V and +3.3V rails for stability.
4. Once all rails are stable, PSU sends the **"Power Good" signal** (gray wire, +5V DC) to the CPU.
5. CPU begins executing firmware → POST starts.

**If you see fans spin for a moment then stop** — PSU tested rails, one was unstable, PSU shut down for protection. That's a failing PSU or a shorted component on the motherboard.

**Safety**: **PC power supplies are NOT user-serviceable.** NEVER remove the PSU cover. Internal capacitors can hold dangerous voltage even after unplugging. Smell smoke or see sparks → power off, unplug, replace the entire PSU.

**No-power diagnostic flow — full sequence:**
1. **Check other equipment in the area** — rule out building-wide power outage or circuit breaker tripped.
2. **Test the wall socket** with a known-good device (lamp, outlet tester). If dead → electrician, not you.
3. **Verify PSU connections** — back switch on (0/I), input voltage selector correct, cable fully seated.
4. **Swap the power cable** — cheap C13 cables can have internal breaks or blown fuses (UK plugs).
5. **Disconnect non-essential devices** (discrete GPU, extra drives, USB peripherals) and try again. If it starts, the PSU may be undersized or a device is shorting.
6. **Test the PSU** with a **power supply tester** or **multimeter** (check all rails).

**Stuck keyboard key** can prevent boot — nothing resting on keys, clean out sticky residue with approved swabs and compressed-air blowers.

**Jumper misconfiguration** — some older motherboards have jumpers for CPU configuration, firmware recovery mode, CMOS clear, etc. **If the PC doesn't boot after service, check that jumpers weren't bumped.**

**CMOS / UEFI reset procedure** (when settings prevent boot):
1. Power off, unplug.
2. Remove the **CR2032 CMOS battery** for 1–5 minutes, OR
3. Short the **CLR_CMOS / CLRTC jumper** (move jumper cap from pins 1-2 to pins 2-3 briefly, then back).
4. Reinstall battery, boot — settings reset to factory defaults.

**Classic IBM POST beep codes** (AMI/Award/Phoenix-compatible):

| Code | Meaning |
|------|---------|
| **1 short beep** | Normal POST — system OK (most modern PCs boot silently, no beep) |
| **2 short beeps** | POST error — specific error code shown on screen |
| **No beep** | PSU fault, motherboard fault, OR **onboard speaker not connected** |
| **Continuous beep** | System memory module or memory controller failure |
| **Repeating short beeps** | PSU fault or motherboard fault |
| **1 long + 1 short** | Motherboard problem |
| **1 long + 2 or 3 short** | Video adapter error |
| **3 long beeps** | Keyboard issue — check that a key isn't depressed |

Modern systems with **Q-Code / debug LEDs** are much easier to read than beep codes — 4-digit hex display or 4 LEDs labeled CPU/DRAM/VGA/BOOT.

**Disk activity LED meanings:**
| LED behavior | Typical cause |
|--------------|---------------|
| **Off constantly** | Drive has no power, or system/drive is idle (normal during reading) |
| **Flashing normally** during use | Healthy disk activity |
| **Constantly on (thrashing)** | Insufficient RAM → constant paging; OR malware / runaway process scanning disk; OR failing disk |

**Boot formatting — MBR vs. GPT:**

| Feature | **MBR** (legacy) | **GPT** (modern) |
|---------|------------------|------------------|
| Location | **First sector** of the disk (512 bytes) | Distributed headers — not a single point of failure |
| Max partition size | **2.2 TB** | **~9.4 ZB** (practically unlimited) |
| Max primary partitions | **4** (or 3 + extended containing logical partitions) | **128** by default |
| Firmware pairing | Legacy BIOS | **UEFI** (required for Secure Boot) |
| Redundancy | None — corrupt MBR = unbootable | **Backup GPT header** at end of disk |
| Bootloaders | BCD (Windows), **GRUB** or **LILO** (Linux) | Same bootloaders, different format |

Only one MBR primary partition can be marked **active** (bootable) at a time.

**Common boot error messages → causes:**
| Error | Cause |
|-------|-------|
| "Boot device not found" / "No boot device" | Drive not detected, boot order wrong, MBR/GPT corrupt |
| "Operating system not found" / "Missing operating system" | Boot sector corrupt, OS files missing, wrong partition active |
| "Invalid drive specification" | Drive geometry mismatch, partition table damaged |
| "NTLDR is missing" (legacy Windows) | Boot files on C: damaged |
| "BOOTMGR is missing" (Windows Vista+) | Boot Manager on system partition corrupt |
| "Reboot and select proper boot device" | No bootable device found in current boot order |

**Fixes** (roughly in order of invasiveness):
1. Re-seat data/power cables
2. Verify drive shows up in BIOS/UEFI (if not → hardware)
3. **Rebuild BCD** from Windows recovery: \`bootrec /rebuildbcd\`, \`bootrec /fixmbr\`, \`bootrec /fixboot\`
4. Antivirus boot-disk scan if malware suspected
5. Repair options from OS install media
6. Reinstall OS (last resort)

**Crash screens by OS:**
| OS | Crash screen | Diagnostic info |
|----|--------------|-----------------|
| **Windows** | **BSOD (Blue Screen of Death)** | **QR code** on screen; **System log → "BugCheck" source**; **first hex value** (e.g., 0x0a); **memory dump** file (\`MEMORY.DMP\`) for support analysis |
| **macOS** | **Spinning pinwheel (SPOD)** or kernel panic | Multilingual "You need to restart" screen; crash log in Console.app |
| **Linux** | **Kernel panic** | Stack trace on screen; oops logged to \`/var/log/kern.log\` |
| **VMware ESXi** | **Purple Screen of Death (PSOD)** | Similar to BSOD; logged for support |

**BSOD troubleshooting flow:**
1. **Record the stop code before rebooting** — 0x0000007E, 0x0000007B, IRQL_NOT_LESS_OR_EQUAL, etc. Search this online.
2. Check System log in Event Viewer — **"BugCheck" source** gives the hex code.
3. Boot into Safe Mode if possible (bypass problematic drivers).
4. Roll back recent driver/Windows updates — BSODs after an update usually mean bad driver.
5. Run **memory diagnostic** (mdsched.exe) — bad RAM is a common BSOD cause.
6. Run **chkdsk /f /r** to check for bad sectors on the drive.

**Drive failure symptoms detail:**
| Symptom | Indicates |
|---------|-----------|
| **Grinding / clicking / scraping** (HDD) | Mechanical failure — head crash, bearing failure. **Back up NOW** |
| **No activity LED** | Drive has no power, OR RAID shows array is missing |
| **Constant activity LED (thrashing)** | RAM shortage (paging), malware, or drive failing |
| **"Bootable device not found"** | File corruption, failed drive, or failed RAID array |
| **Missing drives in OS** | Not initialized/partitioned/formatted yet; or drive/cable fault |
| **Read/write failure errors** | Bad sectors (HDD) or bad blocks (SSD); run \`chkdsk\` |
| **Audible alarms** (enterprise) | RAID controller alerting disk failure or degraded array |
| **BSOD with drive-related stop code** | Severe file corruption or controller failure |

**Vendor self-diagnostic utilities** — most drive makers (Seagate SeaTools, WD Data Lifeguard, Samsung Magician, Crucial Storage Executive) provide free tools to run SMART tests, surface scans, and secure-erase operations.

**chkdsk /r** — runs a full surface scan, marks bad sectors so the filesystem skips them. Time-consuming (hours for a 4TB drive) but non-destructive.

**File recovery**:
• **HDD** — software recovery possible (Recuva, PhotoRec, TestDisk) if the drive still spins; professional data-recovery labs for physical damage ($$$$).
• **SSD** — **file recovery usually impossible** without highly specialized equipment — because TRIM aggressively wipes deleted blocks in the background.

**RAID failure scenarios:**
| State | Meaning | Action |
|-------|---------|--------|
| **Degraded** | One disk failed (or missing) but array still works using redundancy | Replace the failed disk ASAP; array rebuilds automatically |
| **Missing** | Entire array unavailable (more disks failed than RAID level tolerates, OR controller failed) | Restore from backup, or if controller failed, install new controller / import disks to another system |

**Visual indicators** (server/NAS):
• **Red / amber LED on a drive bay** = that drive has failed. Replace it — but **ensure you replace the FAILED one**, not a healthy one (removing a healthy disk from a degraded array causes full failure).

**Hot swap during rebuild** — RAID rebuild writes gigabytes of data to the new disk, **significantly impacting performance**. Schedule rebuilds for off-hours when possible.

**Controller failure** — if the RAID controller dies (not the disks):
• Data is usually intact on the disks.
• Install a replacement controller of the same model/family — it should detect the disks and import the array config.
• Cross-vendor migration is often impossible — disks formatted by one vendor's controller aren't readable by another.` }
      ]},
      { title: "5.2 — Storage & RAID Issues", sections: [
        { heading: "Drive & RAID Troubleshooting", content: `**S.M.A.R.T.** — built into HDDs/SSDs. Tracks health metrics (reallocated sectors, spin retry, temp). A S.M.A.R.T. warning = drive **predicting its own failure**. Back up and replace immediately.

| Symptom | Probable Cause |
|---------|---------------|
| LED amber/blinking | Drive failure or RAID degradation |
| Grinding noises | HDD mechanical failure — platters/heads damaged |
| Clicking sounds | HDD head crash — backup immediately |
| Bootable device not found | Wrong boot order, disconnected drive, failed drive, corrupted MBR/GPT |
| Data loss / corruption | Failing drive, improper shutdown, malware, bad sectors |
| S.M.A.R.T. failure | Drive predicting imminent failure — replace proactively |
| Extended read/write times | Failing drive, fragmentation (HDD), full drive, bad SATA cable |
| Low IOPS | HDD bottleneck (upgrade to SSD), failing drive |
| Missing drives in OS | Loose SATA/power cable, dead drive, not initialized |
| **RAID array missing** [NEW] | Check physical connections first, then RAID controller BIOS |
| **Audible alarms** [NEW] | RAID controller alerting to degraded array (drive failed, still running) |

**RAID fault tolerance:**
• RAID 0 — NO redundancy (one fail = total loss)
• RAID 1 — survives 1 drive failure (mirror)
• RAID 5 — survives 1 drive failure (rebuilds from parity)
• RAID 6 — survives **2 simultaneous** failures (double parity)
• RAID 10 — survives 1 per mirrored pair` }
      ]},
      { title: "5.3 — Display & Projector Issues", sections: [
        { heading: "Video & Display Troubleshooting", content: `| Symptom | Probable Cause |
|---------|---------------|
| Incorrect input source | Monitor set to wrong input (HDMI 1 vs 2) — press input/source button |
| Physical cabling issues | Loose cable, bent pins (DVI/VGA), damaged cable — reseat or replace |
| Burnt-out bulb | Projector lamp end-of-life (2000–5000 hours). Replace lamp module |
| Fuzzy image | Wrong resolution, bad cable, failing GPU, projector out of focus |
| Burn-in / image persistence | Static image too long — OLED and older plasma. Use screen savers |
| Dead pixels | Manufacturing defect — stuck on (bright) or off (dark). Not repairable |
| Flashing screen | Failing backlight, bad cable, incorrect refresh rate, driver issue |
| Incorrect color display | Bad cable (missing pins), wrong color profile, failing GPU, night mode |
| Audio issues (via display) | HDMI/DP audio not selected as output in OS settings |
| Dim image | Backlight failing, brightness too low, projector lamp aging |
| Intermittent projector shutdown | Overheating (blocked vents, dusty filter), failing lamp |
| **Sizing issues** [NEW] | Resolution mismatch, overscan/underscan settings, wrong aspect ratio |
| **Distorted image** [NEW] | Bad GPU, incorrect refresh rate, failing cable, EMI |` }
      ]},
      { title: "5.3 Deep Dive — CertMaster Additions", sections: [
        { heading: "Projector Lamps, Color Calibration, Display Cable Diagnostics", content: `**Projector lamp life:**
• Traditional high-pressure mercury (UHP) lamps last **2,000–5,000 hours**. Modern LED/laser projectors last **20,000–30,000 hours**.
• Most projectors have an **eco/low-power mode** that extends lamp life by ~50% at the cost of brightness. Enable it when full brightness isn't needed.
• Most projectors log total **lamp hours** in the service menu / OSD. Replace at manufacturer's rated life — gradually dims and color-shifts before failing.
• **Never touch** a replacement lamp bulb with bare skin — skin oils create hotspots that shorten life dramatically.
• **Cool-down period** — never unplug a projector immediately after turning off. Fans continue to run to cool the lamp. Yanking power mid-cooldown severely shortens lamp life.
• **Burnt-out bulb symptoms** — projector powers on but no image, or "lamp" indicator LED on unit is lit red. Replace the whole lamp module (not just the bulb).

**Intermittent projector shutdown** (thermal protection tripping):
1. Check vents for dust/obstruction — **clean or replace the filter**.
2. Clean interior fans.
3. Raise the eco/low-power mode.
4. Verify ambient temperature (projectors struggle above ~35°C / 95°F).
5. If lamp is near end of life, replace it — dying lamps get hotter.

**Monitor color calibration:**
• Windows: Settings → Display → Advanced display → "Color calibration" wizard (or in Control Panel under "Color Management"). Guides you through brightness/contrast/RGB balance.
• macOS: System Settings → Displays → Color → Calibrate.
• **Hardware colorimeters** (X-Rite i1, Datacolor SpyderX) are far more accurate than eyeballing. Used by photo/video pros.
• Common calibration issues: "screen looks too blue/yellow" = **color temperature** off; set to **6500K (D65)** for most sRGB work, 5000K (D50) for print.
• **Night mode / blue light filter** (Night Light on Windows, Night Shift on macOS) **intentionally shifts the display warmer in the evening**. If a user complains about yellowing, check if night mode is enabled/scheduled before assuming hardware failure.

**Display cable diagnostics** (symptom → probable cable issue):
| Symptom | Likely cable cause |
|---------|-------------------|
| No signal | Loose connector, dead cable, wrong input source on monitor |
| Flickering / intermittent blackouts | Damaged cable, loose connector, or cable too long for bandwidth |
| Pink/green/purple tint | Bent pins on VGA/DVI (missing a color channel); or wrong color-profile on digital |
| Fuzzy/soft text | VGA cable or analog conversion (DVI-A, HDMI→VGA adapters); or running non-native resolution |
| Rolling horizontal lines | EMI from unshielded cable near power source |
| Works at 1080p but not 4K/144Hz | Cable doesn't meet spec — need HDMI 2.1 for 4K@120, or DisplayPort 1.4+ |

**HDMI / DisplayPort version bandwidth limits** (why a cheap cable may not do 4K@120):
• HDMI 1.4 — 4K@30
• HDMI 2.0 — 4K@60
• HDMI 2.1 — 4K@120, 8K@60
• DisplayPort 1.2 — 4K@60
• DisplayPort 1.4 — 4K@120, 8K@60 (with DSC)
• DisplayPort 2.0/2.1 — 8K@120

**Testing a display cable** — swap the cable with a known-good one, or test the monitor with a different source. Cheapest fix is often trying a different cable first.` },
        { heading: "System/Display Issues Expanded (Lesson 4C)", content: `**Intermittent lockups / shutdowns — diagnostic flow:**
1. **Eliminate software first** — check for malware, corrupt system files (\`sfc /scannow\`), driver issues.
2. **Look for patterns** — "occurs after running for 30 minutes" suggests **thermal**; "occurs under heavy load" suggests PSU or cooling; random = RAM or motherboard likely.
3. **Check PSU stability** — voltage readings under load (HWiNFO, Windows Task Manager Performance, or PSU tester).
4. **Hardware diagnostics** — RAM test (Windows Memory Diagnostic, MemTest86), CPU stress test (Prime95, AIDA64), disk SMART.
5. **Visual inspection** — capacitor bulging, scorch marks, dust clogging, loose cards, chip creep.

**"Chip creep"** — over time, temperature cycles cause socketed chips and adapter cards to **work themselves loose** from their sockets. A re-seating (press firmly back in) can restore function. Not seen often with modern soldered components.

**Thermal damage signs:**
• Components hot to touch (use caution — can burn)
• Burning smell → power off IMMEDIATELY
• Dust-clogged vents → rapidly rising temperatures
• Loose connectors, widening hairline PCB cracks from thermal cycling

**Overheating fixes:**
• Verify CPU fan is spinning (visual + BIOS reading). **Unpowered/stalled fan is the #1 cause of thermal shutdowns.**
• Check heatsink contact — reseat, clean old paste, apply fresh paste.
• Cooler too small for the CPU? (Stock cooler inadequate for a 95W+ CPU upgrade.)
• **Blanking plates** over empty expansion slots and case holes maintain proper airflow.
• Environment: room temp? PC in direct sunlight? Dust / pet hair accumulation?

**Physical damage inspection — common causes:**
| Cause | Effect |
|-------|--------|
| **ESD** | Damages motherboard chips / components |
| **Electrical spikes** (no surge protector) | Burns soldered components, PSU failure |
| **Overheating** | Solder joints weaken, capacitors bulge, silicon damage |
| **Careless insertion** | Bent pins on CPU sockets, damaged PCIe slot contacts |
| **Liquid spills** | Short circuits — disconnect power immediately, dry completely before attempting power-on |
| **Dirt on contacts** | Connection errors — use compressed air + isopropyl alcohol on contacts (lint-free swab) |
| **Chip creep** | Adapter works loose — reseat |

**Visible motherboard damage:**
• **Scorch marks** around a component = blown.
• **Swollen / bulging / leaking capacitors** = failing board. Tops should be flat, not domed.
• **Cracked PCB traces** — usually fatal without pro repair.

**Performance troubleshooting flow:**
1. **Check for overheating-induced throttling** — hot CPU = clock drops to protect itself. Monitor temp + current clock speed.
2. **What changed?** — performance regression after a build/upgrade/patch. Compatibility issues (wrong RAM slots populated → single channel; wrong PCIe slot → x1 instead of x16).
3. **Verify with benchmarks** — compare current CPU/RAM/disk/network performance to vendor baselines. Quantify "slow" to the specific subsystem.
4. **Rule out software and config** — full disk, background scans, malware, slow network drive, startup program bloat.
5. **Upgrade the bottleneck** — the slowest component defines overall system perceived speed.

**Common bottlenecks:**
• **HDD in a modern system** — upgrade to SSD → often the single biggest perceived speedup.
• **8 GB RAM with modern workloads** — leads to constant paging. Upgrade to 16+ GB.
• **PCIe lane mismatch** — e.g., an NVMe drive in a chipset-lanes slot at PCIe 3.0 x2 instead of 4.0 x4.
• **Full storage** — SSD nearing 90% capacity slows down dramatically.
• **Thermal throttling** — system *has* the capability but can't sustain it.

**Inaccurate system date/time:**
• **RTC (Real-Time Clock)** on motherboard runs off the CR2032 coin-cell battery when PC is off.
• **Date/time resetting to 1980-ish** or login/auth failures across reboots → **RTC/CMOS battery is dead**. Replace with same CR2032 (or whatever the board uses — a few use CR2025 or CR2430).
• Originally called "CMOS battery" because BIOS settings were stored in **CMOS RAM**. Modern systems use **NVRAM / flash** for settings — battery is mostly for the RTC now.
• Beyond the local clock, **NTP (Network Time Protocol)** keeps time accurate across the network (covered in Domain 2).

**Missing video troubleshooting:**
1. **Monitor powered on?** Power LED lit? Standby light vs active?
2. **Input source selected correctly?** Common mistake: HDMI plugged in but monitor set to DVI/VGA input.
3. **Cable fully seated** at both ends; not loose/kinked/crimped.
4. **Cable spec matches the signal?** A basic HDMI cable may not do 4K — needs **High-Speed (HDMI 2.0)** or **Ultra-High-Speed (HDMI 2.1)** cable rating.
5. **Known-good cable swap** + **test monitor with another PC** to isolate.
6. Try **different output port** on the GPU (some outputs may fail while others work).
7. With discrete GPU installed + iGPU enabled, ensure you're plugged into the **GPU, not the motherboard's video output** (unless iGPU is the only video device).

**Projector lamp/bulb detail:**
• Traditional high-pressure mercury lamps: **2,000–5,000 hours**.
• Modern LED/laser light sources: **20,000–30,000 hours** — radically reducing "burned-out bulb" service calls.
• **Failing bulb signs**: dimming image, color shift (toward yellow/green), "bulb life" warning in OSD menu.
• **Burnt-out bulb signs**: **popping sound** when it blew, visible **scorch marks** inside the lamp housing, **broken filament**.
• **Replacement safety**:
  — Let projector **cool fully** (usually 15+ minutes) before opening lamp housing
  — **Never touch** replacement bulb glass with bare skin — skin oils create hot spots that shorten lamp life
  — Handle by the plastic bulb carriage only

**Intermittent projector shutdown causes (order of likelihood):**
1. Overheating from **dust in vents / filter / fan**
2. Ambient temp too high (confined server rooms, hot conference rooms)
3. **Loose power or signal cable** causing brief interruption → auto-shutdown
4. **Improperly installed bulb** not seating securely
5. **Firmware bug** — check for updates from the projector manufacturer

**Video quality issues — symptoms and causes:**

| Symptom | Likely Cause | Fix |
|---------|-------------|-----|
| **Dim image** | OSD brightness low; eco/adaptive mode on; ambient light sensor dimming; **backlight failing** | Adjust OSD; check for power-saving mode; if very dim, backlight needs repair |
| **Fuzzy / blurry image** | **Resolution mismatch** with panel's native (e.g., 1024×768 displayed on a 1920×1080 native panel); wrong driver | Set OS output to the panel's **native resolution** |
| **Flashing / flickering** | Loose cable; failing backlight; internal circuitry; overheating GPU | Reseat cable; test with another PC; monitor GPU temps |
| **Lines, bands, bright spots** | Dying panel or internal controller | Usually replace panel |
| **Stuck pixel** (always ON bright) | Stuck transistor | **Pixel cycling** software or gentle tapping may unstick |
| **Dead pixel** (always BLACK) | Dead transistor | Usually unrecoverable — check warranty for replacement |
| **Display burn-in** | Static image left on screen for extended time | Common on **OLED and plasma**; less on LCD. Prevent with screen saver or auto-off |
| **Color tint** (purple/green/pink tint) | Loose/damaged cable (lost color channel); or failing GPU output | Reseat/replace cable; test on different PC |
| **Color glitches** (horizontal color lines) | Cable issue; low-quality cable can't handle resolution/refresh | Try better cable; try different port |
| **Audio via display not working** | HDMI/DP DO carry audio; DVI/VGA DO NOT; OS output setting | Verify cable type; select display as audio output in OS |
| **Sizing issues** (stretched, compressed, black bars) | Non-native resolution; wrong aspect ratio in OS | Match resolution + aspect ratio to panel's native; OSD "fit to screen" |
| **Distorted image** (wavy, pincushion, geometric warp) | **EMI from nearby device**; CRT needing adjustment; failing cable; wrong refresh rate | Move device away from speakers/motors; adjust CRT pincushion; replace cable |

**OLED vs LCD burn-in**:
• **OLED / Plasma** — each pixel emits its own light, wears down with use. Static bright images eventually leave ghost image.
• **LCD / TFT / LED-backlit** — uses a uniform backlight. Much less prone to burn-in.
• Prevention: enable screen savers, auto-power-off, vary desktop wallpaper.

**Color calibration (professional/design work):**
• **Software calibration** (Windows Color Management, macOS Display Calibrator) — eyeball-based, OK for general use.
• **Hardware colorimeter / spectrophotometer** (X-Rite i1, Datacolor SpyderX, ColorMunki) — puck-like device placed on the screen, measures actual output and builds a **color profile (.icc/.icm)**. Required for accurate photo editing, video color grading, print prep.
• **Test card color patterns** — known reference patterns displayed for visual comparison.

**CRT-specific issues** (rare today but tested):
• **Pincushion distortion** — screen corners bow in or out. Adjust via CRT's OSD pincushion control.
• **Geometric warp** — could need degaussing (built-in button on older CRTs) if magnetic interference occurred.
• **CRT shutdown warning: DON'T open a CRT chassis.** Internal capacitors hold lethal voltages for months after power-off.` }
      ]},
      { title: "5.4 — Mobile Device Issues", sections: [
        { heading: "Mobile Troubleshooting", content: `| Symptom | Probable Cause |
|---------|---------------|
| Poor battery health | Degraded from age/charge cycles — replace battery or device |
| **Swollen battery** | Li-ion failure — **stop using immediately**, fire/explosion risk. Do NOT puncture |
| Broken screen | Physical damage — replace display assembly (LCD + digitizer together) |
| Improper charging | Bad cable, dirty port, wrong charger wattage, failing battery |
| Poor/no connectivity | Airplane mode on, distance from AP, interference, outdated settings |
| Liquid damage | Power off immediately, do NOT use rice (myth). Check LDI (liquid damage indicator) |
| Overheating | Too many apps, direct sunlight, failing battery, case trapping heat |
| Digitizer issues | Touch not responding or wrong location — damaged or needs recalibration |
| Damaged ports | Bent/broken charging port — board-level repair |
| Malware | Pop-ups, battery drain, data spikes — security scan, factory reset if severe |
| Cursor drift / ghost touch | Digitizer failure, screen damage, EMI |
| **Unable to install apps** [NEW] | Storage full, OS too old, incompatible app, MDM policy restricting |
| **Stylus not working** [NEW] | Dead battery, incompatible, digitizer issue, Bluetooth not paired |
| **Degraded performance** [NEW] | Storage nearly full, too many background apps, OS needs update |` }
      ]},
      { title: "5.5 — Network Issues", sections: [
        { heading: "Network Troubleshooting", content: `| Symptom | Probable Cause |
|---------|---------------|
| Intermittent wireless | Interference (microwaves, Bluetooth on 2.4 GHz), distance, overlapping channels |
| Slow speeds | Congestion, wrong band (2.4 vs 5 GHz), cable quality, duplex mismatch |
| **Limited connectivity (169.254.x.x)** | **DHCP failure** — device got APIPA address. Check DHCP server, cable, switch port |
| Jitter | Packet arrival times vary — choppy audio/video. QoS can prioritize traffic |
| Poor VoIP quality | Jitter, latency, packet loss — prioritize with QoS |
| Port flapping | Switch port rapidly up/down — bad cable, failing NIC, duplex mismatch |
| High latency | Congestion, too many hops, bandwidth saturation |
| External interference | Microwaves, baby monitors, cordless phones on 2.4 GHz |
| **Authentication failures** [NEW] | Wrong password, expired credentials, RADIUS/TACACS+ down, certificate issues |
| **Intermittent internet** [NEW] | Failing modem, ISP issues, DNS problems, overheating equipment |

**APIPA (169.254.x.x)** is the #1 most tested network concept. 169.254 = DHCP failed.

**Systematic diagnosis:**
1. ipconfig → check for 169.254.x.x
2. ping 127.0.0.1 → test local TCP/IP stack
3. ping [gateway] → test local network
4. ping 8.8.8.8 → test internet
5. ping google.com → test DNS
6. tracert → find where connection breaks

**Duplex mismatch — specific indicators:**
• One side auto-negotiated to **full duplex**, other forced to **half duplex** → collisions on the full-duplex side
• Symptoms: **late collisions**, **FCS (Frame Check Sequence) errors**, **runts** (undersized frames), slow throughput (especially on large transfers)
• Ping works, file copies crawl, errors visible in switch port counters (\`show interface\` on Cisco)
• Fix: set **both ends the same** — either both auto-negotiate, or both manually configured to same speed/duplex

**VoIP codecs & bandwidth** (for jitter/quality troubleshooting):
| Codec | Bandwidth | Quality | Use |
|-------|-----------|---------|-----|
| **G.711** (μ-law / a-law) | ~87 kbps | Toll quality (PSTN) | LAN, good bandwidth |
| **G.722** | ~96 kbps | HD voice (wideband) | LAN, modern IP phones |
| **G.729** | ~32 kbps | Compressed, acceptable | WAN, bandwidth-limited |
| **Opus** | 8–510 kbps adaptive | Excellent | WebRTC, Teams, Zoom |

**Key VoIP thresholds:**
• **Latency**: < 150 ms one-way ideal; > 300 ms = noticeable delay
• **Jitter**: < 30 ms acceptable; > 50 ms = choppy audio
• **Packet loss**: < 1% acceptable; > 3% = dropouts
• **MOS (Mean Opinion Score)** 1–5 scale: 4.0+ = good, below 3.6 = poor

**QoS markings** for voice: **DSCP EF (46)** — Expedited Forwarding. Prioritized over data in switches/routers.` }
      ]},
      { title: "5.5 Deep Dive — Command-Line Network Tools", sections: [
        { heading: "ipconfig / ifconfig / ip (Interface Configuration)", content: `**Windows: \`ipconfig\`** — shows and manages IP config.

| Command | Purpose |
|---------|---------|
| \`ipconfig\` | Basic: IP, subnet mask, default gateway per interface |
| \`ipconfig /all\` | **Verbose** — MAC, DHCP server, DNS servers, lease times, DNS suffix, DHCP enabled state |
| \`ipconfig /release\` | Releases current DHCP lease — IP goes to 0.0.0.0 |
| \`ipconfig /renew\` | Requests fresh DHCP lease (DORA) |
| \`ipconfig /flushdns\` | **Clears local DNS resolver cache** — fixes stale DNS records |
| \`ipconfig /displaydns\` | Shows current cached DNS entries |
| \`ipconfig /registerdns\` | Re-registers host with DNS server |

**Linux/macOS: \`ifconfig\` (legacy) or \`ip\` (modern):**
• \`ifconfig\` / \`ifconfig eth0\` — interface info
• \`ip addr\` / \`ip a\` — modern replacement, addresses
• \`ip route\` / \`ip r\` — routing table
• \`ip link\` — link-layer info

**What to check with ipconfig /all:**
• **APIPA 169.254.x.x** → DHCP failed
• **All zeros (0.0.0.0)** → no IP, cable/NIC issue
• **Wrong gateway** → misconfigured DHCP or static
• **Missing DNS** → can ping IPs but not names
• **Lease expiration** → client about to lose IP` },
        { heading: "ping — Connectivity Testing", content: `**ping** sends **ICMP Echo Request** packets, measures reply time. First-line connectivity test.

**Syntax:** \`ping [options] target\`

| Option (Windows) | Purpose |
|------------------|---------|
| \`-t\` | Ping **continuously** until Ctrl+C |
| \`-n 10\` | Send exactly **10** packets (default 4 Windows, unlimited Linux) |
| \`-l 1500\` | Packet size in bytes (test MTU) |
| \`-a\` | Resolve IP to hostname (reverse DNS) |
| \`-4\` / \`-6\` | Force IPv4 or IPv6 |

**Linux:** default is continuous; use \`-c 4\` for 4 packets.

**Interpreting output:**
• **Reply from X: bytes=32 time=3ms TTL=64** — successful, low latency
• **Request timed out** — no response within default timeout (4 sec). Host down, firewall blocking ICMP, or congestion
• **Destination host unreachable** — router can't find route
• **TTL expired in transit** — routing loop or distance > 128 hops

**Standard diagnostic sequence:**
1. \`ping 127.0.0.1\` — loopback (TCP/IP stack OK?)
2. \`ping [own IP]\` — NIC OK?
3. \`ping [default gateway]\` — local network OK?
4. \`ping 8.8.8.8\` — internet reachable? (Google DNS, always answers ICMP)
5. \`ping google.com\` — DNS working?

**ICMP types:** Type 0 = Echo Reply, Type 8 = Echo Request, Type 3 = Destination Unreachable, Type 11 = TTL Exceeded.

⚠️ Many corporate firewalls/servers block ICMP by policy. A failed ping doesn't always mean host is down.` },
        { heading: "tracert / traceroute / pathping", content: `**tracert (Windows) / traceroute (Linux/macOS)** — shows the **path of routers** between you and a destination, with latency at each hop.

**How it works:** Sends packets with increasing TTL (1, 2, 3...). Each router at that hop distance replies with "TTL expired" — revealing its IP.

**Syntax:** \`tracert google.com\` or \`tracert -d google.com\` (-d skips DNS lookup for speed)

**Example output:**
\`\`\`
1  <1 ms  router.home [192.168.1.1]
2  12 ms  10.0.0.1  (ISP edge)
3  15 ms  core-router.isp.com [203.0.113.1]
...
9  25 ms  google-peering [216.239.35.0]
10 24 ms  dns.google [8.8.8.8]
\`\`\`

**Reading tracert:**
• **Steady increasing latency** = normal distance
• **Sudden jump** at hop 5 = congestion or transoceanic link at that hop
• **\\* \\* \\***  = router not responding (blocking ICMP or dropped)
• **Final destination reached** = connection OK; latency cumulative through path

**Windows vs Linux:**
• **tracert** (Windows) uses ICMP Echo by default
• **traceroute** (Linux/macOS) uses **UDP** by default — can be blocked differently; use \`-I\` for ICMP or \`-T\` for TCP

**pathping (Windows only)** — combines ping + tracert.
• First traces the route
• Then pings each hop 100 times over ~5 minutes
• Reports **packet loss per hop** — identifies the exact problem router

**When to use which:**
• **ping** — is the host up?
• **tracert** — where does the path break?
• **pathping** — which specific router drops packets? (deep analysis)` },
        { heading: "nslookup / dig — DNS Queries", content: `**nslookup (Windows/Linux) / dig (Linux/macOS preferred)** — manual DNS lookups.

**Basic syntax:**
• \`nslookup google.com\` — returns the A record (IP) for google.com
• \`nslookup 8.8.8.8\` — reverse lookup (PTR record) — IP back to hostname

**nslookup interactive mode** — type \`nslookup\` alone:
• \`> server 8.8.8.8\` — switch to Google DNS
• \`> set type=MX\` — query MX (mail) records
• \`> google.com\` — now asks Google DNS for MX records
• \`> set type=TXT\` — query TXT (SPF, DKIM, DMARC)
• \`> set type=AAAA\` — query IPv6 address
• \`> set type=CNAME\` — query alias records
• \`> exit\` — leave interactive mode

**Common record types to query:**
| Type | Purpose |
|------|---------|
| **A** | IPv4 address |
| **AAAA** | IPv6 address |
| **MX** | Mail servers + preference |
| **CNAME** | Alias (redirects to another name) |
| **TXT** | SPF, DKIM, DMARC, domain verification |
| **NS** | Authoritative name servers |
| **SOA** | Zone administrative record |
| **PTR** | Reverse DNS (IP → name) |
| **SRV** | Service locator (AD, SIP, Minecraft) |
| **ANY** | All records (many servers refuse) |

**Authoritative vs Non-authoritative answers:**
• **Non-authoritative answer** — result from a cache (your resolver), possibly stale
• **Authoritative answer** — from the domain's actual name server

**dig (Linux/macOS)** — more verbose, scriptable:
• \`dig google.com\` — detailed answer section with query time, server
• \`dig google.com MX\` — MX records
• \`dig @8.8.8.8 google.com\` — use specific DNS server
• \`dig +short google.com\` — minimal output (just the IP)
• \`dig -x 8.8.8.8\` — reverse lookup

**When DNS troubleshooting:**
• Can ping IP but not name → DNS problem. \`nslookup\` confirms.
• Wrong IP returned → cache issue. Try \`ipconfig /flushdns\` + another DNS server.
• Intermittent → secondary DNS slow/down. Check both preferred + alternate.` },
        { heading: "netstat / ss — Network Statistics", content: `**netstat (Windows/Linux legacy) / ss (modern Linux)** — shows active network connections and listening ports.

**Common Windows options:**
| Command | Purpose |
|---------|---------|
| \`netstat\` | Active TCP connections |
| \`netstat -a\` | **All** connections AND listening ports |
| \`netstat -n\` | Numeric — no DNS resolution (faster) |
| \`netstat -b\` | Show **process/executable** owning each connection (requires admin) |
| \`netstat -o\` | Show **PID** of process owning each connection |
| \`netstat -r\` | Display **routing table** (same as \`route print\`) |
| \`netstat -s\` | Statistics per protocol (IP, TCP, UDP, ICMP) |
| \`netstat -e\` | Ethernet stats (bytes, packets, errors) |

**Common combinations:**
• \`netstat -ano\` — all connections with PIDs (find which process is using which port)
• \`netstat -anb\` — all connections with executable names (admin-only)

**TCP state meanings in output:**
| State | Meaning |
|-------|---------|
| **LISTENING** | Port open, waiting for connections (servers) |
| **ESTABLISHED** | Active, working connection |
| **TIME_WAIT** | Connection closing; socket held briefly |
| **CLOSE_WAIT** | Remote closed; local still needs to close |
| **SYN_SENT** | Connection attempt in progress |
| **SYN_RECEIVED** | Got SYN, sent SYN-ACK, waiting for ACK |

**Typical uses:**
• Find which program is bound to port 3389 → \`netstat -ano | findstr :3389\`
• Check for suspicious outbound connections (malware C2)
• Verify a service is listening after install

**ss (modern Linux replacement):** \`ss -tulpn\` = TCP, UDP, listening, process, numeric. Faster than netstat on busy systems.` },
        { heading: "arp, route, nbtstat, net, hostname, getmac", content: `**arp — ARP table management**
• \`arp -a\` — shows IP-to-MAC mappings cached locally
• \`arp -d\` — clears cache
• \`arp -s IP MAC\` — adds static entry
• Use when two devices share an IP (ARP conflict) or after a MAC address change

**route — Routing table**
• \`route print\` (Windows) / \`ip route\` (Linux) — shows active routes
• \`route add 10.0.0.0 mask 255.0.0.0 192.168.1.1\` — add a static route
• \`route delete\` — remove route
• Default route shown as \`0.0.0.0\` destination

**nbtstat — NetBIOS over TCP/IP (legacy Windows)**
• \`nbtstat -n\` — local NetBIOS names
• \`nbtstat -c\` — NetBIOS name cache
• \`nbtstat -R\` — reload LMHOSTS file
• Only useful on legacy SMB 1/NetBIOS networks; rarely needed today

**net — Windows network command suite**
• \`net use\` — list or map drives (\`net use Z: \\\\server\\share\`)
• \`net view\` — list computers/shares in workgroup
• \`net user\` — list local users
• \`net session\` — active SMB sessions to this machine
• \`net start\` / \`net stop [service]\` — control services (e.g., \`net stop spooler\`)
• \`net config server\` — server config info

**hostname** — displays computer's NetBIOS / primary name

**getmac** — shows MAC addresses of all NICs (Windows)

**whoami** — shows current username (and \`whoami /all\` for full token info)

**ping -6 / tracert -6 / ipconfig** — all work with IPv6. \`ipconfig\` shows both v4 and v6 addresses.

**PowerShell equivalents (modern Windows):**
| Legacy | PowerShell |
|--------|-----------|
| \`ipconfig\` | \`Get-NetIPConfiguration\` |
| \`ping\` | \`Test-NetConnection\` or \`Test-Connection\` |
| \`tracert\` | \`Test-NetConnection -TraceRoute\` |
| \`netstat\` | \`Get-NetTCPConnection\` |
| \`nslookup\` | \`Resolve-DnsName\` |
| \`arp\` | \`Get-NetNeighbor\` |
| \`route\` | \`Get-NetRoute\` |

**PowerShell cmdlet patterns (verb-noun):**
• PowerShell uses a consistent **\`Verb-Noun\`** naming pattern: \`Get-\`, \`Set-\`, \`New-\`, \`Remove-\`, \`Test-\`, \`Enable-\`, \`Disable-\`, \`Restart-\`.
• Common **network cmdlets**:
  — \`Get-NetAdapter\` — list all NICs with status, speed, MAC
  — \`Get-NetIPAddress\` — all IP addresses (v4 + v6) on all interfaces
  — \`Get-DnsClientCache\` — equivalent of \`ipconfig /displaydns\`
  — \`Clear-DnsClientCache\` — equivalent of \`ipconfig /flushdns\`
  — \`Test-NetConnection google.com -Port 443\` — port-specific reachability test (like telnet but safer)
  — \`Restart-NetAdapter "Ethernet"\` — disable/re-enable NIC in one line
• **Common system cmdlets** (may appear on exam):
  — \`Get-Service\` / \`Start-Service\` / \`Stop-Service\` — manages Windows services (e.g., \`Restart-Service Spooler\`)
  — \`Get-Process\` / \`Stop-Process\` — task manager equivalent
  — \`Get-EventLog -LogName System -Newest 10\` — reads event logs
  — \`Get-ComputerInfo\` — complete hardware/OS summary
• **Pipeline** (\`|\`) — output of one cmdlet becomes input to next. Example: \`Get-Process | Where-Object {$_.CPU -gt 100} | Sort-Object CPU\`
• **Execution policy** — PowerShell blocks scripts by default. \`Set-ExecutionPolicy RemoteSigned\` (admin) allows local scripts to run
• **\`.ps1\`** is the PowerShell script extension; \`.bat\`/\`.cmd\` is legacy Command Prompt

**Which shell to use** (Core 1 context): \`cmd\` (legacy) works everywhere; PowerShell is default on modern Windows and preferred for scripting and Azure/M365 administration. Both available side-by-side.` },
        { heading: "Full Network Troubleshooting Workflow", content: `**When a user reports "internet doesn't work":**

**Step 1 — Gather info**
• What specifically doesn't work (browsing? email? all of it?)
• When did it start?
• What changed (new app, driver, router firmware, config)?
• Affected user-only, or whole site?

**Step 2 — Confirm at the OS**
\`\`\`
ipconfig /all
\`\`\`
Look for:
• **169.254.x.x** → DHCP failed. Check cable, switch port, VLAN, DHCP server.
• **Correct IP, no gateway** → partial config; DHCP may be misconfigured.
• **No DNS servers** → names won't resolve; can still ping IPs.
• **IPv6-only addresses on a dual-stack network** → check IPv4 stack.

**Step 3 — Test layers bottom-up**
\`\`\`
ping 127.0.0.1       (loopback — TCP/IP stack)
ping [my-IP]         (NIC)
ping [gateway]       (local network / router)
ping 8.8.8.8         (internet connectivity)
ping google.com      (DNS working)
\`\`\`

**Step 4 — Path analysis if reachability fails**
\`\`\`
tracert google.com   (where does it break?)
pathping google.com  (which hop drops packets?)
\`\`\`

**Step 5 — DNS-specific**
\`\`\`
nslookup google.com
nslookup google.com 8.8.8.8   (try different DNS server)
ipconfig /flushdns            (clear local cache)
\`\`\`

**Step 6 — Connection-specific**
\`\`\`
netstat -ano        (what's actively connected)
netstat -ano | findstr LISTENING   (what's listening)
arp -a              (address resolution sane?)
\`\`\`

**Step 7 — If nothing works**
• \`ipconfig /release\` then \`/renew\`
• Disable/re-enable NIC
• Reboot router → modem → PC (in that order)
• Check physical: cable, link lights, PoE
• Swap cable with known-good

**Key takeaway:** Command-line tools follow the OSI model. Work from Layer 1 (cable) up through Layer 2 (MAC/ARP), Layer 3 (IP/routing), Layer 4 (ports/TCP), Layer 7 (application/DNS). Never skip layers.` }
      ]},
      { title: "5.6 — Printer Issues", sections: [
        { heading: "Laser Printing Process (7 Steps)", content: `Memorize in order:

1. **Processing** — receives data, rasterizes to bitmap
2. **Charging** — primary charge roller applies uniform negative charge (-600V) to drum
3. **Exposing** — laser discharges areas where toner should stick (~-100V)
4. **Developing** — toner (-200V) attracted to less-negative exposed areas
5. **Transferring** — transfer roller (positive) pulls toner from drum to paper
6. **Fusing** — fuser melts toner into paper (~200°C/400°F) with heat + pressure
7. **Cleaning** — blade scrapes residual toner off drum

**Mnemonic: People Can Eat Delicious Treats For Cash**` },
        { heading: "Printer Symptom → Cause", content: `| Symptom | Cause | Type |
|---------|-------|------|
| Lines down page | Clogged nozzle OR scratched drum | Inkjet / Laser |
| Garbled print | Wrong/corrupt driver, bad cable, insufficient memory | Any |
| Paper jams | Worn pickup rollers, wrong paper, humidity, overfilled tray | Any |
| Faded prints | Low toner/ink, worn drum, failing transfer roller | Any |
| Paper not feeding | Worn pickup/separation rollers, misaligned guides | Any |
| Misfeed | Mixed paper sizes, worn rollers, damaged guides | Any |
| Queue backed up | Print spooler crashed, network issue, printer offline | Any |
| **Speckling** | Excess toner, leaking cartridge, dirty corona wire | **Laser** |
| **Ghosting (double images)** | Drum not cleaned, fuser not hot enough, worn drum | **Laser** |
| Grinding noise | Foreign object, worn gears, failing pickup | Any |
| Finishing issues | **Staple jams** (out of staples, misaligned staple unit), **hole punch** (chad tray full, punch misaligned, wrong paper size selected), finisher jammed, misconfigured driver | Any |
| Incorrect size/orientation | Wrong paper size in driver, tray misconfigured | Any |
| **Tray not recognized** [NEW] | Tray not seated, sensor failure, foreign object | Any |
| **Connectivity issues** [NEW] | Bad cable, wrong IP, wrong subnet, firewall blocking | Any |
| **Frozen print queue** [NEW] | Spooler crashed — restart Print Spooler service | Any |

Know which are **laser-specific**: ghosting, speckling, fuser issues (smudging when rubbed). Streaks from clogged nozzles = inkjet. Paper jams and garbled output = any type.` }

    choices: [
      "A. Shared resources",
      "B. Metered utilization",
      "C. On-demand",
      "D. Resource pooling"
    ],
    correct: "C",
    explanation: "On-demand self-service (as defined for cloud) lets users consume storage (or other resources) when needed and release them when they're no longer required. Metered utilization is billing-based; shared resources and resource pooling describe multi-tenant infrastructure."
  },
  {
    id: "q022",
    domain: 4,
    topic: "4.1",
    topicName: "Virtualization Concepts",
    question: "You've configured a server to run several VMs and are ready to provision them. Which component actually creates and manages the VMs?",
    choices: [
      "A. Remote Desktop Services",
      "B. Hypervisor",
      "C. Virtual LAN",
      "D. Disk Management",
      "E. Device Manager"
    ],
    correct: "B",
    explanation: "A hypervisor (Type 1 like ESXi/Hyper-V or Type 2 like VirtualBox) is the software that creates, runs, and manages virtual machines. RDS delivers remote sessions, VLANs segment networks, Disk Management handles disks, and Device Manager inventories local hardware."
  },
  {
    id: "q023",
    domain: 4,
    topic: "4.2",
    topicName: "Cloud Computing Concepts",
    question: "Your team is adopting cloud services primarily to offload networking, storage, and VM hosting. Which service model fits best?",
    choices: [
      "A. SaaS",
      "B. IaaS",
      "C. PaaS",
      "D. Hybrid cloud"
    ],
    correct: "B",
    explanation: "IaaS (Infrastructure as a Service) provides virtualized networking, storage, and compute (VMs) that the customer manages. SaaS delivers finished applications, PaaS offers development platforms, and hybrid cloud describes a deployment mix."
  },
  {
    id: "q024",
    domain: 4,
    topic: "4.1",
    topicName: "Virtualization Concepts",
    question: "Guest VMs that share the host's physical NIC and appear as independent devices on the physical network are using which type of virtual networking?",
    choices: [
      "A. NAT",
      "B. Private virtual network",
      "C. Host-only networking",
      "D. Bridged networking"
    ],
    correct: "D",
    explanation: "Bridged networking connects VMs directly to the host's physical network so they appear as peers to other LAN devices. NAT hides VMs behind the host's IP, private/host-only networks restrict VMs to an internal virtual segment."
  },
  {
    id: "q025",
    domain: 5,
    topic: "5.6",
    topicName: "Printer issues",
    question: "A network printer stopped serving jobs mid-day. Workstations are configured with direct (manual) printer connections. The printer is still visible in the network directory and prints self-test pages fine. What's the most likely cause?",
    choices: [
      "A. The print spooler was restarted.",
      "B. Two users sent jobs simultaneously and collided.",
      "C. The printer's IP address has changed.",
      "D. The display shows 'perform printer maintenance.'"
    ],
    correct: "C",
    explanation: "Since workstations were manually configured with the printer's old IP, a change (e.g., a new DHCP lease) would break all of them even though the printer works locally. Spoolers don't usually change state on their own; print jobs don't 'collide' in a way that halts printing; a maintenance prompt is just a warning."
  },
  {
    id: "q026",
    domain: 2,
    topic: "2.1",
    topicName: "Ports & Protocols",
    question: "What is one advantage that UDP offers over TCP?",
    choices: [
      "A. It uses flow control.",
      "B. It transfers packets faster.",
      "C. It uses connection handshakes.",
      "D. It is connection based."
    ],
    correct: "B",
    explanation: "UDP is connectionless and has no handshake, flow control, or retransmissions — which makes it faster (at the cost of reliability). TCP provides handshakes, flow control, and connection state, but with more overhead."
  },
  {
    id: "q027",
    domain: 5,
    topic: "5.5",
    topicName: "Network issues",
    question: "A tech replaced a NIC on a Windows PC using static IP on the 192.168.50.0 network. The link LED and activity light are working, the PC boots fine, and he documented the work — but later the user says there's no Internet. Which troubleshooting-methodology step did he skip?",
    choices: [
      "A. Identify the problem.",
      "B. Establish a theory of probable cause.",
      "C. Test the theory to determine the cause.",
      "D. Establish a plan of action.",
      "E. Verify full system functionality.",
      "F. Document findings, actions, and outcomes."
    ],
    correct: "E",
    explanation: "Step 5 of CompTIA's methodology is verifying full system functionality — he never confirmed the PC actually reached the network/Internet with its new static configuration. He also jumped past this step straight to documentation."
  },
  {
    id: "q028",
    domain: 5,
    topic: "5.2",
    topicName: "Storage & RAID issues",
    question: "On a server, two drives in a RAID 5 array have failed. What is the correct recovery action?",
    choices: [
      "A. Replace one drive and run RAID repair.",
      "B. Replace the failed drives and quick-format the array.",
      "C. Replace one failed drive and use system utilities to repair.",
      "D. Replace the failed drives and restore data from tape backup."
    ],
    correct: "D",
    explanation: "RAID 5 tolerates only one drive failure. With two failures the array is lost; the only recovery is to replace both drives, rebuild the array, and restore from backup. Repair with one parity drive's worth of data is not possible."
  },
  {
    id: "q029",
    domain: 1,
    topic: "1.3",
    topicName: "Network Connectivity & App Support",
    question: "Which pair is an example of two-factor authentication?",
    choices: [
      "A. IMEI and IMSI",
      "B. Password plus biometric",
      "C. GPS and location services",
      "D. PRL and baseband updates"
    ],
    correct: "B",
    explanation: "Two-factor authentication requires factors from different categories — here something you know (password) plus something you are (biometric). IMEI/IMSI identify a device/SIM, not the user; GPS/location services aren't authentication; PRL/baseband are cellular updates."
  },
  {
    id: "q030",
    domain: 3,
    topic: "3.8",
    topicName: "Printer Maintenance",
    question: "Which printer type is serviced with a maintenance kit containing a fuser, transfer roller, and pickup rollers?",
    choices: [
      "A. Thermal",
      "B. Laser",
      "C. Inkjet",
      "D. Impact"
    ],
    correct: "B",
    explanation: "Laser printer maintenance kits include the fuser, transfer roller, and pickup rollers — all high-wear parts in the electrophotographic (laser) process. Thermal, inkjet, and impact printers don't use a fuser."
  },
  {
    id: "q031",
    domain: 5,
    topic: "5.4",
    topicName: "Mobile Device issues",
    question: "A laptop shows no lights, no display, and makes no sound when the power button is pressed. Which troubleshooting step should you try first?",
    choices: [
      "A. Boot from a flash drive.",
      "B. Disconnect AC and battery, then hold the power button for several seconds.",
      "C. Remove drives, RAM, and USB devices.",
      "D. Connect an external monitor."
    ],
    correct: "B",
    explanation: "Performing a power drain (removing AC and battery, then holding the power button 15–30 seconds) discharges residual power in capacitors and often fixes a laptop that won't power on. The other steps are later diagnostic moves."
  },
  {
    id: "q032",
    domain: 3,
    topic: "3.6",
    topicName: "Power Supplies",
    question: "You're building a PC that will travel to trade shows on different continents. With that in mind, which PSU spec matters most?",
    choices: [
      "A. Efficiency",
      "B. 12 V rail amperage",
      "C. Input voltage",
      "D. Number of SATA connectors"
    ],
    correct: "C",
    explanation: "Different countries supply different mains voltages (e.g., 120 V in North America vs. 230 V in Europe). A PSU with a manual voltage switch, or a universal auto-switching input, is essential for international use. Efficiency, rail amperage, and connector counts matter but don't determine whether it'll run at all overseas."
  },
  {
    id: "q033",
    domain: 5,
    topic: "5.4",
    topicName: "Mobile Device issues",
    question: "After you replace the LED panel on a laptop, the OS is visible but the touchscreen doesn't respond. Which three are the most probable causes?",
    choices: [
      "A. The touchscreen needs to be calibrated.",
      "B. Touchscreen drivers must be installed.",
      "C. The replacement part isn't touchscreen-capable.",
      "D. A grounding screw isn't secured.",
      "E. The digitizer cable isn't seated in the motherboard.",
      "F. The LCD panel firmware needs updating."
    ],
    correct: "B, C, E",
    explanation: "If the touch layer is a new component, drivers may be needed. If the replacement panel isn't a touchscreen model, touch will never work. If the digitizer ribbon cable isn't properly connected to the board, touch input has no path. Grounding screws and LCD firmware aren't typical touch causes, and calibration applies after the hardware is functioning."
  },
  {
    id: "q034",
    domain: 5,
    topic: "5.3",
    topicName: "Display & Projector issues",
    question: "A monitor's OSD confirms the correct video input, yet nothing appears on screen. Which two causes are most likely?",
    choices: [
      "A. Brightness is set too low.",
      "B. The backlight has failed.",
      "C. No device is sending video.",
      "D. The source cable is disconnected.",
      "E. Contrast is set too high."
    ],
    correct: "C, D",
    explanation: "If the OSD works but there's no image, the monitor's electronics and backlight are fine — the issue is the signal. Either the source isn't outputting (powered off, stuck) or the cable is unplugged/damaged. Brightness, backlight failure, and contrast extremes would still produce a faint/washed image, not 'nothing.'"
  },
  {
    id: "q035",
    domain: 5,
    topic: "5.1",
    topicName: "Motherboard/RAM/CPU/Power issues",
    question: "A PC is randomly rebooting. Which two components should you check first?",
    choices: [
      "A. Memory integrity",
      "B. Video card integrity",
      "C. CMOS battery",
      "D. PSU integrity",
      "E. Optical drive integrity"
    ],
    correct: "A, D",
    explanation: "Failing RAM and an unstable/under-spec'd PSU are the two most common causes of random reboots. A bad video card typically causes display artifacts; a dead CMOS battery loses BIOS settings but doesn't force reboots; optical drives aren't involved."
  },
  {
    id: "q036",
    domain: 1,
    topic: "1.2",
    topicName: "Accessories & Connectivity",
    question: "Which mobile technology enables contactless payment like Apple Pay?",
    choices: [
      "A. IMSI",
      "B. NFC",
      "C. RFID",
      "D. Bluetooth"
    ],
    correct: "B",
    explanation: "Near Field Communication (NFC) enables short-range (~4 cm) contactless payments on mobile devices. IMSI identifies a SIM, RFID is a related but different tag technology, and Bluetooth ranges too far and isn't used for tap-to-pay terminals."
  },
  {
    id: "q037",
    domain: 2,
    topic: "2.6",
    topicName: "SOHO Network Configuration",
    question: "You're setting up a 30-PC office with one server (file, print, and DC roles). What two addressing types should you assign to the server?",
    choices: [
      "A. DHCP",
      "B. MAC",
      "C. Static IP",
      "D. Dynamic IP",
      "E. Subnet mask",
      "F. FTP"
    ],
    correct: "C, E",
    explanation: "Servers need predictable addresses so clients can always find them — use a static IP (not a dynamic/DHCP lease) along with an appropriate subnet mask. MAC is hardware, not assigned. FTP is a protocol, not an address."
  },
  {
    id: "q038",
    domain: 2,
    topic: "2.1",
    topicName: "Ports & Protocols",
    question: "Which protocol does Active Directory rely on the most?",
    choices: [
      "A. SMB",
      "B. HTTPS",
      "C. LDAP",
      "D. DHCP"
    ],
    correct: "C",
    explanation: "Active Directory is built on LDAP (Lightweight Directory Access Protocol) for directory queries and updates. SMB is for file sharing, HTTPS is web traffic, and DHCP hands out IPs."
  },
  {
    id: "q039",
    domain: 3,
    topic: "3.3",
    topicName: "RAM Characteristics",
    question: "A new motherboard has eight DIMM sockets (0–7): four light gray and four darker gray. What should you do first before installing memory?",
    choices: [
      "A. Install memory in the gray slots.",
      "B. Install memory in the dark gray slots.",
      "C. Install memory in slots 0–3.",
      "D. Fill every slot.",
      "E. Consult the motherboard documentation."
    ],
    correct: "E",
    explanation: "DIMM color-coding and numbering varies by vendor. The only guaranteed-correct first step for enabling dual/quad-channel is to read the motherboard manual, which specifies which channel/slot pairs to use."
  },
  {
    id: "q040",
    domain: 3,
    topic: "3.7",
    topicName: "Printers & Settings",
    question: "Which printer technology uses piezoelectric pressure pads to form tiny droplets that transfer to paper?",
    choices: [
      "A. Laser",
      "B. Inkjet",
      "C. Thermal",
      "D. Impact"
    ],
    correct: "B",
    explanation: "Inkjet printers use either thermal or piezoelectric elements to eject ink droplets onto paper. Laser uses electrophotography (toner + fuser), thermal uses heat on special paper or ribbon, and impact uses a pin head striking a ribbon."
  },
  {
    id: "q041",
    domain: 3,
    topic: "3.4",
    topicName: "Storage Devices",
    question: "You're explaining RAID to a nontechnical customer. Which description is best?",
    choices: [
      "A. RAID stands for redundant array of independent disks.",
      "B. RAID uses multiple disks to increase performance and/or provide data-loss protection.",
      "C. RAID is a dynamic disk management system.",
      "D. RAID uses striping to reduce write time and parity bits to reconstruct data from a failed drive."
    ],
    correct: "B",
    explanation: "For a nontechnical audience, the plain-English purpose — more speed and/or protection via multiple disks — is clearest. The acronym alone, the 'dynamic disks' language, and the striping/parity description are technically correct in context but not the best customer-facing explanation."
  },
  {
    id: "q042",
    domain: 5,
    topic: "5.1",
    topicName: "Motherboard/RAM/CPU/Power issues",
    question: "After a CPU install, the PC emits a series of POST beeps and won't boot. What's the most likely cause?",
    choices: [
      "A. Mouse is unplugged.",
      "B. The OS is corrupted.",
      "C. The CPU isn't properly seated.",
      "D. The fan is spinning too fast."
    ],
    correct: "C",
    explanation: "Post-install, the most common failure is that the CPU isn't fully seated or the bent pin(s)/LGA contacts cause it to fail POST (which signals via beep codes). OS corruption is later in boot; mouse/fan issues don't block POST."
  },
  {
    id: "q043",
    domain: 2,
    topic: "2.5",
    topicName: "Networking Hardware",
    question: "Which device should be configured to block specific TCP/UDP ports?",
    choices: [
      "A. Firewall",
      "B. Gateway",
      "C. Router",
      "D. Bridge",
      "E. Access point"
    ],
    correct: "A",
    explanation: "Firewalls apply rules to allow or block traffic by port and address. Routers move packets between networks, gateways bridge different protocols, bridges join LAN segments, and APs provide wireless access."
  },
  {
    id: "q044",
    domain: 3,
    topic: "3.6",
    topicName: "Power Supplies",
    question: "Which connector supplies power to a modern graphics card?",
    choices: [
      "A. 8-pin EATX12V",
      "B. PCIe 8-pin",
      "C. 24-pin ATX",
      "D. SATA 15-pin"
    ],
    correct: "B",
    explanation: "The PCIe 8-pin (sometimes 6+2) connector feeds supplemental power to GPUs that need more than the PCIe slot's 75 W. EATX12V powers the CPU, the 24-pin powers the motherboard, and SATA 15-pin powers drives."
  },
  {
    id: "q045",
    domain: 3,
    topic: "3.1",
    topicName: "Display Components",
    question: "Which two LCD panel technologies offer the widest viewing angles with rich color and consistent backlighting?",
    choices: [
      "A. VA",
      "B. TN",
      "C. IPS",
      "D. LED"
    ],
    correct: "C, D",
    explanation: "IPS panels are known for wide viewing angles and accurate color. LED refers to the backlight type, which delivers more uniform brightness than older CCFL. VA has decent contrast but narrower angles than IPS, and TN has the worst angle/color performance."
  },
  {
    id: "q046",
    domain: 2,
    topic: "2.2",
    topicName: "Wireless Technologies",
    question: "You replaced a laptop's internal WLAN card, and Device Manager shows it enabled. What must you do next to actually use it?",
    choices: [
      "A. Type the security passphrase.",
      "B. Update the WLAN card's firmware.",
      "C. Configure encryption on the router.",
      "D. Add the SSID of the network to the connection."
    ],
    correct: "D",
    explanation: "Once the card is installed and enabled you still need to associate it with a network — select/add the SSID. Entering the passphrase happens after selecting the SSID, but selection is the next action. Firmware updates and router changes aren't required."
  },
  {
    id: "q047",
    domain: 3,
    topic: "3.2",
    topicName: "Cables & Connectors",
    question: "You need to connect external peripherals to a standard PC. Which two connector types are suitable?",
    choices: [
      "A. SATA",
      "B. SAS",
      "C. EIDE",
      "D. eSATA",
      "E. USB 3.0"
    ],
    correct: "D, E",
    explanation: "eSATA and USB 3.0 are both external interfaces. SATA, SAS, and EIDE are internal drive connections not designed to run outside the case."
  },
  {
    id: "q048",
    domain: 3,
    topic: "3.2",
    topicName: "Cables & Connectors",
    question: "You see this wiring sequence: 1) white/orange 2) orange 3) white/green 4) blue 5) white/blue 6) green 7) white/brown 8) brown. Which standard is in use?",
    choices: [
      "A. RJ-45",
      "B. T568B",
      "C. T568A",
      "D. TIA"
    ],
    correct: "B",
    explanation: "That pinout is T568B (orange on pin 1/2, green on 3/6). T568A starts with white/green then green. RJ-45 is the connector, not a wiring standard; TIA is the standards body."
  },
  {
    id: "q049",
    domain: 2,
    topic: "2.8",
    topicName: "Networking Tools",
    question: "You need to build a patch cable to connect a PC to an RJ-45 wall jack. Which tool attaches the RJ-45 plugs?",
    choices: [
      "A. Crimper",
      "B. Punchdown tool",
      "C. Loopback plug",
      "D. Cable tester"
    ],
    correct: "A",
    explanation: "A crimper mechanically secures an RJ-45 plug to the cable end. A punchdown tool is used for keystone jacks or patch panels, a loopback plug tests ports, and a cable tester verifies continuity/wiring after the cable is made."
  },
  {
    id: "q050",
    domain: 2,
    topic: "2.4",
    topicName: "Network Configuration Concepts",
    question: "Four users share a SOHO router. When one streams video, the others' browsing gets slow. Which feature should be enabled to address this?",
    choices: [
      "A. QoS",
      "B. DSL",
      "C. WAN",
      "D. VPN"
    ],
    correct: "A",
    explanation: "Quality of Service (QoS) lets the router prioritize traffic so that one bandwidth-heavy flow doesn't starve other users. DSL is an ISP technology, WAN is a network scope, and VPN tunnels traffic — none solve bandwidth contention."
  },
  {
    id: "q051",
    domain: 5,
    topic: "5.6",
    topicName: "Printer issues",
    question: "An inkjet prints no red at all. All CMYK cartridges are installed and the magenta cartridge was recently replaced. What should you try next?",
    choices: [
      "A. Verify the printer cables are connected.",
      "B. Run a printhead cleaning.",
      "C. Buy a maintenance kit.",
      "D. Use paper of a different weight."
    ],
    correct: "B",
    explanation: "A missing color on an inkjet is almost always a clogged or dried printhead nozzle — run the printer's head-cleaning utility. Cables are fine because other colors print; maintenance kits and paper weight don't fix missing ink."
  },
  {
    id: "q052",
    domain: 5,
    topic: "5.1",
    topicName: "Motherboard/RAM/CPU/Power issues",
    question: "A user says their PC won't boot and they can smell something burning. Which tool is most useful for diagnosis?",
    choices: [
      "A. Loopback plug",
      "B. Cable tester",
      "C. PSU tester",
      "D. ESD strap"
    ],
    correct: "C",
    explanation: "A burning smell with no boot strongly suggests a failing PSU. A PSU tester quickly confirms rail voltages. Loopback plugs and cable testers are for network ports/cables; an ESD strap is PPE, not diagnostic."
  },
  {
    id: "q053",
    domain: 2,
    topic: "2.5",
    topicName: "Networking Hardware",
    question: "Which of these best describes what a network switch does?",
    choices: [
      "A. Converts packets for transit from one network to another.",
      "B. Forwards received frames to specific ports based on MAC.",
      "C. Broadcasts received frames to all ports.",
      "D. Determines whether a packet is local or external."
    ],
    correct: "B",
    explanation: "A switch learns MAC addresses and forwards each frame only to the port of the destination. Routers translate between networks, hubs broadcast to all ports, and routers also decide local vs. external paths."
  },
  {
    id: "q054",
    domain: 5,
    topic: "5.5",
    topicName: "Network issues",
    question: "An Ethernet-connected user's network link repeatedly connects and disconnects. What's the most likely cause?",
    choices: [
      "A. Port flapping",
      "B. High latency",
      "C. Jitter",
      "D. External interference"
    ],
    correct: "A",
    explanation: "A link that repeatedly goes up and down is the textbook definition of port flapping — often due to a bad cable, bad connector, or an unstable switch port. Latency and jitter affect speed/delay consistency but not link state; EMI rarely toggles a wired link."
  },
  {
    id: "q055",
    domain: 3,
    topic: "3.2",
    topicName: "Cables & Connectors",
    question: "Which of these cable types is the most susceptible to electromagnetic interference?",
    choices: [
      "A. Fiber optic",
      "B. STP",
      "C. UTP",
      "D. Multimode"
    ],
    correct: "C",
    explanation: "Unshielded Twisted Pair (UTP) has no metallic shield, making it the most EMI-prone of the listed cables. STP is shielded; fiber (single or multimode) is immune to EMI because it carries light, not electricity."
  },
  {
    id: "q056",
    domain: 5,
    topic: "5.3",
    topicName: "Display & Projector issues",
    question: "A conference-room projector flickers during presentations, but the laptop's own display is fine. Changing resolution didn't help. What should you try next?",
    choices: [
      "A. Check the power cable.",
      "B. Check the video cable.",
      "C. Change projector settings.",
      "D. Change the laptop's aspect ratio."
    ],
    correct: "B",
    explanation: "Since only the projected image flickers and the laptop's built-in screen is stable, the issue is on the signal path to the projector — most often a loose or damaged video cable. Power issues would cause dropouts, not consistent flicker; projector settings and aspect ratio don't cause flicker."
  },
  {
    id: "q057",
    domain: 5,
    topic: "5.5",
    topicName: "Network issues",
    question: "In a 5-PC workgroup sharing a printer attached to one PC, a user can't print but can still access file shares on a different PC. The printer is on. What's the most likely cause?",
    choices: [
      "A. The PC hosting the printer is off the network.",
      "B. The printer needs to be restarted.",
      "C. The printer is low on toner.",
      "D. Device drivers are corrupted."
    ],
    correct: "A",
    explanation: "In a workgroup, a shared printer is reachable only through its host PC. If the user can reach other shares but not the printer share, the host PC is the common point of failure. Restart, toner, and driver issues wouldn't spare other file shares on different PCs."
  },
  {
    id: "q058",
    domain: 2,
    topic: "2.3",
    topicName: "Networked Host Services",
    question: "What term describes an IoT device that contains integrated CPU and RAM, such as a smart security system, medical sensor, or appliance?",
    choices: [
      "A. Embedded systems",
      "B. Syslog servers",
      "C. Web servers",
      "D. IDS/IPS systems"
    ],
    correct: "A",
    explanation: "Embedded systems are purpose-built computing units inside larger devices — exactly the description of IoT hardware. Syslog/web/IDS/IPS are server-side network services."
  },
  {
    id: "q059",
    domain: 3,
    topic: "3.7",
    topicName: "Printers & Settings",
    question: "A training-room printer must print on both sides of the paper to comply with a green policy. Which printer feature is the key one to configure?",
    choices: [
      "A. Orientation",
      "B. Print quality",
      "C. Duplexing",
      "D. Sharing",
      "E. ADF"
    ],
    correct: "C",
    explanation: "Duplexing enables two-sided printing, saving paper. Orientation is portrait/landscape; print quality affects density/DPI; sharing allows network access; ADF (auto document feeder) is a scanner/MFP input feature."
  },
  {
    id: "q060",
    domain: 3,
    topic: "3.6",
    topicName: "Power Supplies",
    question: "Which two voltages are standard PSU output rails?",
    choices: [
      "A. 1.5 V",
      "B. 3.3 V",
      "C. 5 V",
      "D. 9 V"
    ],
    correct: "B, C",
    explanation: "PC PSUs output +3.3 V, +5 V, and +12 V rails (plus −12 V and 5 V standby on the ATX standard). 1.5 V and 9 V are not standard PSU rails."
  },
  {
    id: "q061",
    domain: 5,

    question: "A contractor is pulling Ethernet cable through the space above a drop ceiling that doubles as HVAC return airflow for the building. Which cable rating is REQUIRED by building code for this run?",

  {

    domain: 3,
    topic: "3.1",
    topicName: "Display Components",
    question: "A graphic designer complains that fast-moving objects in video playback show a horizontal split where the top of the image doesn't match the bottom. Which display technology or setting most directly addresses this artifact?",
    choices: [
      "A. Enable adaptive sync (FreeSync / G-Sync) to match refresh rate to GPU frame rate",

      "C. Enable HDR10 to widen the dynamic range",
      "D. Increase color depth from 8-bit to 10-bit"

    correct: "A",
    explanation: "The described split is screen tearing, caused when the monitor refreshes while the GPU is mid-frame. Adaptive sync (FreeSync/G-Sync/VESA Adaptive-Sync) varies the refresh rate to match the GPU and eliminates tearing. Switching panel types reduces ghosting, not tearing; HDR and higher bit depth affect color/brightness, not frame timing."

  {
    id: "pq_3_1_2",
    domain: 3,
    topic: "3.1",
    topicName: "Display Components",
    question: "A hospital is specifying touch displays for a clinical cart where nurses wearing latex gloves must operate the screen reliably. Which touchscreen technology is the best fit?",

      "B. Resistive",
      "C. OLED with digitizer",
      "D. Infrared grid (IR touch)"
    ],
    correct: "B",
    explanation: "Resistive touchscreens respond to pressure from any object (gloved finger, stylus, fingernail), making them common in industrial and medical environments. Capacitive requires electrical conductivity from bare skin or a capacitive stylus, so latex gloves typically won't register. OLED/digitizer does not describe a touch sensing technology by itself, and IR grid touch is mainly used on large interactive displays."

  {

    question: "A technician needs to run Ethernet between two buildings through an underground conduit-free trench, with 10 Gbps speed at 90 meters. Which cable is the most appropriate choice?",

  {
    id: "pq_3_2_2",
    domain: 3,
    topic: "3.2",
    topicName: "Cables & Connectors",
    question: "A user reports that their new USB-C cable powers their laptop but only delivers about 60 W, even though the charger and laptop both advertise 100 W USB Power Delivery. Which is the MOST likely cause?",

    ],
    correct: "B",
    explanation: "USB PD over USB-C can deliver up to 100 W (PD 3.0) or 240 W (PD 3.1), but any cable carrying more than 60 W must include an E-marker chip that advertises its capability. Without the E-marker the negotiation stops at 60 W. Thunderbolt cables actually support PD fully, PD 3.0 goes to 100 W, and the USB data version does not cap PD power."
  },
  {
    id: "pq_3_2_3",
    domain: 3,
    topic: "3.2",
    topicName: "Cables & Connectors",
    question: "While terminating a data-center fiber patch, a technician notices one connector has a blue boot with a flat-polished ferrule and another has a green boot with an angled ferrule. What is the correct action?",
    choices: [
      "A. Mate them together — the different polishes are cosmetic only",

  {
    id: "pq_3_2_4",
    domain: 3,
    topic: "3.2",

    question: "A customer has an old LCD monitor with only a VGA input. Their new workstation's graphics card has a single DVI-D port. What adapter solution will work?",

    ],
