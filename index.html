• **10.0.0.0/8** (10.0.0.0 – 10.255.255.255)
• **172.16.0.0/12** (172.16.0.0 – 172.31.255.255)
• **192.168.0.0/16** (192.168.0.0 – 192.168.255.255)

**APIPA (169.254.x.x)** — Automatic Private IP Addressing. Assigned when DHCP fails. NOT routable. Indicates a problem.
**Loopback: 127.0.0.1** — tests local TCP/IP stack.

**IPv6** — 128-bit, hexadecimal. Leading zeros dropped, one group of consecutive zero sections replaced with **::**. No NAT needed.

**Static vs Dynamic:**
• **Static** — manually configured. For servers, printers, routers (need consistent address)
• **Dynamic** — assigned by DHCP. For workstations, phones, laptops

**Subnet mask** — defines network vs host portion of IP. Common: 255.255.255.0 (/24 = 254 hosts). Client mask MUST match network.

| CIDR | Subnet Mask | Usable Hosts |
|------|-------------|-------------|
| /24 | 255.255.255.0 | **254** |
| /25 | 255.255.255.128 | **126** |
| /26 | 255.255.255.192 | **62** |
| /27 | 255.255.255.224 | **30** |
| /28 | 255.255.255.240 | **14** |
| /30 | 255.255.255.252 | **2** |

**Default gateway** — router's IP on local network. All non-local traffic goes here first. Wrong/unreachable gateway = local access works, NO internet.` }
      ]},
      { title: "2.6 Deep Dive — CertMaster Additions", sections: [
        { heading: "IPv4 Address Classes, NAT/PAT", content: `**Classful IPv4** (historical, still relevant for exam):

| Class | First octet range | Default mask | # networks | Hosts/network | Example |
|-------|-------------------|--------------|------------|---------------|---------|
| **A** | 1–126 | 255.0.0.0 (/8) | 126 | 16,777,214 | 10.x.x.x (private) |
| **B** | 128–191 | 255.255.0.0 (/16) | 16,384 | 65,534 | 172.16–31.x.x (private) |
| **C** | 192–223 | 255.255.255.0 (/24) | ~2M | 254 | 192.168.x.x (private) |
| **D** | 224–239 | — | Multicast (not for hosts) | — | — |
| **E** | 240–255 | — | Experimental/reserved | — | — |

**Private address ranges (RFC 1918)** — not routable on the public internet; reused by every home/office network:
• **Class A private:** 10.0.0.0/8 (10.0.0.0 – 10.255.255.255)
• **Class B private:** 172.16.0.0/12 (172.16.0.0 – 172.31.255.255)
• **Class C private:** 192.168.0.0/16 (192.168.0.0 – 192.168.255.255)

**Special addresses:**
• **127.0.0.0/8 (loopback)** — 127.0.0.1 is "localhost." Tests your own TCP/IP stack. Traffic never leaves the NIC.
• **169.254.0.0/16 (APIPA / link-local)** — self-assigned when DHCP fails. Means "DHCP didn't work."
• **0.0.0.0** — "any" / default route / "I don't have an IP yet" (DHCP)
• **255.255.255.255** — limited broadcast (all hosts on local segment)

**NAT (Network Address Translation):**
• Router translates **private source IPs** on outbound traffic to its **public IP** and back. This is why everyone can use 192.168.1.x behind their own router.
• **Static NAT** — 1:1 mapping (public IP ↔ private IP). Used to expose a server.
• **Dynamic NAT** — pool of public IPs, mapped as needed.
• **PAT (Port Address Translation)** — aka **NAT Overload**. Many private IPs share ONE public IP by using different source ports. This is what your home router does.` },
        { heading: "IPv6 Detail: Link-Local, Global, Dual-Stack", content: `**IPv6 structure:** 128-bit address, written as 8 groups of 4 hex digits separated by colons.
Full: \`2001:0db8:0000:0000:0000:ff00:0042:8329\`
Shortened: \`2001:db8::ff00:42:8329\` (drop leading zeros per group; \`::\` replaces ONE run of zero groups)

**IPv6 address types** (equivalent roles to IPv4):

| Type | Prefix | IPv4 equivalent | Notes |
|------|--------|-----------------|-------|
| **Global unicast** | 2000::/3 (starts with 2 or 3) | Public IP | Internet-routable |
| **Link-local** | **fe80::/10** | APIPA (169.254) | Auto-assigned on every IPv6 interface; ONLY valid on the local link, never routed |
| **Unique local** | fc00::/7 (usually fd00::/8) | Private (10.x, 192.168.x) | Private, not routed on internet |
| **Loopback** | ::1/128 | 127.0.0.1 | Localhost |
| **Multicast** | ff00::/8 | Multicast 224.x | One-to-many |
| **Anycast** | — | (no IPv4 equivalent) | Traffic goes to "closest" of many identical instances |

**No broadcast in IPv6** — replaced by multicast (\`ff02::1\` = all nodes on link).

**Dual stack** — device runs IPv4 AND IPv6 simultaneously, picks the best protocol per connection. The standard migration approach today.

**SLAAC (Stateless Address Autoconfiguration)** — IPv6 hosts can self-configure a global address from the router-advertised prefix + their own interface ID. No DHCP required (though DHCPv6 exists).

**EUI-64 (Extended Unique Identifier, 64-bit)** — one way SLAAC generates the host's interface ID from its 48-bit MAC address:
1. Split MAC in half, insert \`FF:FE\` in the middle (48 → 64 bits).
2. Flip the **7th bit** (universal/local bit).
3. Example: MAC \`00:1A:2B:3C:4D:5E\` → EUI-64 \`02:1A:2B:**FF:FE**:3C:4D:5E\`.
• Privacy concern — the MAC is embedded in the IP, so devices can be tracked across networks. Modern OSes default to **random privacy addresses (RFC 4941)** instead of EUI-64 for outbound connections.

**DHCPv6** — DHCP for IPv6. Two modes:
• **Stateful DHCPv6** — hands out full addresses + options (like IPv4 DHCP). Client gets its address from the DHCPv6 server.
• **Stateless DHCPv6** — client uses SLAAC for its address, but DHCPv6 delivers **extra options** (DNS servers, domain suffix, NTP) that SLAAC alone doesn't provide.
• **Router Advertisement flags** (M and O bits) tell the client which mode to use: M=managed (stateful), O=other (stateless DHCPv6 for extras).
• Uses **UDP port 546** (client) and **547** (server). IPv4 DHCP used 67/68.` }
      ]},
      { title: "2.6 Deep Dive II — TCP/IP Model, ARP, Classful Addressing (Lesson 6B)", sections: [
        { heading: "TCP/IP Four-Layer Model", content: `The **TCP/IP reference model** organizes protocols into **4 layers** (contrast with OSI's 7 — both are taught; CompTIA uses TCP/IP for 1201):

| Layer | Purpose | Data unit | Example protocols |
|-------|---------|-----------|-------------------|
| **4. Application** | App-level functions (web, email, DNS) — what you actually *use* | Data / Messages | HTTP, HTTPS, FTP, DNS, SMTP, IMAP, POP3, DHCP, SSH, SNMP |
| **3. Transport** | Host-to-host delivery; multiple conversations via ports | Segments (TCP) / Datagrams (UDP) | **TCP**, **UDP** |
| **2. Internet** | Logical addressing + routing between networks | Packets | **IP**, ICMP, **ARP** |
| **1. Link** / Network Interface | Physical transmission on local segment | Frames | Ethernet (802.3), Wi-Fi (802.11), PPP |

**Encapsulation** — each layer wraps data from the layer above with its own header (and sometimes trailer). Outgoing: App → Transport → Internet → Link (add header each time). Incoming: reverse.

**Link layer** is not really a TCP/IP protocol — it's whatever underlying network carries the traffic (Ethernet, Wi-Fi, cellular, PPP over DSL). Communications happen only within a **single local segment** — MAC addresses are used here.

**Internet layer** gets data between networks. **IP is unreliable and connectionless** — packets may be lost, delivered out of order, duplicated, or delayed. Reliability is the Transport layer's job.

**End system host** vs **intermediate system** (router): end systems run apps; intermediate systems forward traffic.

**Transport layer — TCP vs UDP comparison:**
| Property | **TCP** | **UDP** |
|----------|---------|---------|
| Connection | Connection-oriented (3-way handshake) | Connectionless |
| Reliability | **Reliable** — retransmits lost/out-of-order | Unreliable — "fire and forget" |
| Ordering | Sequenced | No guarantee of order |
| Overhead | Higher (headers, ACKs) | Minimal |
| Use cases | Web, email, file transfer, SSH — data integrity matters | Voice, video, gaming, DNS, DHCP — speed > perfection |

Lost/garbled UDP packets manifest as momentary audio squeaks or video glitches rather than app crashes.

**ARP (Address Resolution Protocol)** — **maps IP addresses to MAC addresses on the local segment**.
• When a host wants to send to an IP on its own LAN, it needs the destination's MAC address.
• Host broadcasts "who has 192.168.1.50?" The owner of that IP replies with its MAC.
• Result cached in the local **ARP table** (view with \`arp -a\`).
• ARP is part of IPv4. **IPv6 replaces ARP with Neighbor Discovery (ND)**.

**Neighbor Discovery (ND)** — IPv6 protocol that replaces ARP. Also used for:
• **SLAAC** (StateLess Address AutoConfiguration) — host learns its own IPv6 address from the router's advertisements.
• **Router Solicitation/Advertisement** — how hosts find the local router (no default gateway needs to be configured manually).

**IETF (Internet Engineering Task Force)** — the body that develops and maintains internet protocol standards. Standards published as **RFCs (Request For Comments)**. Official repository at **rfc-editor.org**.` },
        { heading: "Classful Addressing, Subnet Masks, Dotted Decimal, Broadcast Address", content: `**IPv4 address = 32 bits** = 4 octets (bytes). Written in **dotted decimal notation** with each octet 0–255: \`192.168.0.1\`.

Theoretical range: \`0.0.0.0\` to \`255.255.255.255\`. Some ranges reserved for special uses.

**Subnet mask / network prefix** — tells you which part of the address is the **network ID** vs. the **host ID**:

The mask is a 32-bit value where leading 1s mark the network portion. Example /24 prefix:
• Binary: \`11111111 11111111 11111111 00000000\`
• Dotted decimal: \`255.255.255.0\`
• Slash notation: \`/24\`

When the mask is combined with an IP address, wherever the mask has a 1, the corresponding IP bit is part of the **network ID**. Where the mask has a 0, it's part of the **host ID**.

Example: \`192.168.0.100 / 255.255.255.0\` (or \`/24\`)
• Network ID: **192.168.0.0**
• Host ID within network: **.100**
• Valid host range: **192.168.0.1 – 192.168.0.254**

**Two addresses NOT available as hosts within each subnet:**
• **First address** (all host bits 0) = **network ID** (e.g., 192.168.0.0)
• **Last address** (all host bits 1) = **broadcast address** (e.g., 192.168.0.255) — packets sent here go to every host on the subnet

In a /24 with 256 addresses, you get **254 usable host addresses**.

**IPv4 address classes (legacy, pre-CIDR)** — still on exams:

| Class | First octet | Default mask | Prefix | Notes |
|-------|-------------|--------------|--------|-------|
| **A** | **0–127** | 255.0.0.0 | **/8** | Huge networks (16M hosts each) |
| **B** | **128–191** | 255.255.0.0 | **/16** | Medium networks (65K hosts each) |
| **C** | **192–223** | 255.255.255.0 | **/24** | Small networks (254 hosts each) |
| **D** | **224–239** | — | — | **Multicast** groups (not for host assignment) |
| **E** | **240–255** | — | — | **Reserved / experimental** — not routable |

**127.x.x.x** = **loopback** (reserved out of Class A). 127.0.0.1 = "this machine / localhost."

**RFC 1918 private address ranges** (not routable on public internet):
| Class | Private range |
|-------|---------------|
| **A** | **10.0.0.0 – 10.255.255.255** (/8) |
| **B** | **172.16.0.0 – 172.31.255.255** (/12) |
| **C** | **192.168.0.0 – 192.168.255.255** (/16) |

**How a host decides: local delivery or route to gateway?**
1. Host compares its own IP+mask against the destination IP+mask.
2. If the masked **network portions match** → destination is local → send directly (ARP for MAC).
3. If they **don't match** → send to the **default gateway** (router) for forwarding.

Example:
• Host: 192.168.0.100/24 → Network 192.168.0.0
• Dest: 192.168.0.50 → same network → local delivery
• Dest: 192.168.1.50 → different network → send to gateway

**Default gateway** must itself be in the same IP network as the host (e.g., 192.168.0.1 for hosts on 192.168.0.0/24).

**Private→Public translation options:**
• **NAT (Network Address Translation)** at the router — private IPs translated to the router's public IP (covered earlier).
• **Proxy server** — application-layer intermediary. Clients send requests to the proxy, which fulfills them on behalf of the client using its own public IP. Common for web-content filtering and caching.

**Identifying a public IPv4 address quickly**:
• NOT in 10.x / 172.16–31.x / 192.168.x (private)
• NOT starting with 0 (invalid)
• NOT 127.x (loopback)
• NOT 169.254.x (link-local / APIPA)
• NOT 224.x or higher (multicast/reserved)

**Host configuration parameters** (minimum for internet-usable host):
1. **IP address** (static or DHCP)
2. **Subnet mask** (dotted decimal or prefix length)
3. **Default gateway** — router interface IP
4. **DNS server(s)** — usually preferred + alternate for redundancy

Without a gateway, the host can only talk to its own subnet. Without DNS, internet still works but only by IP address — no name resolution.

**Static vs. dynamic assignment — when to use each:**
• **Static** — routers, servers, network printers, VoIP phones. Any device that needs a consistent IP for other devices to find it.
• **Dynamic (DHCP)** — client workstations, laptops, phones. No manual setup per host; centralized IP management.

**DHCP process — DORA**:
1. **Discover** — client broadcasts "I need an IP"
2. **Offer** — DHCP server(s) offer an IP from the pool
3. **Request** — client formally requests one of the offers
4. **Acknowledge** — server assigns the lease

DHCP also delivers: subnet mask, default gateway, DNS servers, lease time, often NTP server, search domain.

**DHCP lease time** — e.g., 24 hours. Client tries to renew at 50% of lease time (T1 timer), then tries any server at 87.5% (T2).

**APIPA (Automatic Private IP Addressing)** — Microsoft term for **169.254.0.1 – 169.254.255.254** auto-assigned by a host when its configured DHCP server doesn't respond.
• Other vendors call this **"link-local"** addressing.
• APIPA hosts can talk to each other (if all on same LAN and all fell back to APIPA) but **cannot reach other networks or the internet**.
• **An APIPA address is a symptom of a DHCP problem** — usually a bad cable, dead DHCP server, or misconfigured VLAN.

**IPv6 prefix allocations** (for reference):
• An ISP typically gets a **/32** block from its RIR.
• Each end customer gets a **/48** prefix (allows 65,536 subnets of /64).
• **Standard subnet in IPv6 = /64** — host identifier is always the last 64 bits.

**IPv6 addresses per interface** — unlike IPv4 (usually one IP), an IPv6 interface **typically has multiple addresses**: always a link-local (fe80::/10), often a global (2000::/3), sometimes a unique-local (fc00::/7), and various multicast memberships.

**Dual stack** — host runs IPv4 and IPv6 simultaneously. **Modern OSes default to trying IPv6 first, fall back to IPv4** if the destination doesn't support IPv6.` }
      ]},
      { title: "2.7 — Connection & Network Types", sections: [
        { heading: "Internet Connection Types", content: `| Type | Medium | Speed | Notes |
|------|--------|-------|-------|
| **Fiber** | Fiber optic | 100 Mbps – 10 Gbps | Fastest, limited availability |
| **Cable** | Coaxial | 25–1000 Mbps | Shared bandwidth with neighbors |
| **DSL** | Phone line | 5–100 Mbps | Speed decreases with distance from CO |
| **Satellite** | Radio waves | 12–100 Mbps | High latency (~600ms). Available everywhere. Weather-sensitive |
| **Cellular (5G/4G)** | Radio waves | 10–1000 Mbps | Mobile. Varies by coverage |
| **WISP** | Fixed wireless | Varies | Point-to-point or tower. Rural areas |

**Network types:**

| Type | Scope | Example |
|------|-------|---------|
| **LAN** | Single building/floor | Office network |
| **WAN** | Multiple LANs across distance | Corporate offices in different cities |
| **PAN** | Personal, ~10m | Bluetooth headset to phone |
| **MAN** | City-wide | Municipal Wi-Fi, campus network |
| **SAN** | Storage-specific | Servers to storage arrays (Fiber Channel, iSCSI) |
| **WLAN** | Wireless LAN | Wi-Fi network |` }
      ]},
      { title: "2.7 Deep Dive — CertMaster Additions", sections: [
        { heading: "DSL, Cable, Fiber, Satellite & Cellular Detail", content: `**DSL (Digital Subscriber Line)** — runs over existing phone copper:
• **ADSL (Asymmetric DSL)** — downloads faster than uploads (hence "asymmetric"). Typical 1–25 Mbps down / 1–3 Mbps up. Most common residential DSL.
• **VDSL (Very-high-bit-rate DSL)** — faster than ADSL: up to ~100 Mbps down, ~50 Mbps up. Requires shorter loops (closer to the telco).
• **SDSL (Symmetric DSL)** — equal up/down. Business use.
• **Speed drops with distance** from the central office — copper signal attenuation limits typical service to ~18,000 ft (5.5 km) from CO/DSLAM.

**Cable — DOCSIS (Data Over Cable Service Interface Specification)**:
• Standard cable modems use. Version matters:
  — **DOCSIS 3.0** — up to 1 Gbps down / 100 Mbps up (bonded channels)
  — **DOCSIS 3.1** — up to 10 Gbps down / 1–2 Gbps up
  — **DOCSIS 4.0** — symmetric 10 Gbps (emerging)
• Shared medium — speed degrades during peak neighborhood usage ("evening slowdown").

**Fiber to the X (FTTx)**:
• **FTTH (Fiber to the Home) / FTTP (Premises)** — fiber all the way to the residence. Terminated by an **ONT (Optical Network Terminal)** on the customer side. Fastest, most consistent.
• **FTTC (Fiber to the Curb / Cabinet)** — fiber to a neighborhood cabinet, then VDSL copper to the home. Hybrid approach.
• **FTTN (Fiber to the Node)** — fiber to a farther-out node. Longer copper runs → lower speeds than FTTC.
• **GPON (Gigabit Passive Optical Network)** — the technology inside most FTTH deployments. "Passive" = no powered equipment between ISP and home.

**Satellite internet:**
• **GEO (Geostationary)** — ~35,786 km (22,236 mi) above equator. Single satellite covers huge area. **High latency: ~600 ms round-trip** because of distance. Examples: HughesNet, Viasat. Weather-sensitive (rain fade).
• **LEO (Low Earth Orbit)** — ~550 km. **Much lower latency: ~20–40 ms**. Requires **constellation** (thousands) of satellites with constant handoff. Example: **Starlink**. Changing the game for rural internet.
• **MEO (Medium Earth Orbit)** — between GEO and LEO; less common for consumer internet.

**Cellular generations (know these):**
| Gen | Technology | Typical speeds | Notes |
|-----|-----------|----------------|-------|
| **2G** | GSM / CDMA | ~0.1 Mbps | Voice + SMS; legacy |
| **3G** | UMTS / HSPA / EV-DO | 0.5–42 Mbps | Decommissioned by most US carriers |
| **4G LTE** | LTE / LTE-Advanced | 10–300 Mbps | Current dominant standard |
| **5G** | NR (New Radio) | 50–1000+ Mbps | Three flavors: **low-band** (wide coverage, modest speed), **mid-band** (sub-6 GHz, balanced), **mmWave** (24+ GHz, extremely fast, very short range, blocked by walls) |

**GSM vs. CDMA** — the two historical 2G/3G technologies. GSM used SIM cards (swappable between devices); CDMA historically did not. **4G LTE and 5G all use SIM/eSIM** regardless of carrier, so the distinction is largely obsolete on modern devices.

**WISP (Wireless ISP)** — fixed wireless. Antenna on customer's roof aimed at ISP tower/base station. Line-of-sight required for best performance. Common in rural areas where cable/fiber isn't economical.` },
        { heading: "Internet Infrastructure, DSL/Cable Modem Detail, VSAT, Cellular Specifics (Lesson 6A)", content: `**Internet structure:**
• **IXP (Internet eXchange Point)** — physical location where multiple ISPs meet and exchange traffic directly (peering) to avoid upstream transit fees.
• **PoP (Point of Presence)** — ISP's local connection point to customer premises (often a telephone exchange building).
• **Transit vs. Peering** — transit = pay upstream ISP to reach the rest of the internet; peering = mutual no-cost traffic exchange between ISPs.

**PSTN (Public Switched Telephone Network):**
• Traditional global voice telephone network.
• **Core is fiber optic**; edge to the home is typically low-grade 2-pair copper — known as the **"local loop"** or **"last mile"**.
• DSL uses higher frequencies on this copper to carry internet data alongside voice.

**DSL modem physical detail:**
• **RJ11 WAN port** — connects to the phone jack on the wall.
• **RJ45 LAN port** — connects to the customer's router.
• **DSL filter / splitter** — small device at each phone jack that **separates voice frequencies (0–4 kHz) from data frequencies (>25 kHz)**. Without a filter, phones will pick up hissing and data will be corrupted. Modern jacks often include a built-in splitter.
• An ADSL modem **cannot** be swapped for a VDSL one, but **VDSL modems usually support ADSL** (backward).

**ADSL2+** — the most common consumer ADSL variant: **up to ~24 Mbps down / 1.4–3.3 Mbps up**.

**Cable modem specifics:**
• **HFC (Hybrid Fiber-Coax)** network — fiber backbone + coax to customers.
• **DOCSIS** (Data Over Cable Service Interface Specification) — standard.
• **DOCSIS 3.0**: up to ~1 Gbps / 100 Mbps. North American reference: 42.88 Mbps/channel down. Multiple channels bonded.
• **DOCSIS 3.1**: up to 10 Gbps / 1–2 Gbps.
• **DOCSIS 4.0**: **10 Gbps down / 6 Gbps up** (symmetric-capable).
• Cable modem uses **F-type connector** (screw-on) for coax — **do not overtighten**, just finger-tight + snug with pliers.
• **CMTS (Cable Modem Termination System)** — ISP-side equipment that aggregates cable-modem customers onto the ISP backbone.

**FTTx variants expanded:**
| Type | Where fiber stops | Last-mile |
|------|-------------------|-----------|
| **FTTP / FTTH** | At the **premise / home** | No copper in last mile (fastest) |
| **FTTC (Fiber to the Curb)** | Neighborhood cabinet | **VDSL** over existing copper |
| **FTTN (Fiber to the Node)** | Farther-back cabinet / street junction | Longer copper run → lower speeds |
| **FTTB (Fiber to the Building)** | At building basement/MDF | Ethernet or VDSL up through building |

**VDSL speeds over FTTC (distance-dependent):**
• Over **300 m (1,000 ft)**: ~52 Mbps down / 16 Mbps up (asymmetric)
• Over **250 m (820 ft)**: ~300 Mbps down / 100 Mbps up (VDSL2-Vplus)

**FTTP / FTTH / PON components:**
• **OLT (Optical Line Terminal)** — ISP-side equipment at the PoP.
• **Optical splitter** — passive device that splits one fiber into many customer feeds (why it's called "passive" optical network — PON).
• **ONT (Optical Network Terminal)** — at the customer's premises. Converts optical signal to electrical (RJ45). May also contain the router (combined unit).

**Satellite internet expanded:**
| Orbit | Altitude | RTT latency | Typical speeds | Antenna mechanics |
|-------|----------|-------------|----------------|-------------------|
| **GEO (Geostationary)** | **~35,786 km** above equator | **600–800 ms** | ~2–6 Mbps up / ~30 Mbps down | Fixed-aim dish (satellite doesn't move relative to Earth). **VSAT (Very Small Aperture Terminal)** antenna. Uses **DVB-S modem**. |
| **LEO (Low Earth Orbit)** | ~550 km | **25–60 ms** | 5–220 Mbps | **Phased array** antenna dynamically tracks satellites (or motorized dish). Example: Starlink |
| **MEO (Medium Earth Orbit)** | ~8,000–20,000 km | Between | — | Less common for consumer internet |

**RTT (Round-Trip Time)** = time for a probe to travel to destination and reply back. Key metric for VoIP, video conferencing, gaming. **GEO satellite RTT is prohibitive** for real-time apps.

**Cellular generations — detailed:**

| Gen | Standard(s) | Max speed | Spectrum | Notes |
|-----|------------|-----------|----------|-------|
| **2G (legacy)** | GSM / CDMA | ~0.1 Mbps | 850 / 900 / 1800 / 1900 MHz | Voice + SMS. Largely shut down by major US carriers. |
| **3G — GSM family** | **UMTS**, **HSPA**, **HSPA+** | UMTS ~3 Mbps; HSPA+ **up to 42 Mbps** | 850/1900 MHz (Americas), 900/1800 MHz (RoW) | Status bar icons: G, E (2G fallback); 3G / H / H+ |
| **3G — CDMA family** | **EV-DO** | ~3 Mbps | Similar | Status bar: 1X (minimal), 3G |
| **4G** | **LTE / LTE-Advanced** | 10–300 Mbps typical | 600–2500 MHz (Americas) | Unified — both GSM and CDMA carriers adopted. **Requires SIM/eSIM.** |
| **5G — low band** | NR (New Radio) | ~100 Mbps | Sub-6 GHz | Wide coverage, modest speed |
| **5G — mid band** | NR | 100–1000 Mbps | 2.5, 3.5, 3.7–4 GHz | Balanced |
| **5G — mmWave (high)** | NR | **1–3 Gbps+** | **20–60 GHz** | Very short range (few hundred feet); **cannot penetrate walls/windows**; very dense antenna arrays |

**Cell range** — traditional cell towers serve up to **~5 miles (8 km)** in open areas. mmWave cells are **much smaller** (a few hundred feet / city-block scale) — part of why 5G mmWave rollout requires dense small-cell installations.

**mMIMO (massive MIMO)** — 5G uses huge antenna arrays (64+ elements) to **beamform** signals directly at specific devices. Improves spectral efficiency and range in crowded cells.

**Router types** (recap):
| Type | Where used | Typical interfaces |
|------|-----------|---------------------|
| **SOHO router** | Home/small office | Ethernet LAN + modem WAN (DSL/cable/fiber) built-in |
| **LAN router** | Enterprise — between subnets | All-Ethernet, routes between VLANs and subnets |
| **WAN / border router** | Enterprise edge | Ethernet LAN + WAN interface (fiber, T1, cellular) |
| **Core router** | ISP backbone | Very high capacity, many high-speed interfaces |

**Firewall types:**
• **Network firewall** — ACL-based filtering on a dedicated appliance or router.
• **UTM (Unified Threat Management)** — combines firewall + IDS/IPS + antivirus + content filter + VPN + spam filter in one appliance.
• **NGFW (Next-Generation Firewall)** — deep-packet inspection, application-layer awareness, user-ID integration.
• **Host-based / personal / software firewall** — installed on one computer (Windows Defender Firewall, macOS firewall, iptables/ufw). Complements network firewalls.

**Firewall ACL basics** — each rule matches:
• Source IP/network
• Destination IP/network
• Protocol (TCP/UDP/ICMP)
• Source port (often "any")
• Destination port
• Action: **allow** or **deny** (or sometimes "log")
Rules are evaluated **top-down, first match wins**, with an **implicit deny all** at the end on most firewalls.` }
      ]},
      { title: "2.8 — Networking Tools", sections: [
        { heading: "Physical & Diagnostic Tools", content: `| Tool | Purpose |
|------|---------|
| **Crimper** | Attaches RJ-45 connectors to Ethernet cable ends |
| **Cable stripper** | Removes outer jacket without damaging inner wires |
| **Wi-Fi analyzer** | Shows SSIDs, signal strength, channel usage. Finds interference |
| **Toner probe (fox and hound)** | Traces cables through walls/ceilings. Generator on one end, probe detects tone |
| **Punchdown tool** | Pushes wires into punchdown blocks (patch panels, wall jacks). 110 block most common |
| **Cable tester** | Verifies continuity, correct pin wiring, identifies opens/shorts |
| **Loopback plug** | Sends signal out and back on same port. Tests NIC/port functionality |
| **Network tap** | Passively copies traffic for monitoring. Does not disrupt flow |

**Command-line tools:**
• **ipconfig** /all, /release, /renew, /flushdns — check/change local network config
• **ping** — test reachability (ICMP echo). ping 127.0.0.1 = test local stack
• **tracert / traceroute** — show each hop to destination
• **nslookup / dig** — test DNS resolution
• **netstat** (-a all, -n numerical, -b process) — show connections/ports
• **arp -a** — show IP → MAC address mappings on local network
• **pathping** — combines ping + tracert, shows packet loss per hop` },
        { heading: "Cat Standards, T568A/B, Installation Tools, OSP (Lesson 5C)", content: `**UTP physics recap:**
• **4 twisted pairs** of copper, each pair twisted at a **different rate** — reduces crosstalk.
• **Balanced signaling**: each wire carries an equal but opposite signal to its pair — helps distinguish signal from noise.
• **Attenuation** — signal loss over distance. UTP max recommended = **100 m (328 ft)** for all Cat standards.

**TIA/EIA-568-C Commercial Building Telecommunications Cabling Standards** — defines Cat cable specifications and structured cabling.

**Complete Cat table (what each supports):**

| Cat | Max transfer | Max distance | Ethernet standard |
|-----|--------------|--------------|-------------------|
| **Cat 5** (obsolete) | **100 Mbps** | 100 m | 100BASE-TX (Fast Ethernet) |
| **Cat 5e** | **1 Gbps** | 100 m | 1000BASE-T (Gigabit) |
| **Cat 6** | **1 Gbps** | 100 m | 1000BASE-T |
| **Cat 6** (10G mode) | **10 Gbps** | **55 m** | 10GBASE-T (reduced distance) |
| **Cat 6A** | **10 Gbps** | 100 m | 10GBASE-T (full distance) |
| **Cat 7** | **10 Gbps** | 100 m | 10GBASE-T |
| **Cat 7** (max) | **100 Gbps** | **15 m** | 100GBASE-T |
| **Cat 8** | **25 Gbps** | **30 m** | 25GBASE-T |
| **Cat 8** (max) | **40 Gbps** | **30 m** | 40GBASE-T |

**TIA/EIA-568 Cat 6A** is recommended for **healthcare, PoE 802.3bt installations, and feeds to wireless APs**.

**Cat 7 uses a special GG45 connector** — **not compatible with RJ45 ports** without an adapter. **Cat 8 can use GG45 OR RJ45**. Cat 7 and 8 are primarily used in data centers with short high-bandwidth runs.

**Cat 6+ internal construction** — includes a plastic **star / X-shaped separator (spline)** running through the cable to keep the pairs apart and reduce crosstalk. Must be trimmed with snips before termination.

**RJ45 connector detail:**
• Also called **8P8C (8 position, 8 contact)**.
• **4 wire pairs, 8 conductors total.**
• Each pair has a color:
  — **White/Blue + Blue** (Pair 1)
  — **White/Orange + Orange** (Pair 2)
  — **White/Green + Green** (Pair 3)
  — **White/Brown + Brown** (Pair 4)

**T568A vs. T568B — memorize the pin order:**

| Pin | **T568A** | **T568B** |
|-----|-----------|-----------|
| 1 | White/**Green** | White/**Orange** |
| 2 | **Green** | **Orange** |
| 3 | White/**Orange** | White/**Green** |
| 4 | Blue | Blue |
| 5 | White/Blue | White/Blue |
| 6 | **Orange** | **Green** |
| 7 | White/Brown | White/Brown |
| 8 | Brown | Brown |

The **difference: the Green and Orange pairs are swapped** between pins 1,2 and 3,6.

**Cable types by wiring:**
• **Straight-through** — same termination (T568A or T568B) on both ends. Used for PC→switch, switch→router. **99% of modern cabling.**
• **Crossover** — T568A on one end, T568B on the other. Historically used for PC→PC or switch→switch directly. Obsolete — modern switches have **Auto-MDI-X** that auto-detects and adjusts internally.

**Channel link specs:**
• **Full channel link = 100 m maximum** (wall port to switch, including patch cords).
• Of that, **each patch cord (at either end) can be up to 5 m long**.
• **Permanent cable** (wall-to-patch-panel) = **solid core, thicker wire** — holds shape, for in-wall runs.
• **Patch cable** = **stranded, thinner wire** — flexible, more attenuation, shouldn't be used in walls.

**Copper cable installation tools (know each — testable):**

| Tool | What it does |
|------|--------------|
| **Cable stripper** | Scores the outer jacket to remove it without damaging inner wire insulation. Rotate around cable once or twice. |
| **Electrician's scissors / snips** | Cuts the inner plastic **spline** in Cat 6+, trims the nylon **ripcord**, trims wire ends flush. |
| **Punchdown tool** | Drives each wire into IDC terminals on patch panels and wall jacks. Untwist **no more than ½" (13 mm)** of wire pair before punching — preserves noise rejection. |
| **Crimper** | Fixes an **RJ45 plug onto a patch cord**. Orient pin 1 on left with tab underneath. Squeeze firmly to pierce wire insulation and seal jacket. |
| **Cable tester** | Verifies each wire's continuity and correct pin placement. LEDs light in sequence; wrong sequence = miswired. |
| **Toner probe (tone generator + inductive probe)** | Traces cable through walls/ceilings. Generator applies tone to one end; probe detects it anywhere along the path. **Disconnect the other end from network equipment first** to avoid damaging ports. |
| **Loopback plug** | Short stub cable wired **pin 1↔pin 3, pin 2↔pin 6** — sends signal back on receive pair. Tests NIC or switch port functionality. Homemade plugs **don't work for Gigabit**; buy a manufactured Gigabit loopback tester. |

**Network TAP (Test Access Point)** — inserts between two network devices to copy traffic to a monitoring device:
| Type | How it works | Notes |
|------|--------------|-------|
| **Passive TAP** | Inductor or optical splitter physically copies signals | No logic; sees ALL frames including corrupt; unaffected by traffic load |
| **Active TAP** | Powered device that regenerates signals | Required for Gigabit copper, some fiber links. **Becomes a single point of failure if it loses power.** |
| **SPAN / Mirror Port** (alternative) | Managed switch feature that copies frames from one or more ports to a designated monitor port | No separate hardware needed; drops frames under heavy load |

**CMP vs CM/CMG — Fire code markings on cable jackets:**
| Marking | Meaning | Where it's used |
|---------|---------|------------------|
| **CM / CMG** | General purpose — PVC jacket | Standard office wiring; **NOT allowed in plenum spaces** |
| **CMR (Riser)** | Rated for vertical runs between floors | Vertical shafts, stairwells |
| **CMP (Plenum)** | Fire-retardant — low smoke, self-extinguishing. Treated PVC or **FEP (fluorinated ethylene polymer)** | **Required by building code in plenum spaces** (HVAC return-air spaces, false ceilings above offices) |

**Plenum space** — any void used for HVAC return airflow. Includes false ceilings above offices (very common in US office buildings). If regular PVC cable burns in a plenum space, toxic smoke is spread through the building's air circulation.

**Outside Plant (OSP) cable — types:**
| Type | Installation | Protection |
|------|--------------|-----------|
| **Aerial** | Strung between poles or anchors | UV-resistant jacket |
| **Conduit** | Buried inside a protective pipe | Still needs weather-resistant jacket |
| **Direct burial** | Laid into trench and covered with earth | **Gel-filled** (prevents moisture ingress), weather-rated, may be **armored** against rodent damage |

Regular PVC office cable **should not be used outdoors** — degrades rapidly under UV and temperature cycling.

**Fiber optic cable construction (inside out):**
1. **Core** (ultra-fine glass, 8–62.5 μm) — carries the light
2. **Cladding** (glass or plastic, reflects light back into core)
3. **Buffer** (protective coating, usually acrylate)
4. **Strength members** (Kevlar / aramid yarn) — resist pulling damage
5. **Outer jacket** (PVC, plenum, or OSP-rated)

**Fiber mode detail:**
| Type | Core | Wavelength | Light source | Distance |
|------|------|------------|--------------|----------|
| **Single-mode (SMF)** | 8–10 μm | **1310 or 1550 nm** (infrared) | High-power coherent **laser diode** | Many km, up to 100 km |
| **Multi-mode (MMF)** | 50 or 62.5 μm | **850 or 1300 nm** | **LEDs** or **VCSELs** (Vertical Cavity Surface Emitting Laser) | Tens to hundreds of meters |

**Fiber connectors — physical form factors:**
| Connector | Mechanism | Use |
|-----------|-----------|-----|
| **ST (Straight Tip)** | **Bayonet** twist-lock | Older multi-mode networks |
| **SC (Subscriber Connector)** | **Push-pull** (square profile) | Single or multi-mode; simplex or clipped-together duplex |
| **LC (Lucent Connector)** | Push-pull with **tabbed release** (small form factor) | Current dominant; **higher port density** than SC; single or multi-mode |

**Fiber handling:**
• Connectors are easily damaged; **don't repeatedly plug/unplug**.
• Put **dust caps** on unused ports and connector ends.
• **Never look directly into a fiber port** when it's connected — invisible IR laser can damage retina.

**Coaxial cable detail:**
• Core signal conductor + dielectric (plastic insulation) + **wire mesh shield/ground** + outer jacket
• Modern uses: **CCTV, CATV (Cable Access TV), cable modem broadband**
• Connector: **F-type** (screw-on) for CATV / cable modem; **BNC** (bayonet) for CCTV and legacy networks` }

**OLED** — self-emitting pixels, true blacks, burn-in risk.

      { title: "3.1 Deep Dive — CertMaster Additions", sections: [
        { heading: "Resolutions, Color Depth, HDR & Adaptive Sync", content: `**Common screen resolutions** (pixel count = width × height):

| Name | Pixels | Aspect | Use |
|------|--------|--------|-----|
| **720p / HD** | 1280×720 | 16:9 | Budget monitors, older HDTV |
| **1080p / Full HD (FHD)** | 1920×1080 | 16:9 | Mainstream |
| **1440p / QHD / 2K** | 2560×1440 | 16:9 | Prosumer monitors, gaming |
| **4K / UHD** | 3840×2160 | 16:9 | Modern TVs, high-end monitors |
| **5K** | **5120×2880** | 16:9 | Apple iMac 5K, pro workstations |
| **8K** | **7680×4320** | 16:9 | Emerging — 4× pixels of 4K |
| **Ultrawide** | 3440×1440, 3840×1600, 5120×1440 | 21:9 / 32:9 | Gaming, productivity |

**DCI-P3** is a wider color gamut than sRGB (used in digital cinema / pro displays). **Adobe RGB** is another wide-gamut standard favored by print work.

**Color depth (bit depth)** — how many bits per pixel describe color:
• **8-bit per channel (24-bit true color)** — 256 levels each of R/G/B = ~16.7 million colors. Standard.
• **10-bit per channel (30-bit / "deep color")** — 1,024 levels per channel = 1.07 billion colors. Required for HDR. Smoother gradients, no banding.
• **32-bit color** — 24-bit RGB + 8-bit **alpha** (transparency) channel. Used in software rendering; not a "more colors" upgrade.

**HDR (High Dynamic Range)** — expanded brightness and color range. Standards: **HDR10** (open, 10-bit), **Dolby Vision** (12-bit, licensed), **HDR10+** (dynamic metadata). Display must meet peak brightness / contrast requirements (e.g., HDR400, HDR1000) to be certified.

**Adaptive sync (variable refresh rate)** — matches monitor refresh rate to GPU frame rate in real time to eliminate **screen tearing** (top of frame shows one image while bottom shows another, creating a horizontal split):
• **AMD FreeSync** — open standard, based on VESA's Adaptive-Sync, works over DisplayPort and HDMI
• **NVIDIA G-Sync** — proprietary (requires G-Sync hardware module) or **G-Sync Compatible** (software implementation on FreeSync displays that NVIDIA has tested)
• Both cure **tearing** and **stuttering** when frame rate varies.

**Other video artifacts** (troubleshooting cues):
• **Tearing** → enable adaptive sync or V-Sync
• **Ghosting** → response time too slow for refresh rate; reduce overdrive setting or accept a faster-response panel
• **Input lag** → display processing delay; look for "Game Mode" to bypass image processing
• **Stuck / dead pixel** → pixel stuck ON (bright) or OFF (dark). Not user-fixable.

**Touchscreen types** (revisit with depth):
• **Capacitive** — senses electrical charge from your finger. Supports multi-touch and light pressure. Does NOT work with gloved fingers or most styluses unless capacitive-tipped.
• **Resistive** — two conductive layers pressed together by pressure. Works with any object (fingernail, stylus, gloved hand) but lower clarity and usually single-touch. Common in industrial/medical and older POS systems.
• **Infrared / Optical** — IR grid or cameras detect object interrupting the grid. Used on large interactive displays, ATMs.` }

      { title: "3.2 — Cables & Connectors", sections: [
        { heading: "Network Cables", content: `All copper Ethernet: **100 meter** max run.

| Cable | Speed | Distance | Notes |
|-------|-------|----------|-------|
| **Cat 5e** | 1 Gbps | 100m | Minimum for gigabit |
| **Cat 6** | 10 Gbps (55m) / 1 Gbps (100m) | 55–100m | Stricter crosstalk |
| **Cat 6a** | 10 Gbps | 100m | Augmented, shielded |

⚠️ Cat 7 / Cat 8 are **NOT on the A+ exam** — Network+ territory.

| **Coaxial (RG-6)** | Varies | Varies | Cable modem, TV. **F-type** connector |
| **Fiber (single-mode)** | 10+ Gbps | Up to **100 km** | Yellow jacket. Laser. Long distance |
| **Fiber (multi-mode)** | 10 Gbps | Up to 2 km (OM4) | Orange/aqua. LED. Shorter runs |

**Copper types:** UTP (unshielded, most common, EMI susceptible), STP (shielded, EMI protection), **Direct burial** (STP variant — gel-filled, UV/moisture resistant jacket; rated for underground outdoor runs without conduit), Plenum-rated (fire-resistant for air handling spaces — required by building code).

**Fiber connectors:** LC (small, most common, push-pull), SC (square, push-pull), ST (round, bayonet twist-lock, legacy).

**Wiring:** T568B most common in US. T568A required for US government. Straight-through = same both ends (unlike devices: PC→switch). Crossover = A on one, B on other (like devices: PC→PC). **Auto-MDI/X** makes crossover mostly obsolete, but exam still tests the concept.` },
        { heading: "Peripheral, Video & Drive Cables", content: `**USB:**
| Version | Speed | Color |
|---------|-------|-------|
| USB 2.0 | 480 Mbps | Black |
| USB 3.0 | 5 Gbps | Blue (SuperSpeed) |
| USB 3.1 | 10 Gbps | Teal |
| USB-C | Varies (up to USB4 40 Gbps) | Reversible connector |
| Thunderbolt 3/4 | 40 Gbps | USB-C with lightning bolt |

• **Micro-USB** — older Android. **Mini-USB** — legacy cameras/GPS.
• **Lightning** — Apple proprietary (pre-iPhone 15).
• **Serial (DB-9)** — 9-pin legacy. Managed switch/router console port.

**Video cables:**
• **HDMI** — digital, audio + video. Types: Standard, Mini, Micro
• **DisplayPort** — digital, higher bandwidth, supports daisy-chaining. Mini-DP exists
• **USB-C** [NEW] — carries DisplayPort/HDMI via Alt Mode. Video + data + power in one cable
• **DVI-D** — digital only. Single-link (1920×1200), dual-link (2560×1600)
• **DVI-I** — digital + analog. Can use passive adapter to VGA
• **DVI-A** — analog only. Rare.
• **VGA (DB-15)** — analog, blue connector, 15 pins. Legacy.

**Drive cables:** SATA data (thin, L-shaped, 6 Gbps), SATA power (15-pin from PSU), eSATA (external SATA), Molex (4-pin legacy power).

**Connector types (exam brain-dump):**
• **RJ11** — 6-position, 4-wire. Telephone / DSL / dial-up modem lines (NOT Ethernet)
• **RJ45** — 8-position, 8-wire. Ethernet (Cat 5e/6/6a)
• **F-type** — screw-on coax for cable modems, TV
• **ST** (Straight Tip) — bayonet twist-lock fiber, legacy
• **SC** (Subscriber Connector) — push-pull square fiber
• **LC** (Lucent Connector) — small push-pull fiber, most common today
• **Punchdown block (110 / 66)** — not a cable-end connector; a termination block where individual wires are pushed into metal teeth using a punchdown tool. Found in patch panels and wall jacks. (The tool is separate; the block itself is the "connector type" CompTIA lists.)
• **DB9** — 9-pin serial (console cables to routers/switches)
• **MicroUSB / MiniUSB / USB-C / Lightning / Molex** — see peripheral/video sections above

**Legacy / near-obsolete connectors (rarely tested but know they exist):**
• **DB25** — 25-pin D-sub. Historically used for **parallel printer ports (LPT1)** on the PC side, and for serial RS-232 on some equipment. Replaced by USB.
• **LPT (Line Print Terminal) / Parallel port / IEEE 1284** — older printer interface using a 25-pin DB25 on the PC and a 36-pin Centronics on the printer. Obsolete since ~2005.
• **PS/2 (mini-DIN 6-pin)** — keyboard (purple) / mouse (green) before USB. Still found on server motherboards for failsafe input.
• **BNC (Bayonet Neill-Concelman)** — coax bayonet twist-lock. Legacy **10BASE2 "Thinnet"** Ethernet, modern uses: CCTV cameras, oscilloscopes, lab/broadcast video (SDI).
• **RG-58 coax** — 50 Ω, used with BNC for Thinnet; **RG-59** 75 Ω for analog CCTV; **RG-6** 75 Ω for CATV/cable modem.
• **AUI (DB15)** — very old Ethernet transceiver attachment. Museum piece.` }

      { title: "3.2 Deep Dive — CertMaster Additions", sections: [
        { heading: "Fiber, Coax & Shielded-Twisted-Pair Detail", content: `**Fiber optic cable types** (know the color coding — CompTIA loves this):

| Type | Core | Light source | Distance | Typical jacket color |
|------|------|--------------|----------|----------------------|
| **Single-mode (SMF) / OS1, OS2** | 8–9 μm | **Laser** | Up to ~100 km | **Yellow** |
| **Multi-mode (MMF) — OM1** | 62.5 μm | LED | ~275 m @ 1 Gbps | **Orange** |
| **Multi-mode — OM2** | 50 μm | LED | ~550 m @ 1 Gbps | **Orange** |
| **Multi-mode — OM3** | 50 μm | **VCSEL laser** | ~300 m @ 10 Gbps | **Aqua** |
| **Multi-mode — OM4** | 50 μm | VCSEL | ~400 m @ 10 Gbps, ~150 m @ 40/100 Gbps | **Aqua** |
| **Multi-mode — OM5** | 50 μm | VCSEL / SWDM | Similar to OM4, optimized for wavelength division | **Lime green** |

**Single-mode** — one path (mode) of light. Long runs between buildings, ISP backbone, FTTH.
**Multi-mode** — many light paths bouncing inside the larger core. Cheaper optics; dispersion limits distance. Common in data centers / inside a building.

**Fiber connector physics:**
• **APC (Angled Physical Contact)** — green, ferrule polished at 8° angle. Lowest back-reflection. Required by most FTTH/PON.
• **UPC (Ultra Physical Contact)** — blue, flat polish. Standard for Ethernet.
• **NEVER mate APC and UPC** — you'll damage both.

**Coaxial cable types:**
| Type | Impedance | Use | Connector |
|------|-----------|-----|-----------|
| **RG-6** | 75 Ω | Modern TV, cable modem, satellite | **F-type** (screw-on) |
| **RG-59** | 75 Ω | Legacy CCTV, short runs | F-type or BNC |
| **RG-58** | 50 Ω | Legacy 10BASE2 "Thinnet" Ethernet | **BNC** |

**BNC (Bayonet Neill-Concelman)** — bayonet-style twist-lock coax connector. Obsolete for Ethernet but still found on professional video/CCTV, oscilloscopes, lab equipment.

**Twisted-pair shielding naming** (CompTIA uses ISO/IEC notation):
| Notation | Means | Example |
|----------|-------|---------|
| **U/UTP** | Unshielded / Unshielded Twisted Pair | Standard Cat 5e/6 |
| **F/UTP** | Foil (overall) / Unshielded pairs | Cat 6a, mildly noisy environments |
| **U/FTP** | Unshielded overall / Foil around each pair | Cat 7, Cat 8 |
| **S/FTP** | Braided screen overall / Foil each pair | Max shielding, industrial |
| **SF/UTP** | Screen + Foil overall / Unshielded pairs | Heavy RFI areas |

**Installation jacket ratings:**
• **PVC (Riser / CMR)** — standard plastic jacket. For vertical runs between floors (**riser** space).
• **Plenum (CMP)** — low-smoke fire-retardant jacket. **Required by fire code in plenum spaces** (drop ceilings used for return airflow, HVAC chases). When PVC burns it releases toxic smoke through the ventilation system; plenum doesn't.
• **Direct burial** — gel-filled, UV/moisture-resistant for underground runs without conduit.

**Fiber advantages over copper** (why run fiber):
• **Immune to EMI/RFI** — run next to motors, fluorescent lights, power cables with no interference
• **No electrical conduction** — safer between buildings (lightning, ground loops)
• **Much longer distances** — kilometers vs 100m for copper
• **Higher bandwidth** — scales past 400 Gbps per strand` },
        { heading: "USB, Thunderbolt, SATA & Molex — Full Detail", content: `**Binary data units — bits vs bytes:**
• **lowercase b = bit**, **uppercase B = byte**, **1 byte = 8 bits**
• **Transfer rates**: Kb/s vs KB/s, Mb/s vs MB/s, Gb/s vs GB/s
• Example: a "100 Mbps" internet connection = 100 **megabits** per second ≈ 12.5 **megabytes** per second (divide by 8).
• Storage is measured in **bytes (B)**, network speed in **bits (b)**. Advertisers love this confusion.

**USB host controller limits:**
• A single USB host controller can theoretically support **up to 127 devices** on one bus (chained via hubs).
• Most motherboards have **multiple host controllers** (3–4 ports each) to overcome per-bus bandwidth sharing.

**USB device classes** — the host recognizes devices by class without needing a specific driver:
• **HID (Human Interface Device)** — keyboards, mice, joysticks
• **Mass Storage** — disk drives, flash drives
• **Printer class** — MFDs, printers
• **Audio class** — headsets, microphones, speakers
• **Video class (UVC)** — webcams, capture devices

**USB connector form factors** (know these by physical description):

| Connector | Shape | Used on |
|-----------|-------|---------|
| **Type A** | Flat rectangular | Host side — PC, hub, power brick. Insert with USB symbol facing up. |
| **Type B** | Square with beveled top | Large peripherals (printers, external enclosures, some audio gear) |
| **Type B Mini** | Small trapezoidal | Early digital cameras, some legacy peripherals |
| **Type B Micro** | Flatter, elongated trapezoidal | Older Android phones, tablets, many peripherals 2010–2020 |
| **USB-C** | Oval, **reversible** (no up/down) | Modern everything — phones, laptops, docks |

**USB cable length maximums:**
• **LowSpeed** devices (1.5 Mbps — keyboards, mice): **3 meters**
• **FullSpeed (12 Mbps) and HighSpeed (480 Mbps)** devices: **5 meters**
• **SuperSpeed** (USB 3.x): officially **3 meters recommended**; no hard spec max. Signal degrades past this.
• Beyond spec, use a **powered repeater/extender**.

**USB 3 vs USB 2 physical compatibility:**
• **Type A — fully backward compatible.** USB 2 Type A plug fits USB 3 Type A port and vice versa. USB 3 adds pins in the back of the connector; USB 2 plug simply doesn't use them.
• **Type B and Type B Micro — NOT fully compatible.** USB 3 connectors have an extra section. You can plug a USB 2 Type B cable into a USB 3 Type B port, but **NOT** a USB 3 Type B cable into a USB 2 Type B port (won't fit).
• **Blue tab / blue plastic inside a USB Type A port** = USB 3.x SuperSpeed. Teal = USB 3.1 Gen 2. Red = always-on charging port.

**USB Power Delivery (PD):**
• **Basic USB-A/C ports** can supply up to ~**4.5 W** (2.5W at USB 2.0, 4.5W at USB 3.0).
• **USB PD over USB-C** negotiates higher power: **up to 100 W** (20V @ 5A) on PD 3.0.
• **USB PD 3.1** extends to **240 W** (48V @ 5A) — used for high-draw laptops and monitors.
• Power delivery requires **both ends (cable and device) to support PD**, and **E-marker chip** cables for >60 W.

**Thunderbolt generations** (summary table):

| Version | Connector | Max speed | Cable length (full speed) | Notes |
|---------|-----------|-----------|----------------------------|-------|
| **TB 1** | Mini DisplayPort | 10 Gbps | 3 m | First-gen, 2011 |
| **TB 2** | Mini DisplayPort | **20 Gbps** | 3 m | **Daisy-chain up to 6 devices** |
| **TB 3** | USB-C | **40 Gbps** | **0.5 m passive for 40 Gbps**, 2 m at 20 Gbps, optical up to 60 m | First to use USB-C form |
| **TB 4** | USB-C | 40 Gbps | 2 m passive at 40 Gbps | **Mandates** certain minimums (dual 4K display, 32 Gbps PCIe, wake from sleep) |
| **TB 5** | USB-C | **80 Gbps** (bi-directional) / **120 Gbps** (asymmetric) | TBD | Newest. Huge speed jump. |

**Thunderbolt identification**:
• Look for the **lightning bolt icon** next to the port or on the cable connector.
• **Not all USB-C ports are Thunderbolt!** A USB-C port without the lightning bolt icon is USB-only. Check the system documentation.
• **Thunderbolt ports accept USB devices** (backward-compatible at USB speeds). USB-C-only ports do NOT accept Thunderbolt devices at Thunderbolt speeds — they may not even enumerate the device.

**SATA detail:**
• Internal **SATA data** cable: **up to 1 meter**, thin L-shaped **7-pin** connector. Carries data only.
• Separate **SATA power** connector: **15-pin**, larger, from PSU. +3.3V (orange wire, rarely used), +5V, +12V, grounds.
• Each SATA port = one device (no daisy-chaining like old PATA/IDE).

**SATA generation speeds:**
| Gen | Common name | Max throughput |
|-----|-------------|---------------|
| SATA I (1.5 Gb/s) | SATA 1.0 | **150 MB/s** |
| SATA II (3 Gb/s) | SATA 2.0 | **300 MB/s** |
| **SATA III (6 Gb/s)** | SATA 3.0 | **600 MB/s** (practical ceiling for 2.5" SATA SSDs) |
| SATA 3.1–3.5 | Refinements only (USM, SATA Express, etc.) — **no speed increase** |

**eSATA (external SATA):**
• Cable up to **2 meters** (78 in.).
• Requires a dedicated eSATA cable — internal SATA cables will NOT work (different shielding).
• **eSATAp (powered eSATA)** — nonstandard combo port that delivers both SATA data AND power over a combined connector. Some older laptops have this.
• Largely **superseded by USB 3** for external drives. Still found in legacy enterprise contexts.

**Molex 4-pin power connector** (legacy drive power):
• White or clear plastic, trapezoidal profile.
• **Wire colors (memorize):** 
  — **Red = +5V DC**
  — **Yellow = +12V DC**
  — **Black = ground** (two black wires, between red and yellow)
• Used for legacy HDDs/optical drives, some case fans, fan controllers, older PCIe molex-to-6pin adapters.
• Older devices may have **both** Molex and SATA power connectors; use only one — never both at once.` }
      ]},
      { title: "3.3 — RAM Characteristics", sections: [
        { heading: "DDR Generations, ECC & Channels", content: `**Form factors:** DIMM (desktop, ~133mm), SO-DIMM (laptop, ~67mm).

| Gen | Speed Range | Voltage | DIMM Pins | SO-DIMM Pins | Key Feature |
|-----|-------------|---------|-----------|-------------|-------------|
| DDR3 | 800–2133 MT/s | 1.5V | 240 | 204 | Legacy |
| DDR4 | 2133–3200 MT/s | 1.2V | 288 | 260 | Current mainstream |
| DDR5 | 4800–6400+ MT/s | 1.1V | 288 | 262 | On-module PMIC, doubled bandwidth |

⚠️ DDR generations are **NOT interchangeable** — different notch positions prevent incorrect installation.

**DDR5 key difference:** Voltage regulation moved **onto the RAM module** (PMIC — Power Management IC). DDR4 relies on the motherboard.

**ECC (Error-Correcting Code)** — detects and corrects single-bit errors. Servers/workstations. Requires compatible motherboard and CPU.

**Channel configs:** Single (1 stick), Dual (2 matched sticks = doubled bandwidth), Triple/Quad (server/HEDT). For dual channel, use same speed, size, ideally same manufacturer in correct color-coded slots.` }
      ]},
      { title: "3.3 Deep Dive — CertMaster Additions", sections: [
        { heading: "Virtual Memory, CAS Latency & Multi-Channel Detail", content: `**System RAM vs. Virtual Memory:**
• **RAM** is physical — volatile (loses contents on power-off), fast (~10s of GB/s), measured in GB.
• **Virtual memory / paging** — a portion of disk (HDD/SSD) used as "overflow RAM" when physical RAM is exhausted. Much slower than RAM (even with NVMe).
  — **Windows**: \`pagefile.sys\` in the root of C: by default. Configurable in System Properties → Advanced → Performance → Virtual Memory.
  — **macOS / Linux**: swap partition or swap file.
• When the system "thrashes" (constantly swapping between RAM and page file), you see sluggish performance and constant disk activity. **Fix: add RAM** (not bigger page file).
• **Address space** — amount of memory the CPU can address. 32-bit OS maxes out at **4 GB** (usually ~3.5 GB usable); 64-bit OS addresses vastly more (TBs).

**CAS Latency (CL / timings):**
• The delay, in clock cycles, between the memory controller requesting data and it being available.
• Shown on module labels as **CL16**, **CL36**, etc. **Lower is better** at the same speed.
• Real latency (ns) = (CL × 2000) ÷ speed in MT/s. So a DDR4-3200 CL16 module has ~10 ns actual latency; DDR5-6000 CL36 has ~12 ns. Modern DDR has higher raw CL numbers but similar wall-clock latency.
• Other timings on the label: tRCD, tRP, tRAS. **XMP (Intel eXtreme Memory Profile) / EXPO (AMD)** profiles let you load advertised timings in BIOS — without XMP enabled, your "3200 MHz CL16" kit runs at JEDEC default like 2133 MHz.

**Multi-channel configuration** — doubles (or more) memory bandwidth by accessing modules in parallel:

| Channels | Modules needed | Bandwidth multiplier |
|----------|----------------|----------------------|
| **Single** | 1 | 1× |
| **Dual** | **2 matched**, in correct slots (usually A2 + B2) | **2×** |
| **Triple** | 3 matched (older Intel HEDT like X58) | 3× |
| **Quad** | 4 matched (HEDT / workstation / server) | 4× |

• Consumer CPUs (Intel Core, AMD Ryzen) are **dual-channel**.
• Workstation/server CPUs (Xeon W, Threadripper, EPYC) support **quad / 8 / 12 channels**.
• Matched = same size, speed, and ideally same kit (purchased together). Mismatched → runs at lowest common denominator.

**Flex Mode** (Intel term) — if you install two unequal modules in a dual-channel system (say 8 GB + 16 GB), 16 GB runs in dual channel (8+8) and the remaining 8 GB runs single channel. Better than nothing, but dual-channel matched is ideal.

**Parity vs. ECC**:
• **Parity** — adds 1 bit per byte to detect a single-bit error (can't correct it). Rare today.
• **ECC (Error-Correcting Code)** — adds extra bits to **detect AND correct** single-bit errors and detect multi-bit errors. Uses 9 chips per rank instead of 8. Essential for servers, scientific computing. Requires ECC-capable CPU/motherboard. Unbuffered ECC (UDIMM) for workstations, Registered ECC (RDIMM) for high-density servers.` },
        { heading: "DRAM Fundamentals, DDR Evolution, ECC Bus Width, Flex Mode", content: `**Address space & data width:**
• Memory bus has TWO pathways:
  — **Data pathway** — how much data per clock cycle. Standard **64-bit** for a single channel.
  — **Address pathway** — how many memory locations the CPU can track.
• **32-bit CPU + 32-bit address bus** = **4 GB** max addressable memory (2³² bytes).
• **64-bit CPU** = theoretically **16 exabytes** (2⁶⁴), but most use a **48-bit address bus** = **256 TB** max.
• **Dual-channel** doubles data pathway to 128 bits effective; quad-channel to 256 bits.

**DRAM technology progression:**
| Tech | What it does |
|------|--------------|
| **DRAM** | Each cell = 1 **transistor + 1 capacitor**. Charged capacitor = 1, uncharged = 0. Needs constant refresh to hold state. |
| **SDRAM** | DRAM **synchronized to the system clock** — predictable timing for bursts. |
| **DDR SDRAM** | **Double Data Rate** — transmits on both the **rising AND falling edges** of the clock. Doubles throughput without raising the clock. |

**DDR generations — complete table including older:**
| RAM Type | Data rate (MT/s) | Transfer rate | Max module size |
|----------|------------------|---------------|-----------------|
| DDR1 | 200–400 | 1.6–3.2 GB/s | **1 GB** |
| DDR2 | 400–1066 | 3.2–8.5 GB/s | **4 GB** |
| DDR3 | 800–2133 | 6.4–17 GB/s | **16 GB** |
| **DDR4** | 1600–3200 | 12.8–25.6 GB/s | **32 GB** (64 GB available) |
| **DDR5** | 4800–8000+ | 38.4–51.2+ GB/s | **128 GB+** |

"MT/s" = **mega-transfers per second**. Each transfer = 8 bytes (on a 64-bit bus), so 3200 MT/s × 8 = **25.6 GB/s** per channel.

**Module naming scheme**:
• **Chip labeling** (older): DDR-200 means 200 MT/s.
• **Module labeling**: PC-1600 = peak bandwidth 1600 MB/s for that PC module.
• Newer: PC3-12800 means DDR3 with 12,800 MB/s bandwidth (= DDR3-1600).

**CAS latency notation in RAM specs:**
• Written as **14-15-15-35 CAS 14** or **CL16-18-18-38**.
• Four numbers = **CL — tRCD — tRP — tRAS**:
  — **CL (CAS latency)** — cycles from read command to data available
  — **tRCD (RAS-to-CAS delay)** — cycles to open a row before reading a column
  — **tRP (Row precharge)** — cycles to close a row before opening another
  — **tRAS (Row active time)** — minimum cycles a row must stay active
• Lower = faster. Always compare modules of the same type/speed.

**DDR5 architectural change:**
• Each DIMM has **two independent 32-bit subchannels** instead of one 64-bit channel.
• In a dual-channel memory controller with 2× DDR5 DIMMs, the system sees **FOUR 32-bit channels** — better at serving many small requests simultaneously (ideal for multicore workloads).
• **On-DIMM PMIC** (Power Management IC) — DDR5 modules regulate their own voltage; DDR4 relied on the motherboard.
• **On-die ECC** — DDR5 modules detect/correct single-bit errors internally. **This is separate from traditional "ECC RAM"** — DDR5 still comes in both ECC and non-ECC variants. On-die ECC protects the module internally; full ECC also covers the memory controller link.

**SODIMM specifics**:
• Half the length of full DIMM.
• Typical capacities **4–32 GB per module** in laptops.
• Installed at a **~45° angle**, then pressed flat until clips lock.
• Removed by pushing the two side clips outward — module pops up at 45°.

**DDR generations are physically keyed differently** — you cannot install DDR4 in a DDR5 slot or vice versa. The notch position prevents incorrect insertion.

**Mismatched memory outcomes** (when you pair non-identical sticks):
| Scenario | Behavior |
|----------|----------|
| Different **speeds** | Runs at the slowest stick's speed |
| Different **sizes** | Flex mode OR single channel |
| Different **timings / CAS** | Runs at the loosest (highest / worst) timings |
| **Odd number** (e.g., 3 sticks in dual-channel board) | Often: two matched sticks run dual channel, third runs single channel |
| **Mixing DIMM types** (ECC + non-ECC UDIMM) | Usually won't boot |
| **Mixing UDIMM and RDIMM** | Won't boot — physically fit but electrically incompatible |

**Flex mode example** (revisited with numbers):
• Slot A1: 2 GB, Slot B1: 6 GB
• Result: **4 GB runs in dual channel** (2 from A + 2 from B), remaining **4 GB of B1 runs in single channel**.
• All 8 GB is usable; not all 8 GB is at dual-channel speed.

**ECC bus width**:
• Standard RAM data bus: **64 bits**
• ECC RAM data bus: **72 bits** (64 data + 8 ECC check bits per transfer)
• Memory controller compares computed checksum to the stored one; corrects single-bit mismatches, halts system on detected multi-bit errors.

**ECC variants**:
• **RDIMM (Registered DIMM)** — has a register chip buffering address/command lines. Reduces electrical load → allows many more modules per channel (servers with 8–32 DIMM slots). Slight latency penalty (~1 cycle).
• **LRDIMM (Load-Reduced DIMM)** — even more buffering than RDIMM. Enables the largest memory configurations. Found in enterprise servers.
• **UDIMM (Unbuffered DIMM)** — no register. What desktop/consumer RAM is. Some workstation boards support ECC UDIMM.

**Compatibility rules** (common exam pitfall):
• Motherboard + CPU **must both** support ECC for ECC correction to activate. Installing ECC RAM in a non-ECC board → runs as normal non-ECC (no correction).
• Most boards support **either RDIMM or UDIMM exclusively** — check the manual.
• **Don't mix** ECC and non-ECC; don't mix RDIMM and UDIMM.

**Virtual memory (recap with detail)**:
• Disk-based extension of RAM — Windows \`pagefile.sys\`, macOS/Linux swap.
• Slow compared to RAM. Constant paging = **thrashing** = lots of disk activity + poor performance.
• Solution when thrashing occurs: **install more physical RAM** (increasing the page file rarely helps).
• On a laptop SSD: **hibernation** file (\`hiberfil.sys\`) saves RAM contents to disk for power-off state preservation. Equal in size to RAM by default.` }
      ]},
      { title: "3.4 — Storage Devices", sections: [
        { heading: "HDD, SSD, M.2 & Interfaces", content: `**HDD:** Spinning magnetic platters. 5400 RPM (laptop), 7200 RPM (desktop), 10K/15K RPM (enterprise). 3.5" (desktop), 2.5" (laptop). Cheap per GB, slow, fragile.

**SSD:** Flash memory (NAND). No moving parts. Faster, quieter, more durable, more expensive.

| Interface | Connection | Speed | Notes |
|-----------|-----------|-------|-------|
| **SATA** | SATA III | 600 MB/s max | Same connector as HDD. 2.5" form factor |
| **NVMe (M.2)** | PCIe bus | 3,500+ MB/s (Gen 3), 7,000+ (Gen 4) | Gum-stick on motherboard |
| **PCIe card** | PCIe slot | Varies | Full-size expansion card |
| **SAS** [NEW] | SAS connector | Up to 24 Gbps (SAS-4) | Enterprise. Dual-port, hot-swappable |
| **mSATA** | Mini-SATA | 600 MB/s | Older, smaller than M.2. Phasing out |

**M.2 key types:** B key (SATA/PCIe x2, notch left), M key (PCIe x4/NVMe, notch right), B+M (both slots, SATA speed).

**Removable:** USB flash drives, SD/microSD cards, external drives.
**Optical:** CD (700 MB), DVD (4.7 GB / 8.5 GB dual), Blu-ray (25 GB / 50 GB dual).` },
        { heading: "RAID Levels", content: `| Level | Min Drives | Technique | Fault Tolerance | Usable Capacity |
|-------|-----------|-----------|-----------------|-----------------|
| **RAID 0** | 2 | Striping | **None** — one fail = all lost | 100% |
| **RAID 1** | 2 | Mirroring | 1 drive | 50% |
| **RAID 5** | 3 | Stripe + parity | 1 drive | (n-1) drives |
| **RAID 6** [NEW] | 4 | Stripe + **double** parity | **2 drives** | (n-2) drives |
| **RAID 10** | 4 | Mirror + stripe | 1 per mirror pair | 50% |

RAID 6 is NEW for 1201. Write performance slower than RAID 5 due to double parity.` }
      ]},
      { title: "3.4 Deep Dive — CertMaster Additions", sections: [
        { heading: "HDD Internals, NAND Types, Hot Spare & Optical", content: `**HDD mechanical parts** — know these (pictured in the CertMaster material):
• **Platter** — spinning disk coated with magnetic material; data is stored as magnetized regions. Stacked multiple platters per drive.
• **Spindle / motor** — spins the platters at the rated RPM (5400 / 7200 / 10K / 15K).
• **Read/write heads** — one per platter side, float on a cushion of air nanometers above the surface. A "head crash" = head physically contacts the platter → permanent damage.
• **Actuator arm** — positions the heads over the correct track. Driven by a voice-coil motor.
• **Controller board (PCB)** — on the bottom of the drive, interfaces to SATA/SAS and runs firmware.

Because HDDs have moving parts, they are **vibration- and shock-sensitive**. Handle gently, never move a powered-on HDD.

**NAND flash cell types** (tradeoff: density vs. endurance/speed):

| Type | Bits per cell | Endurance (P/E cycles) | Use |
|------|---------------|-----------------------|-----|
| **SLC (Single-Level Cell)** | 1 | ~100,000 | Enterprise, extreme endurance (rare today) |
| **MLC (Multi-Level Cell)** | 2 | ~10,000 | Older prosumer SSDs |
| **TLC (Triple-Level Cell)** | 3 | ~3,000 | **Mainstream consumer today** |
| **QLC (Quad-Level Cell)** | 4 | ~1,000 | High-capacity bulk storage; slower writes |

SSD endurance is specified as **TBW (Terabytes Written)** or **DWPD (Drive Writes Per Day)**. Modern consumer TLC SSDs are rated hundreds of TBW — far more than most users will ever write.

**SSD interfaces recap with speeds:**
| Interface | Max theoretical throughput | Connector |
|-----------|---------------------------|-----------|
| **SATA III** | 600 MB/s (6 Gbps) | SATA data + SATA power |
| **NVMe over PCIe 3.0 x4** | ~3,500 MB/s | M.2 |
| **NVMe over PCIe 4.0 x4** | ~7,000 MB/s | M.2 |
| **NVMe over PCIe 5.0 x4** | ~14,000 MB/s | M.2 |
| **SAS-3** | 1,200 MB/s (12 Gbps) | SAS, enterprise |
| **SAS-4** | 2,400 MB/s (24 Gbps) | SAS, enterprise |

**M.2 physical sizes** (numbers = width × length in mm):
• **2230** — 22×30 mm (small; used in some laptops and Steam Deck)
• **2242** — 22×42 mm
• **2260** — 22×60 mm
• **2280** — 22×80 mm — **most common desktop/laptop size**
• **22110** — 22×110 mm (enterprise, longer for more NAND)

**M.2 keying** — the notch position determines what protocols the slot supports:
• **B-key** — supports SATA and PCIe x2 (slower NVMe)
• **M-key** — supports PCIe x4 (full NVMe speed)
• **B+M key** — drive fits both kinds of slots (SATA-only usually)
Match the drive to the slot keying or it won't fit.

**RAID hot spare** — an extra drive physically installed in the array but idle. If a member drive fails, the hot spare is automatically rebuilt into the array — no hands-on intervention. Compared with a **cold spare** (sitting on a shelf). Modern arrays often use **global hot spares** that can join any degraded array in the system.

**Hot swap** — the ability to replace a drive without powering down the system. Standard in enterprise SAS/SATA backplanes; not usually possible on consumer desktops without specific hardware.

**Optical disc capacities** (per side, single layer / dual layer):

| Disc | Single layer | Dual layer | Read speed (1×) |
|------|--------------|------------|-----------------|
| **CD** | **700 MB** | N/A | 150 KB/s |
| **DVD** | **4.7 GB** | **8.5 GB** | 1.32 MB/s |
| **Blu-ray (BD)** | **25 GB** | **50 GB** | 4.5 MB/s |
| **Ultra HD Blu-ray** | 50 GB | 66 / 100 GB | 9–18 MB/s |

"×" ratings (e.g., 48× CD) are multiples of that base speed.` },
        { heading: "HDD Geometry, Wear Leveling, SD Cards, Optical Detail", content: `**Drive bays in a PC case:**
• **5.25-inch** — large bay for optical drives, older removable media (ZIP), some RAID backplanes, front-panel accessories (multi-card readers, fan controllers).
• **3.5-inch** — standard HDD size for desktops.
• **2.5-inch** — laptop HDDs, SATA SSDs, some enterprise drives. Can install in a 3.5" bay using a **caddy / adapter bracket**.
• **Toolless / rail caddies** — slide-out trays that let you mount a drive and swap it without unscrewing it from the case.

**HDD drive geometry** (low-level formatting):
• **Platter** → coated with magnetic material
• **Track** → concentric circle on a platter
• **Sector** → wedge-shaped division of a track. **Standard sector = 512 bytes** (newer drives use 4K sectors, but reported as 512-byte logical to the OS — "Advanced Format")
• **Cylinder** → the same track on every platter stacked (vertical)
• **Read/write head** → one per platter side, floats on cushion of air
• **Actuator** → voice-coil motor that positions the head assembly across the platter
• **Spindle / motor** → spins platters at constant RPM

**HDD access/seek timing**:
• **Seek time** — time to physically move the head to the correct track (ms).
• **Access time** — seek time plus rotational latency (waiting for the right sector to spin under the head).
• **High-performance drives**: access time < 3 ms (15K/10K RPM enterprise).
• **Typical drives**: ~6 ms (7200 RPM desktop).

**HDD throughput by RPM:**
| RPM | Typical sustained read speed |
|-----|------------------------------|
| 5400 | 80–100 MB/s |
| 7200 | **~110 MB/s** |
| 10,000 | ~150 MB/s |
| 15,000 | **~180 MB/s** |

**2.5-inch HDD heights**: **15 mm** (enterprise/high-cap), **9.5 mm** (standard laptop), **7 mm** (thin laptops), **5 mm** (ultraportables). Thicker drives won't fit in shallow laptop bays.

**SSD wear leveling:**
• NAND flash cells can only be **rewritten a finite number of times** (the "program/erase cycle" endurance of the cell type — see SLC/MLC/TLC/QLC earlier).
• **Wear-leveling algorithm** in the SSD's firmware distributes writes across all cells evenly — prevents any single region from burning out first.
• **Over-provisioning** — SSD ships with more NAND than advertised capacity; extra cells substitute in as cells wear out.
• **TRIM** — OS tells the SSD which blocks are no longer in use so the controller can wipe them in the background. Maintains write performance. Enabled by default in modern Windows/macOS/Linux for SSDs.

**SATA bottleneck**: modern NAND is capable of **~6.7 GB/s sustained**, but SATA III caps at **600 MB/s**. That's why high-end SSDs moved to NVMe over PCIe — SATA is the bottleneck.

**NVMe / NVMHCI** — "Non-Volatile Memory Express" / "Non-Volatile Memory Host Controller Interface." Protocol designed for flash storage (unlike AHCI which was designed for spinning disks). Lower command-queue overhead, deep parallelism — NVMe can queue 64K commands per queue; AHCI queues 32 total.

**Major drive manufacturers**:
| Type | Major vendors |
|------|---------------|
| HDD | Seagate, Western Digital, Toshiba (after absorbing Hitachi/HGST), Fujitsu (historical) |
| Consumer SSD | Samsung, Crucial (Micron), WD/SanDisk, Kingston, Corsair, Seagate |
| Enterprise SSD | Samsung, Micron, Intel/Solidigm, Kioxia, SK hynix |

**Software vs. Hardware RAID:**
| Type | Implementation | Pros | Cons |
|------|----------------|------|------|
| **Software RAID** | OS features (Windows Storage Spaces, Linux mdadm, macOS disk utility) | Free, flexible, portable between machines | Uses host CPU, slower, no boot-drive RAID on some OSes |
| **Hardware RAID** | Dedicated RAID controller card with its own CPU + cache + battery-backed memory | Offloads CPU, fast, RAID arrays visible to BIOS (can boot from RAID), hot-swap support | Expensive card, array may be tied to specific controller model (replacement compatibility issue) |
| **Chipset / "Fake" RAID** | Integrated into motherboard chipset (Intel RST) | Free, integrated | Still uses host CPU. Portability limited. |

**RAID 1 rebuild is faster than parity rebuilds (RAID 5/6)** because RAID 1 just copies the surviving disk; parity-based RAID must recompute data from parity across all remaining disks.

**Identical disks for a RAID array** — same capacity, type, performance. **If sizes differ, the smallest disk limits the array** — all bigger disks use only that smaller capacity. Mismatched performance = whole array runs at the slowest drive's speed.

**Chance of array failure rises with disk count** — more drives = more things that can break. This is a reason RAID 6 (tolerates 2 failures) is preferred for large arrays over RAID 5 (tolerates 1).

**NAS (Network Attached Storage)**:
• A dedicated storage appliance connected to the LAN (Ethernet).
• Presents storage as file shares (SMB/CIFS, NFS, AFP) or iSCSI block targets.
• Usually houses 2–24 disks with built-in RAID.
• Consumer examples: Synology, QNAP, Asustor. Enterprise: NetApp, EMC Isilon.
• Compared to **SAN (Storage Area Network)** which delivers block-level storage over dedicated Fibre Channel or iSCSI.

**SD card capacity types** (exam-relevant):
| Standard | Max capacity | File system |
|----------|--------------|-------------|
| **SD** | **2 GB** | FAT12 / FAT16 |
| **SDHC** (High Capacity) | **32 GB** | FAT32 |
| **SDXC** (Extended Capacity) | **2 TB** | exFAT |
| **SDUC** (Ultra Capacity) | 128 TB | exFAT |

**SD card speed classes** (exam-relevant):
| Class | Max speed | Use case |
|-------|-----------|----------|
| **Original SD** | up to 25 MB/s | Basic |
| **UHS-I** | up to 108 MB/s | HD video, DSLRs |
| **UHS-II** | 156 / 312 MB/s | 4K video, pro cameras |
| **UHS-III** | 312 / 624 MB/s | High-bitrate pro |
| **SD Express** | up to 985 MB/s (PCIe/NVMe over SD form factor) | Emerging |

**Sizes** (all use the same protocol): **SD** (full-size), **miniSD** (legacy), **microSD** (phones/tablets/cameras). Adapters let microSD fit a full-size SD slot.

**Optical disc formats and speeds:**
| Format | Capacity | Base speed (1×) | Notes |
|--------|----------|----------------|-------|
| **CD** (CD-R, CD-RW) | **700 MB** | **150 KB/s** | Original; CD-R write once, CD-RW erase/rewrite |
| **DVD** (DVD-R/+R, DVD-RW/+RW, DVD-DL) | **4.7 GB** SL / **8.5 GB** DL / 9.4 DS / 17 GB DS-DL | **1.32 MB/s** (9× CD) | ± symbol on drive = supports both -R and +R format |
| **Blu-ray** (BD-R, BD-RE) | **25 GB** SL / **50 GB** DL / 100–128 GB BDXL | **4.5 MB/s** | Max theoretical 16× (~72 MB/s) |
| **UHD Blu-ray** | 50 / 66 / 100 GB | — | Ultra-HD movie format, HDR support |

**Recordable formats:**
• **Basic recordable** — written in a single session, then finalized. No further writes.
• **Multisession recordable** — can add new sessions later, but existing data can't be erased.
• **Rewritable (RW)** — can be erased and rewritten up to the disc's cycle rating.

**Drive speed notation** (e.g., 24×/16×/52×) = Record/Rewrite/Read speed.

**Emergency eject** — a **small hole on the drive face** with a **paper clip** inserted → mechanically releases the tray. Useful when the drive has no power or the eject button fails.

**DRM and region coding**:
• Commercial DVDs and Blu-rays have **region codes** (DVD: 1–6 + 7 special + 8 international; Blu-ray: A/B/C).
• PC drives allow region changes a **limited number of times (usually 5)** before the firmware locks to the last-chosen region permanently.` },
        { heading: "U.2, SAS, SSHD & Complete SSD Form Factor Guide", content: `**SSD interfaces — full breakdown:**

| Interface | Connector | Protocol | Typical speed | Use |
|-----------|-----------|----------|---------------|-----|
| **SATA** | 7-pin data + 15-pin power | AHCI | **600 MB/s** (SATA III) | General consumer, legacy compatibility |
| **PCIe (NVMe)** | Uses PCIe lanes directly | **NVMe** | **3.5–14 GB/s** (Gen3 x4 → Gen5 x4) | High-performance, modern |
| **SAS** | SAS connector (backwards-compatible with SATA) | SCSI command set | **600/1200 MB/s** (SAS-2/SAS-3) | Enterprise servers, RAID arrays |
| **U.2 (SFF-8639)** | Large 68-pin connector | NVMe over PCIe ×4 | **Same as NVMe M.2** (~3.5 GB/s Gen3) | Enterprise 2.5" NVMe, hot-swap |
| **U.3** | U.2-compatible | NVMe/SAS/SATA tri-mode | Same | Newer enterprise hot-swap |
| **EDSFF (E1.S / E1.L / E3.S)** | Ruler / datacenter form factors | NVMe over PCIe | Up to PCIe Gen5 | Hyperscale data centers (Facebook, Google) |

**SSD Form Factors:**
| Form factor | Dimensions | Connector | Common use |
|-------------|-----------|-----------|-----------|
| **2.5"** | 2.5" × 7mm | SATA or U.2 | Laptops, desktops, enterprise |
| **M.2 2280** | 22×80 mm | M.2 | **Most common** — desktops, laptops |
| **M.2 2242 / 2260 / 22110** | 22×42, 22×60, 22×110 mm | M.2 | Smaller laptops, ultrabooks, longer versions for enterprise |
| **mSATA** | Similar to Mini-PCIe | mSATA | **Legacy** — older ultrabooks (2011–2015); replaced by M.2 |
| **AIC (Add-in Card)** | PCIe card | PCIe slot | Enterprise, workstations, highest bandwidth |

**M.2 keying (critical to know):**
| Key | Lanes | Use |
|-----|-------|-----|
| **M-key** | PCIe ×4 (NVMe) | Modern NVMe SSDs — most common |
| **B-key** | PCIe ×2 or SATA | Older/lower-bandwidth NVMe or SATA M.2 |
| **B+M key** | Either | Dual-notched; works in either B or M socket; usually SATA M.2 |
| **A-key** | PCIe ×2 | Wi-Fi / Bluetooth cards (not SSDs) |
| **E-key** | PCIe ×2 | Wi-Fi / Bluetooth cards (like A, different pinout) |

⚠️ **Compatibility gotcha:** A SATA M.2 SSD won't work in an M-key-only slot on newer boards. Conversely, an NVMe M.2 won't work in a B-key SATA-only slot. Check the motherboard manual.

**SAS (Serial Attached SCSI):**
• Enterprise-grade — replaces parallel SCSI
• **Backwards compatibility:** SAS controllers accept SATA drives, but SATA controllers do NOT accept SAS drives
• Higher reliability targets (MTBF 1.6M hours vs ~1M for consumer SATA)
• Supports **dual-port drives** for redundant paths to storage controller
• Common in servers and RAID arrays — rarely seen in consumer hardware

**SSHD (Solid State Hybrid Drive) — "hybrid" drive:**
• Combines a traditional HDD (large capacity) with a small SSD cache (4–32 GB)
• Firmware automatically moves frequently-accessed data to the SSD cache
• **Bridge technology** — largely obsolete now that pure SSDs are affordable
• Still seen in budget laptops where cost per GB matters more than raw speed

**Hybrid storage systems (different from SSHD):**
• **Tiered storage** — OS manages hot data on SSD, cold on HDD (separate drives)
