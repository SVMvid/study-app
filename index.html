  {
    id: "pq_3_3_1",
    domain: 3,
    topic: "3.3",
    topicName: "RAM Characteristics",
    question: "A customer brings in a motherboard labeled as supporting DDR5-6400 and wants to know the key architectural change versus DDR4. Which statement is CORRECT about DDR5?",
    choices: [
      "A. DDR5 uses 240 pins on the DIMM, compared with 288 on DDR4",
      "B. DDR5 moved voltage regulation off the module and onto the motherboard",
      "C. DDR5 modules have an on-module PMIC that regulates voltage on the DIMM itself",
      "D. DDR5 increased the operating voltage to 1.5 V for higher speeds"
    ],
    correct: "C",
    explanation: "DDR5's signature architectural change is moving voltage regulation onto the DIMM via a Power Management IC (PMIC). DDR5 DIMMs use 288 pins (same physical count as DDR4 but a different notch) and operate at 1.1 V, lower than DDR4's 1.2 V."
  },
  {
    id: "pq_3_3_2",
    domain: 3,
    topic: "3.3",
    topicName: "RAM Characteristics",
    question: "A user installed two 8 GB DDR4-3200 sticks into slots A1 and A2 on a dual-channel motherboard, but CPU-Z reports single-channel operation. What is the most likely fix?",
    choices: [
      "A. Move the second module to B2 so the two DIMMs are on opposite channels",

      "C. Replace one stick with a CL16 module to match timings",
      "D. Flash the BIOS to enable XMP; dual-channel requires XMP"
    ],
    correct: "A",
    explanation: "Dual channel requires one DIMM in each channel, usually the A2 and B2 slots (both second slots from the CPU). Populating A1 and A2 puts both sticks on the same channel, so the system runs single channel. ECC doesn't enable dual-channel, and XMP only sets timings/speed, not channel operation."
  },
  {
    id: "pq_3_3_3",
    domain: 3,
    topic: "3.3",
    topicName: "RAM Characteristics",
    question: "A file server is experiencing occasional unexplained application crashes under heavy load. The admin wants memory that can automatically correct single-bit errors. Which combination is REQUIRED?",
    choices: [
      "A. ECC UDIMMs — the CPU and motherboard don't need to support ECC",
      "B. ECC RAM plus a CPU and motherboard that both support ECC",
      "C. Parity RAM, which detects and corrects single-bit errors",
      "D. DDR5 non-ECC, since DDR5 on-die ECC covers the full memory path"
    ],
    correct: "B",
    explanation: "Full ECC (detection AND correction across the memory controller link) requires ECC-capable modules AND a CPU/motherboard that support ECC. Dropping ECC DIMMs into a non-ECC board makes them run as ordinary non-ECC RAM. Parity only DETECTS single-bit errors; it cannot correct them. DDR5 on-die ECC protects the module internally but does not replace traditional system-level ECC."
  },
  {
    id: "pq_3_3_4",
    domain: 3,

    question: "Between DDR4-3200 CL16 and DDR5-6000 CL36, which statement about real-world latency is accurate?",
    choices: [

  },
  {

    domain: 3,
    topic: "3.4",
    topicName: "Storage Devices",
    question: "A technician installs a SATA M.2 SSD into a motherboard's M-key-only M.2 slot, but the drive is not detected. What is the MOST likely cause?",

  {
    id: "pq_3_4_2",
    domain: 3,
    topic: "3.4",
    topicName: "Storage Devices",
    question: "A small business wants to build a four-drive storage array that survives the simultaneous failure of any two drives. Which RAID level meets the requirement?",
    choices: [

      "B. RAID 10 — can always survive any two failed drives",
      "C. RAID 6 — stripe with double parity tolerates two drive failures",
      "D. RAID 0 — striping with redundancy"
    ],
    correct: "C",
    explanation: "RAID 6 uses double distributed parity and tolerates the simultaneous loss of two drives (minimum 4 drives). RAID 5 tolerates only one failure. RAID 10 survives two failures only if the two lost drives are in different mirror pairs — not 'any two.' RAID 0 has no redundancy."
  },
  {

    domain: 3,

    question: "A photographer is choosing an SD card for a 4K video camera. The camera requires sustained write speeds above 150 MB/s. Which SD card specification is suitable?",

  },
  {

    topicName: "Storage Devices",
    question: "A user complains that their new 2 TB NVMe drive shows only about 1.82 TB in Windows. What is the correct explanation?",

      "D. The partition table type (GPT vs MBR) is mismatched, hiding space"

    correct: "B",
    explanation: "Manufacturers label drives using decimal units (1 TB = 10^12 bytes), while operating systems display sizes using binary units (1 TiB = 2^40 bytes ≈ 1.0995 TB). A '2 TB' drive is about 1.82 TiB — not missing space, just different math. Over-provisioning exists but is usually much smaller than advertised capacity, and GPT/MBR does not hide 180+ GB."
  },
  {

    domain: 3,
    topic: "3.5",
    topicName: "Motherboards, CPUs & Add-on Cards",
    question: "A user reports that after installing Hyper-V, VMs fail to start with an error about hardware virtualization. Which BIOS/UEFI setting most likely needs to be enabled?",

  {

    domain: 3,

    topicName: "Motherboards, CPUs & Add-on Cards",
    question: "A technician installs a PCIe 4.0 x4 NVMe drive into a motherboard and later notices the primary GPU slot has dropped from x16 to x8. What is the most likely explanation?",

  {

  {

    topic: "3.6",
    topicName: "Power Supplies",
    question: "A technician is building a gaming PC with a CPU rated at 125W TDP and a GPU rated at 300W TDP, plus a few drives and fans. Peak component draw is estimated around 475W. Which PSU wattage best follows the recommended sizing rule?",

  {

  {

  {

  {

  {

  {

  },
  {

  },
  {

    domain: 3,
    topic: "3.8",

    question: "A warehouse needs to print multipart carbon-copy invoices where the top copy goes to the customer and additional copies transfer through to stay with the order. Which printer technology is the ONLY appropriate choice?",

      "D. Impact (dot matrix)"

  },
  {
    id: "pq_3_8_4",

  {

// Splice a "X.Y Practice Questions" topic after the last existing topic whose
// title begins with "X.Y".  Mutates D in place at load time.
(function injectPracticeTopics(){
  D.forEach(function(d){
    var grouped = {};
    PQ.filter(function(q){ return q.domain === d.id; }).forEach(function(q){
      (grouped[q.topic] = grouped[q.topic] || []).push(q);
    });
    var newTopics = [];
    var added = {};
    for (var i = 0; i < d.topics.length; i++){
      newTopics.push(d.topics[i]);
      var m1 = d.topics[i].title.match(/^(\d+\.\d+)/);
      var sec = m1 ? m1[1] : null;
      var nextM = (i+1 < d.topics.length) ? d.topics[i+1].title.match(/^(\d+\.\d+)/) : null;
      var nextSec = nextM ? nextM[1] : null;
      if (sec && grouped[sec] && !added[sec] && nextSec !== sec){
        newTopics.push({
          title: sec + " Practice Questions",
          practice: true,
          sectionNum: sec,
          sections: [{ heading: sec + " Practice Questions", questions: grouped[sec] }]
        });
        added[sec] = true;
      }
    }
    d.topics = newTopics;
  });
})();

  const css=`*{box-sizing:border-box;margin:0;padding:0}.rt{min-height:100vh;background:#08080c;color:#c8c8d0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mn{font-family:'JetBrains Mono','Fira Code',monospace}.hd{padding:16px 20px;padding-top:max(16px,env(safe-area-inset-top));border-bottom:1px solid #1a1a22;position:sticky;top:0;background:#08080cee;backdrop-filter:blur(12px);z-index:10}.hd h1{font-size:16px;font-weight:800;letter-spacing:-.3px}.hd .su{font-size:11px;color:#555;margin-top:2px}.pb{height:3px;background:#1a1a22;border-radius:2px;margin-top:10px;overflow:hidden}.pf{height:100%;border-radius:2px;transition:width .4s}.pl{font-size:10px;color:#555;margin-top:4px;text-align:right}.gr{padding:16px;display:flex;flex-direction:column;gap:8px}.dc2{padding:16px;border-radius:12px;border:1px solid #1a1a22;cursor:pointer;transition:all .2s;background:#0e0e14;-webkit-tap-highlight-color:transparent}.dc2:active{transform:scale(.98)}.dc2 .n{font-size:15px;font-weight:700;margin-bottom:4px}.dc2 .m{font-size:11px;color:#555}.wb{height:4px;background:#1a1a22;border-radius:2px;margin-top:10px;overflow:hidden}.wf{height:100%;border-radius:2px;transition:width .4s}.bb{background:none;border:1px solid #222;color:#888;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;-webkit-tap-highlight-color:transparent}.bb:active{background:#111}.tl{padding:12px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}.th{font-size:14px;font-weight:700;color:#e0e0e0;padding:14px 0 6px;border-bottom:1px solid #1a1a22;margin-bottom:8px;display:flex;align-items:center}.sc{border:1px solid #1a1a22;border-radius:10px;margin-bottom:6px;overflow:hidden;background:#0c0c12}.sc.op{border-color:#2a2a35}.sh{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px;-webkit-tap-highlight-color:transparent}.sh:active{background:#111118}.st{flex:1;font-size:13px;font-weight:600}.cv{font-size:12px;color:#444;transition:transform .2s}.cv.op{transform:rotate(90deg)}.ckb{width:20px;height:20px;border-radius:50%;border:2px solid #333;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .2s;flex-shrink:0;-webkit-tap-highlight-color:transparent}.ckb.on{border-color:#66bb6a;background:#66bb6a22;color:#66bb6a}.sy{padding:0 14px 14px}.cb{font-size:13px;line-height:1.75;color:#a0a0aa;white-space:pre-wrap;word-wrap:break-word}.cb .k{color:#fff;font-weight:600;background:#ffffff0a;padding:1px 4px;border-radius:3px}.cb .bl{padding-left:16px;position:relative;margin:2px 0}.cb .bl::before{content:"\\2022";position:absolute;left:4px;color:#555}.cb .bl.sb{padding-left:28px}.cb .bl.sb::before{left:16px}.cb .nm{padding-left:8px;margin:3px 0}.cb .wn{color:#ff8a65;padding:6px 10px;background:#ff8a6508;border-left:3px solid #ff8a65;border-radius:0 6px 6px 0;margin:6px 0}.cb .tb{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}.cb table{border-collapse:collapse;width:100%;font-size:12px}.cb th{background:#14141e;color:#ccc;font-weight:700;text-align:left;padding:8px 10px;border:1px solid #1e1e2a;white-space:nowrap}.cb td{padding:6px 10px;border:1px solid #1a1a22;color:#999}.sx{width:100%;background:#0e0e14;border:1px solid #222;border-radius:8px;padding:10px 14px;color:#ccc;font-size:16px;font-family:inherit;outline:none;margin-bottom:8px;-webkit-appearance:none}.sx:focus{border-color:#444}.sx::placeholder{color:#444}.mbtn{margin-top:14px;width:100%;padding:12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;-webkit-tap-highlight-color:transparent}.tbar{display:flex;gap:4px;margin-top:10px;background:#0e0e14;border:1px solid #1a1a22;border-radius:8px;padding:3px}.tabb{flex:1;padding:8px 6px;background:none;border:none;color:#666;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:6px;transition:all .15s;-webkit-tap-highlight-color:transparent}.tabb.active{background:#00b4d822;color:#00b4d8}.tabb:active{background:#111118}.flag{color:#e94560;margin-left:6px;font-size:10px}.qfilt{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}.qfb{padding:6px 10px;background:#0e0e14;border:1px solid #222;color:#888;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:6px;-webkit-tap-highlight-color:transparent}.qfb.active{background:#00b4d822;border-color:#00b4d8;color:#00b4d8}.qc{background:#0e0e14;border:1px solid #1a1a22;border-radius:12px;padding:16px;margin-bottom:14px}.qt{font-size:15px;font-weight:600;line-height:1.5;color:#e0e0e0;margin-bottom:14px}.qchoices{display:flex;flex-direction:column;gap:8px}.qch{text-align:left;padding:11px 14px;background:#0c0c12;border:1px solid #222;color:#c8c8d0;font-size:13px;font-family:inherit;border-radius:8px;cursor:pointer;line-height:1.45;-webkit-tap-highlight-color:transparent;transition:all .12s}.qch:not(:disabled):active{background:#141420;border-color:#333}.qch.correct{background:#66bb6a18;border-color:#66bb6a;color:#88d090}.qch.wrong{background:#e9456018;border-color:#e94560;color:#ff7a8f}.qch.locked{opacity:.5}.qch:disabled{cursor:default}.expl{margin-top:14px;padding:12px 14px;border-radius:8px;border-left:3px solid}.expl.ok{background:#66bb6a0c;border-color:#66bb6a}.expl.err{background:#e945600c;border-color:#e94560}.exh{font-size:13px;font-weight:700;margin-bottom:6px}.expl.ok .exh{color:#88d090}.expl.err .exh{color:#ff7a8f}.exb{font-size:12px;line-height:1.6;color:#a0a0aa}.qnav{display:flex;gap:8px;align-items:center;margin-top:10px}.statcard{background:linear-gradient(135deg,#0e0e14,#14141e);border:1px solid #1a1a22;border-radius:14px;padding:26px 18px;text-align:center;margin-bottom:18px}.statbig{font-size:52px;font-weight:900;letter-spacing:-2px;line-height:1}.statlbl{font-size:11px;color:#888;margin-top:6px}.srow{padding:12px 14px;border:1px solid #1a1a22;border-radius:10px;margin-bottom:6px;background:#0c0c12;cursor:pointer;-webkit-tap-highlight-color:transparent}.srow:active{background:#111118}.sc.pq{border-color:#1a2a35}.sc.pq.op{border-color:#00b4d855}.ckb.warn{border-color:#e94560;background:#e9456022;color:#e94560}.ckb.part{border-color:#ffb74d;background:#ffb74d22;color:#ffb74d}.pqlist{display:flex;flex-direction:column;gap:6px}`;

  const modeTabs=()=>ce('div',{className:'tbar'},
    ['study','quiz','stats'].map(m=>ce('button',{key:m,className:'tabb'+(md===m?' active':''),onClick:()=>{setMd(m);setDm(null);setQ('');setQi(0);}},
      m==='study'?'📚 Study':m==='quiz'?'❓ Quiz':'📊 Stats'
    ))
  );

  if(md==='stats'){
    const answered=Object.keys(an).length;
    const correct=Object.values(an).filter(a=>a.correct).length;
    const acc=answered>0?Math.round(correct/answered*100):0;
    const domainStats=D.map(d=>{
      const qs=[...Q,...PQ].filter(qu=>qu.domain===d.id);
      const ans=qs.filter(qu=>an[qu.id]);
      const ok=ans.filter(qu=>an[qu.id].correct).length;
      return{d,total:qs.length,answered:ans.length,correct:ok,pct:ans.length>0?Math.round(ok/ans.length*100):0};
    });
    const topicStats=[...needsReview].map(t=>{
      const qs=[...Q,...PQ].filter(qu=>qu.topic===t);
      const wrong=qs.filter(qu=>an[qu.id]&&!an[qu.id].correct).length;
      const domainId=qs[0]&&qs[0].domain;
      const dom=D.find(d=>d.id===domainId);
      return{topic:t,name:qs[0]&&qs[0].topicName,wrong,total:qs.length,dom};
    }).sort((a,b)=>b.wrong-a.wrong);

    return ce('div',{className:'rt'},
      ce('style',null,css),
      ce('div',{className:'hd'},
        ce('h1',{style:{color:'#00b4d8'}},'Progress & Stats'),
        ce('div',{className:'su mn'},answered+'/'+(Q.length+PQ.length)+' answered • '+acc+'% accuracy'),
        modeTabs()
      ),
      ce('div',{className:'tl'},
        ce('div',{className:'statcard'},
          ce('div',{className:'statbig',style:{color:answered===0?'#555':acc>=75?'#66bb6a':acc>=50?'#ffb74d':'#e94560'}},answered===0?'—':acc+'%'),
          ce('div',{className:'statlbl'},answered>0?correct+' correct of '+answered+' answered • '+(Q.length+PQ.length-answered)+' not attempted':'Take quiz questions to see stats')
        ),
        ce('div',{className:'th'},'Accuracy by Domain'),
        domainStats.map(s=>ce('div',{key:s.d.id,className:'dc2',onClick:()=>{setMd('quiz');setQf(s.d.id);setQi(0);}},
          ce('div',{className:'n',style:{color:s.d.color}},'Domain '+s.d.id+': '+s.d.domain),
          ce('div',{className:'m'},s.answered+'/'+s.total+' answered • ',
            ce('span',{style:{color:s.answered===0?'#555':s.pct>=75?'#66bb6a':s.pct>=50?'#ffb74d':'#e94560',fontWeight:700}},s.answered===0?'—':s.pct+'%')),
          ce('div',{className:'wb'},ce('div',{className:'wf',style:{width:(s.total>0?s.answered/s.total*100:0)+'%',background:s.pct>=75?'#66bb6a':s.pct>=50?'#ffb74d':s.answered>0?'#e94560':s.d.color}}))
        )),
        topicStats.length>0?ce('div',{className:'th',style:{color:'#ff8a65',marginTop:20}},'🚩 Topics to Review'):null,
        topicStats.map(t=>ce('div',{key:t.topic,className:'srow',style:{borderLeft:'3px solid #e94560'},onClick:()=>{if(t.dom){setMd('study');setDm(t.dom.id);}}},
          ce('div',{style:{color:'#e94560',fontSize:13,fontWeight:700}},t.topic+' — '+t.name),
          ce('div',{className:'m'},t.wrong+' wrong of '+t.total+' questions • tap to study')
        )),
        answered>0&&topicStats.length===0?ce('div',{className:'m',style:{textAlign:'center',marginTop:20,color:'#66bb6a'}},'✓ No incorrect answers — you are golden'):null,
        ce('button',{className:'bb',style:{marginTop:20,width:'100%'},onClick:()=>{if(window.confirm('Reset all quiz progress? This cannot be undone.')){setAn({});setQi(0);}}},'Reset all quiz answers')
      )
    );
  }

  if(md==='quiz'){
    if(filteredQ.length===0){
      return ce('div',{className:'rt'},
        ce('style',null,css),
        ce('div',{className:'hd'},
          ce('h1',{style:{color:'#00b4d8'}},'CompTIA A+ Core 1 • Quiz'),
          ce('div',{className:'su mn'},'0 questions in this filter'),
          modeTabs()
        ),
        ce('div',{className:'tl',style:{textAlign:'center',padding:40}},
          ce('div',{className:'m'},'No questions match this filter.'),
          ce('button',{className:'bb',style:{marginTop:12},onClick:()=>{setQf('all');setQi(0);}},'Show all')
        )
      );
    }
    const idx=Math.min(qi,filteredQ.length-1);
    const cur=filteredQ[idx];
    const ans=an[cur.id];
    const correctLetters=cur.correct.split(',').map(s=>s.trim());

    const pick=(letter)=>{
      if(ans)return;
      const isCorrect=correctLetters.length===1?correctLetters[0]===letter:correctLetters.includes(letter);
      setAn(p=>({...p,[cur.id]:{picked:letter,correct:isCorrect,ts:Date.now()}}));
    };
    const next=()=>setQi(idx+1<filteredQ.length?idx+1:0);
    const prev=()=>setQi(idx>0?idx-1:filteredQ.length-1);
    const retry=()=>{setAn(p=>{const n={...p};delete n[cur.id];return n;});};

    return ce('div',{className:'rt'},
      ce('style',null,css),
      ce('div',{className:'hd'},
        ce('h1',{style:{color:'#00b4d8'}},'Quiz'),
        ce('div',{className:'su mn'},'Q'+(idx+1)+' / '+filteredQ.length+' • D'+cur.domain+' • '+cur.topic+' '+cur.topicName),
        modeTabs()
      ),
      ce('div',{className:'tl'},
        ce('div',{className:'qfilt'},
          ce('button',{className:'qfb'+(qf==='all'?' active':''),onClick:()=>{setQf('all');setQi(0);}},'All ('+Q.length+')'),
          ce('button',{className:'qfb'+(qf==='unanswered'?' active':''),onClick:()=>{setQf('unanswered');setQi(0);}},'New ('+Q.filter(qu=>!an[qu.id]).length+')'),
          ce('button',{className:'qfb'+(qf==='wrong'?' active':''),onClick:()=>{setQf('wrong');setQi(0);}},'🚩 Wrong ('+Q.filter(qu=>an[qu.id]&&!an[qu.id].correct).length+')'),
          [1,2,3,4,5].map(n=>ce('button',{key:n,className:'qfb'+(qf===n?' active':''),onClick:()=>{setQf(n);setQi(0);}},'D'+n))
        ),
        ce('div',{className:'qc'},
          ce('div',{className:'qt'},cur.question),
          correctLetters.length>1?ce('div',{className:'m',style:{marginBottom:10,color:'#ffb74d'}},'Select all that apply ('+correctLetters.length+' correct)'):null,
          ce('div',{className:'qchoices'},cur.choices.map((c,i)=>{
            const letter=c.trim().charAt(0);
            const isCorrect=correctLetters.includes(letter);
            let cls='qch';
            if(ans){
              if(isCorrect)cls+=' correct';
              else if(ans.picked===letter)cls+=' wrong';
              else cls+=' locked';
            }
            return ce('button',{key:i,className:cls,onClick:()=>pick(letter),disabled:!!ans},c);
          })),
          ans?ce('div',{className:'expl'+(ans.correct?' ok':' err')},
            ce('div',{className:'exh'},ans.correct?'✓ Correct':'✗ Incorrect — correct answer: '+cur.correct),
            ce('div',{className:'exb'},cur.explanation),
            !ans.correct?ce('button',{className:'bb',style:{marginTop:10},onClick:()=>{setMd('study');setDm(cur.domain);setQ(cur.topic);}},'📖 Review '+cur.topic+' in study guide →'):null
          ):null
        ),
        ce('div',{className:'qnav'},
          ce('button',{className:'bb',onClick:prev},'← Prev'),
          ans?ce('button',{className:'bb',onClick:retry},'↻ Retry'):null,
          ce('button',{className:'bb',style:{marginLeft:'auto'},onClick:next},'Next →')
        )
      )
    );
  }

  if(dm===null){
    return ce('div',{className:'rt'},
      ce('style',null,css),
      ce('div',{className:'hd'},
        ce('h1',{style:{color:'#00b4d8'}},'CompTIA A+ Core 1'),
        ce('div',{className:'su mn'},'220-1201 • Interactive Study Guide • 675 pass (100–900 scale)'),
        ce('div',{className:'pb'},ce('div',{className:'pf',style:{width:(dc/tot*100)+'%',background:'#66bb6a'}})),
        ce('div',{className:'pl mn'},dc+'/'+tot+' sections studied'),
        modeTabs()
      ),
      ce('div',{className:'gr'},D.map(d=>{
        const ds=d.topics.filter(t=>!t.practice).reduce((s,t)=>s+t.sections.length,0);
        const dd=d.topics.filter(t=>!t.practice).reduce((s,t)=>s+t.sections.filter((_,i)=>dn[d.id+'-'+t.title+'-'+i]).length,0);
        const hasFlag=[...needsReview].some(t=>t.split('.')[0]===String(d.id));
        return ce('div',{key:d.id,className:'dc2',onClick:()=>setDm(d.id),style:{borderLeftColor:d.color,borderLeftWidth:3}},
          ce('div',{className:'n',style:{color:d.color}},'Domain '+d.id+': '+d.domain,hasFlag?ce('span',{className:'flag'},'🚩 review'):null),
          ce('div',{className:'m'},d.weight+'% of exam • '+d.topics.length+' topics • '+ds+' sections • ',
            ce('span',{style:{color:dd===ds?'#66bb6a':dd>0?'#ffb74d':'#555'}},dd+'/'+ds+' done')),
          ce('div',{className:'wb'},ce('div',{className:'wf',style:{width:(ds>0?dd/ds*100:0)+'%',background:dd===ds?'#66bb6a':d.color}}))
        )}))
    );
  }

  const d=D.find(x=>x.id===dm);
  const topics=q?d.topics.map(t=>({...t,sections:t.sections.filter(s=>s.heading.toLowerCase().includes(q.toLowerCase())||s.content.toLowerCase().includes(q.toLowerCase()))})).filter(t=>t.sections.length>0):d.topics;

  return ce('div',{className:'rt'},
    ce('style',null,css),
    ce('div',{className:'hd'},
      ce('div',{style:{display:'flex',alignItems:'center',gap:10}},
        ce('button',{className:'bb',onClick:()=>{setDm(null);setQ('')}},'←'),
        ce('div',null,
          ce('h1',{style:{color:d.color}},'D'+d.id+': '+d.domain),
          ce('div',{className:'su mn'},d.weight+'% of exam')))),
    ce('div',{className:'tl'},
      ce('input',{className:'sx',placeholder:'Search this domain...',value:q,onChange:e=>setQ(e.target.value)}),
      topics.map((t,ti)=>{
        const tm=t.title.match(/^\d+\.\d+/);
        const tFlag=tm&&needsReview.has(tm[0]);
        return ce('div',{key:ti},
          ce('div',{className:'th'},t.title,tFlag?ce('span',{className:'flag'},'🚩'):null,
            tFlag?ce('button',{className:'bb',style:{marginLeft:'auto',padding:'3px 10px',fontSize:10},onClick:()=>{setMd('quiz');setQf('wrong');setQi(0);}},'Retry wrong →'):null),
          t.sections.map((sec,si)=>{
            const k=d.id+'-'+t.title+'-'+si;
            const isPractice=!!sec.questions;
            let pStat='none';
            if(isPractice){
              const total=sec.questions.length;
              const answered=sec.questions.filter(qu=>an[qu.id]).length;
              const correct=sec.questions.filter(qu=>an[qu.id]&&an[qu.id].correct).length;
              if(total>0&&correct===total)pStat='all-correct';
              else if(answered>0&&correct<answered)pStat='some-wrong';
              else if(answered>0)pStat='partial';
            }
            const headColor=isPractice
              ?(pStat==='all-correct'?'#66bb6a':pStat==='some-wrong'?'#e94560':pStat==='partial'?'#ffb74d':ex[k]?'#fff':'#c0c0c8')
              :(dn[k]?'#66bb6a':ex[k]?'#fff':'#c0c0c8');
            const ckLabel=isPractice
              ?(pStat==='all-correct'?'✓':pStat==='some-wrong'?'!':pStat==='partial'?'…':'')
              :(dn[k]?'✓':'');
            const ckCls='ckb'
              +(isPractice
                ?(pStat==='all-correct'?' on':pStat==='some-wrong'?' warn':pStat==='partial'?' part':'')
                :(dn[k]?' on':''));
            return ce('div',{key:si,className:'sc'+(ex[k]?' op':'')+(isPractice?' pq':'')},
              ce('div',{className:'sh',onClick:()=>tg(k)},
                ce('button',{className:ckCls,onClick:e=>{e.stopPropagation();if(!isPractice)ck(k,e);},title:isPractice?'Practice status — auto-tracked':'Toggle studied'},ckLabel),
                ce('div',{className:'st',style:{color:headColor}},
                  isPractice?ce('span',{style:{color:'#00b4d8',fontWeight:700,marginRight:6}},'📝'):null,
                  sec.heading,
                  isPractice?ce('span',{style:{color:'#555',fontWeight:500,marginLeft:8,fontSize:11}},'· '+sec.questions.filter(qu=>an[qu.id]&&an[qu.id].correct).length+'/'+sec.questions.length):null),
                ce('span',{className:'cv'+(ex[k]?' op':'')},'▶')),
              ex[k]?ce('div',{className:'sy'},
                isPractice
                  ?ce('div',{className:'pqlist'},
                      sec.questions.map((qu,qi)=>{
                        const ans=an[qu.id];
                        const correctLetters=qu.correct.split(',').map(s=>s.trim());
                        const pick=(letter)=>{
                          if(ans)return;
                          const isC=correctLetters.length===1?correctLetters[0]===letter:correctLetters.includes(letter);
                          setAn(p=>({...p,[qu.id]:{picked:letter,correct:isC,ts:Date.now()}}));
                        };
                        const retry=()=>{setAn(p=>{const n={...p};delete n[qu.id];return n;});};
                        return ce('div',{key:qu.id,className:'qc',style:{marginBottom:12}},
                          ce('div',{className:'qt',style:{fontSize:14}},'Q'+(qi+1)+'. '+qu.question),
                          correctLetters.length>1?ce('div',{className:'m',style:{marginBottom:8,color:'#ffb74d',fontSize:11}},'Select all that apply ('+correctLetters.length+' correct)'):null,
                          ce('div',{className:'qchoices'},qu.choices.map((c,ci)=>{
                            const letter=c.trim().charAt(0);
                            const isCorrect=correctLetters.includes(letter);
                            let cls='qch';
                            if(ans){
                              if(isCorrect)cls+=' correct';
                              else if(ans.picked===letter)cls+=' wrong';
                              else cls+=' locked';
                            }
                            return ce('button',{key:ci,className:cls,onClick:()=>pick(letter),disabled:!!ans},c);
                          })),
                          ans?ce('div',{className:'expl'+(ans.correct?' ok':' err')},
                            ce('div',{className:'exh'},ans.correct?'✓ Correct':'✗ Incorrect — correct answer: '+qu.correct),
                            ce('div',{className:'exb'},qu.explanation),
                            ce('button',{className:'bb',style:{marginTop:10},onClick:retry},'↻ Retry')
                          ):null
                        );
                      })
                    )
                  :[ce('div',{key:'body',className:'cb',dangerouslySetInnerHTML:{__html:parseContent(sec.content)}}),
                    ce('button',{key:'btn',className:'mbtn',onClick:e=>ck(k,e),style:{border:dn[k]?'1px solid #66bb6a':'1px solid #333',background:dn[k]?'#66bb6a18':'#111118',color:dn[k]?'#66bb6a':'#888'}},dn[k]?'✓ Completed — tap to undo':'Mark as Complete')]
              ):null
            )}))}))
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(App));
</script>
</body>
</html>
