• **Intel Optane Memory** (discontinued) — small Optane module cached data from a slower HDD
• **Apple Fusion Drive** (legacy Mac) — OS-managed tier combining SSD + HDD into one logical volume

**NVMe advantages over AHCI/SATA:**
• **Designed for flash from the ground up** — not a disk-era protocol
• **65,536 queues × 65,536 commands each** (vs AHCI's 1 queue × 32 commands)
• **Lower latency** — fewer CPU cycles per I/O
• **PCIe direct** — no controller translation overhead

**Drive capacity conventions:**
• Drive manufacturers use **decimal** (1 TB = 10¹² bytes = 1,000,000,000,000 bytes)
• OSes show **binary** (1 TiB = 2⁴⁰ bytes = ~1.0995 TB)
• A "1 TB" drive shows as ~931 GB in Windows — not missing capacity, just different math.` }
      ]},
      { title: "3.5 — Motherboards, CPUs & Add-on Cards", sections: [
        { heading: "Motherboard, BIOS/UEFI & CPU", content: `**Form factors:** ATX (12"×9.6", 7 slots), **Micro-ATX** [NEW] (9.6"×9.6", 4 slots), Mini-ITX (6.7"×6.7", 1 slot).

**Key connectors:** 24-pin ATX power, 4/8-pin CPU power (EPS), PCIe x16 (GPU), PCIe x1/x4, **legacy PCI** (32-bit parallel bus, white slots, mostly phased out but still on some boards for older expansion cards), M.2 slot, SATA ports, USB headers, fan headers (4-pin PWM), front panel connectors.

**Motherboard compatibility:**
• **CPU socket types** — Intel (LGA — pins on socket, contacts on CPU) and AMD (PGA on older Ryzen, LGA on AM5). Sockets are NOT cross-compatible between vendors or generations.
• **Multisocket** — boards with 2+ CPU sockets, used in workstations/servers (Xeon, EPYC). Doubles core count and memory bandwidth; requires multisocket-aware OS and software.

**BIOS/UEFI settings:**
• Boot order, Secure Boot (prevents unsigned OS, required Win 11), TPM (encryption keys, required BitLocker + Win 11)
• USB permissions, fan controls
• **Boot password** [NEW] — prevents booting without password
• **BIOS password** [NEW] — prevents BIOS setup access only
• **Temperature monitoring** [NEW] — CPU/board temps in BIOS
• **Virtualization support** — enables Intel **VT-x** or AMD-V CPU extensions. Must be ON for hypervisors (Hyper-V, VMware, VirtualBox) to run VMs. Often disabled by default — "VM won't start / requires hardware virtualization" errors trace here.

**CPU:** x86/x64 (Intel/AMD, 32/64-bit), ARM (mobile, Apple Silicon, energy efficient). Cores, threads (HT/SMT), clock speed (GHz), cache (L1→L2→L3), TDP (watts, determines cooler).

**Encryption hardware:**
• **TPM (Trusted Platform Module)** — chip (or firmware fTPM) on motherboard. Stores encryption keys, enables BitLocker, required for Windows 11.
• **HSM (Hardware Security Module)** — dedicated, tamper-resistant device for generating/storing cryptographic keys. Higher assurance than TPM; used for enterprise PKI, code signing, payment processing. Form factors: PCIe card, USB, network-attached appliance.

**Expansion cards:** GPU (PCIe x16), NIC (PCIe x1, additional Ethernet/Wi-Fi), sound card (PCIe x1), capture card (video recording), RAID controller (enterprise storage).

**Cooling:** Heat sink (passive fins), fan (active airflow), liquid cooling (pump + radiator). **Thermal paste** fills microscopic gaps between CPU and heatsink. Must reapply when reseating cooler.` }
      ]},
      { title: "3.5 Deep Dive — CertMaster Additions", sections: [
        { heading: "CPU Socket Types, Chipset & PCIe Lanes", content: `**CPU socket mechanics** — know these terms:
• **LGA (Land Grid Array)** — pins are on the **socket**, flat contact pads are on the CPU. **Intel uses LGA** (LGA 1700, LGA 1851). More fragile sockets; bent socket pins = motherboard replacement.
• **PGA (Pin Grid Array)** — pins are on the **CPU**, holes in the socket. **AMD traditionally used PGA** (AM4 — Ryzen 1000 through 5000). Bent CPU pins can sometimes be straightened with care.
• **AMD AM5 (Ryzen 7000+) switched to LGA** — same mechanism Intel uses.
• **BGA (Ball Grid Array)** — CPU soldered to the motherboard (laptops, SoCs). Not replaceable.

**ZIF (Zero Insertion Force)** — the lever mechanism on LGA/PGA sockets that releases contact pressure so the CPU drops in without force. ALWAYS lift the lever before inserting; never force a CPU.

**Socket naming shorthand:**
• Intel: **LGA 1700** = 1700 pins on the socket. Compatible with 12th/13th/14th gen Core.
• AMD: **AM4** = one generation of sockets used across multiple CPU generations. **AM5** = current DDR5-era.
• Server/HEDT: **LGA 4189** (Xeon), **sTRX4 / SP5** (Threadripper / EPYC).

**Chipset** — the supporting silicon on the motherboard that connects the CPU to peripherals (USB, SATA, PCIe lanes, network, audio).
• Historically split into **Northbridge** (fast — memory, graphics) and **Southbridge** (slower — SATA, USB, audio).
• **Modern CPUs have absorbed the Northbridge functions** (memory controller, PCIe lanes to GPU). The chipset today is basically what was the Southbridge: called **PCH (Platform Controller Hub)** on Intel, **FCH (Fusion Controller Hub)** on AMD.
• Chipset determines which features the board supports (overclocking, PCIe 4.0/5.0, number of USB ports, etc.). Example Intel 700 series: H770, Z790, B760, H710.

**PCIe lanes and generations:**
• A **lane** = one TX + one RX differential pair. More lanes = more bandwidth.
• Slot widths: **x1, x4, x8, x16**. Physical size matches lane count (with exceptions — some physically-x16 slots are electrically x4).
• **Backward/forward compatible**: a PCIe 4.0 card works in a PCIe 3.0 slot (at 3.0 speed) and vice versa; a smaller card fits in a larger slot (x4 card in x16 slot works fine).

| PCIe Gen | Year | Per-lane speed | x16 total |
|----------|------|----------------|-----------|
| Gen 3 | 2010 | 1 GB/s | 16 GB/s |
| **Gen 4** | 2017 | **2 GB/s** | **32 GB/s** |
| **Gen 5** | 2022 | **4 GB/s** | **64 GB/s** |
| Gen 6 | 2022 (spec) | 8 GB/s | 128 GB/s |

Each generation doubles the previous. A **PCIe 4.0 x4 NVMe SSD = ~7,000 MB/s** sequential.

**Front panel header connectors** (tiny, fiddly pins on the bottom edge of the motherboard):
• **Power SW** — front power button
• **Reset SW** — reset button
• **Power LED** — blue/white front light when on
• **HDD LED** — blinks on disk activity
• **Speaker** — for POST beeps
• **USB 2.0 / USB 3.0 / USB-C front panel headers** — separate multi-pin headers for front ports
• **HD Audio / AC'97 header** — front-panel audio jacks
Polarity matters for LEDs (swap the pins if no light when powered on). The power switch pins can be shorted with a screwdriver to power on a board with no case.` },
        { heading: "CPU Architecture: RISC vs CISC, Cache, HT, Turbo, iGPU, TDP", content: `**Instruction set architectures (ISAs):**
• **x86 / x64 (CISC — Complex Instruction Set)** — Intel, AMD. Complex instructions, fewer instructions per task, power-hungry. Dominant in PCs/servers.
• **ARM (RISC — Reduced Instruction Set)** — Apple Silicon (M1/M2/M3/M4), Snapdragon, Qualcomm, Ampere. Simple instructions, many per task, extremely power-efficient. Dominant in phones, tablets, Apple Macs, growing in servers (AWS Graviton).
• **32-bit (x86)** — max 4 GB RAM addressable. Legacy.
• **64-bit (x64 / x86-64 / AMD64)** — modern standard. Runs both 64-bit and 32-bit applications (unless OS is 64-bit only).

**SoC (System on a Chip)** — CPU + GPU + memory controller + Wi-Fi + cellular + I/O all on one die. Used in phones, tablets, Apple Silicon Macs, Raspberry Pi. Not upgradeable — the whole system is fixed at manufacture.

**CPU cache** — tiny, ultra-fast memory on the CPU die. Hierarchical:
| Level | Size per core | Speed | Scope |
|-------|---------------|-------|-------|
| **L1** | 32–80 KB | ~1 ns | Per-core, split instruction/data |
| **L2** | 256 KB – 2 MB | ~3 ns | Per-core |
| **L3** | 8–128 MB (modern) | ~10 ns | **Shared across all cores** |

Larger/faster cache = better performance, especially for gaming (AMD's "X3D" chips stack extra L3 cache). Main RAM latency is ~100 ns, so cache hits are 10–100× faster than RAM.

**Hyper-Threading (Intel) / SMT (Simultaneous Multithreading — AMD)** — each physical core presents itself to the OS as **two logical cores**. Wastes less of the core's execution units when one thread stalls. A 6-core / 12-thread CPU has 6 physical cores and 12 logical threads.

**Turbo Boost (Intel) / Precision Boost (AMD)** — automatic, short-term overclocking. When thermal/power headroom allows, cores temporarily run above base clock. Example: a 3.6 GHz base CPU might burst to 5.0 GHz on one or two cores during a single-threaded task.

**Overclocking** — manually running a CPU or RAM above factory specs. Requires unlocked CPU (Intel "K" SKUs, all AMD Ryzen), capable motherboard chipset (Intel Z-series, AMD B/X-series), robust cooling, quality PSU. Voids warranty. Generates more heat.

**Integrated graphics (iGPU)** — GPU built into the CPU die. Uses a portion of system RAM as VRAM. Adequate for office work, video playback, light gaming. Saves space/power/cost vs. discrete card.
• Intel calls them **UHD Graphics / Iris Xe / Arc Graphics** depending on gen.
• AMD calls theirs **Radeon Graphics** (integrated) — APUs like Ryzen 5 5600G have strong integrated graphics.
• **"F" SKUs (Intel) / non-G Ryzen** — NO iGPU. Must pair with a discrete card.

**Discrete GPU** — separate card in PCIe x16 slot. Own VRAM (GDDR6/GDDR6X/HBM). Required for gaming, 3D rendering, AI/ML, professional video.

**TDP (Thermal Design Power)** — watts of heat the cooler must dissipate at sustained load. A 125W TDP CPU needs at least a 125W-capable cooler. Modern CPUs often have a higher **PL2 / PPT** boost power (short-term much higher than TDP).

**Multi-socket systems** — server motherboards with 2, 4, or 8 CPU sockets. Doubles/quadruples memory bandwidth and channel count. **NUMA (Non-Uniform Memory Access)** architecture: each CPU "owns" some RAM banks; accessing its own is fast, accessing another CPU's RAM is slower. Applications and OS must be NUMA-aware for best performance.` },
        { heading: "Motherboard Installation, Headers, PCIe Lanes, GPU/Cards, Legacy Buses", content: `**Safety before opening the case:**
1. Power off, **unplug** the PC from AC.
2. **Hold the power button for 5–10 seconds** to drain residual charge from motherboard capacitors.
3. Use an **ESD wrist strap** on a grounded point (bare chassis metal); or touch metal chassis frequently if no strap.
4. **Do NOT disassemble the PSU** — not field-repairable; capacitors hold dangerous voltage.
5. Handle components **by the edges or plastic parts** — never touch pins or contacts.

**Motherboard installation sequence:**
1. **Review documentation** — especially jumper settings (modern boards mostly use BIOS/UEFI instead).
2. **Install the I/O shield** in the case before the motherboard. Snap it in from inside the case.
3. **Insert standoffs** into the case at positions matching the motherboard's mounting holes. **Only where holes exist** — a standoff under bare PCB = short circuit.
4. **Pre-install CPU + RAM + CPU cooler** (easier before the board is in the case).
5. **Align motherboard** over the I/O shield and standoffs; seat carefully.
6. **Screw down without overtightening** — enough to prevent movement; excessive force cracks traces.
7. Connect PSU, drives, fans, front panel headers.
8. **Manage cables** out of airflow paths.

**System clock and clock multipliers:**
• The motherboard has a base **system clock** (measured in MHz/GHz) that synchronizes operations.
• **Clock multipliers** step this base clock up to different frequencies for different buses (CPU base × multiplier = CPU clock speed).
• This is why overclocking often involves adjusting the BCLK (base clock) or the CPU multiplier.

**M.2 key detail not covered earlier:**
• **M.2 powers the drive via the slot itself** — no separate SATA/Molex power cable needed. The slot supplies both data and power.

**PCIe throughput table** (cumulative per direction, after encoding overhead):

| Version | GT/s per lane | GB/s at x1 | GB/s at x4 | GB/s at x16 |
|---------|---------------|------------|------------|-------------|
| **Gen 2** | 5 | 0.5 | 2 | **8** |
| **Gen 3** | 8 | ~1 | ~4 | **~16** |
| **Gen 4** | 16 | ~2 | ~8 | **~32** |
| **Gen 5** | 32 | ~4 | ~16 | **~64** |
| Gen 6 | 64 | ~8 | ~32 | ~128 |

**PCIe up-plugging & down-plugging:**
• **Up-plugging** — placing a card with fewer lanes into a slot with more lanes (e.g., an **x8 card into an x16 slot**). Works fine; card operates at its own lane count (x8). Sometimes the slot auto-downshifts to x1 if BIOS detects a mismatch.
• **Down-plugging** — placing a larger card into a smaller open-back slot (e.g., an **x16 card into an x8 slot with an open-ended rear**). Physically possible if the slot is open-ended; card runs at x8 speed.
• **Up-plugging is always safe; down-plugging requires an open-back slot.**

**PCIe power delivery:**
• **PCIe x16 graphics slot** delivers up to **75W** to the card.
• **Other PCIe slots** deliver up to **25W**.
• **PCIe supplementary power connector** adds another **75W (6-pin)** or **150W (8-pin / 6+2)**.
• Modern high-end GPUs (300W+) require multiple supplementary connectors or the newer **12VHPWR / 16-pin** connector (up to 600W).

**PCIe lane sharing** — having 4 physical PCIe slots + 3 M.2 slots doesn't mean all can run at full lane count simultaneously. Many boards **share lanes** — plugging in the 2nd M.2 drops the second PCIe slot to x4 (or disables it entirely). Check the motherboard manual for "shared with" notes on each slot.

**Legacy PCI bus** (exam still mentions it):
• **32-bit, parallel, 33.3 MHz clock, ~133 MB/s** maximum throughput.
• **PCIe is software-compatible with PCI** — BIOS can present PCIe as PCI to legacy OSes. But **PCI cards do NOT fit in PCIe slots** physically.
• **Keying**: early PCI was 5V; later cards 3.3V; dual-voltage cards have both notches. Wrong-voltage cards won't fit.

**Motherboard headers** (front-panel connectors):
| Header | Pins | Purpose |
|--------|------|---------|
| **Power Switch** | 2 | Sends signal to OS ("soft power"); hold 5s bypasses OS and cuts power |
| **Reset Switch** | 2 | Immediate hard reset |
| **Power LED** | 2 (polarity matters) | Front panel power indicator |
| **HDD LED** | 2 (polarity matters) | Blinks on disk I/O |
| **Speaker** | 4 | POST beeps |
| **USB 2.0 header** | **9 pins** (4+4+1 key pin) | Supports **up to 2 USB 2 ports** |
| **USB 3.x header** | **20 pins** (2×10) | Supports up to 2 USB 3 ports |
| **USB-C front header** | Varies | Newer boards; carries USB 3/USB4 |
| **HD Audio** / **AC'97** | 10 pins | Front panel 3.5mm audio jacks (HD Audio newer; AC'97 legacy) |

**Fan headers — 3-pin vs 4-pin:**
| Header | Control method | Notes |
|--------|---------------|-------|
| **3-pin** | Voltage control (DC mode) | Older. Speed varies with supplied voltage. |
| **4-pin PWM** | Pulse Width Modulation | Blue wire carries PWM signal. Precise speed control; the norm today. |

**Interoperability**:
• **3-pin fan in 4-pin header** → works, runs full speed (can't PWM control without the 4th wire). Some boards can fall back to voltage control in BIOS.
• **4-pin fan in 3-pin header** → works, but runs full speed (no PWM signal present).

**Expansion cards — key specifics:**
• **GPU / Video card**:
  — Uses **PCIe x16** slot for bandwidth.
  — Has own **GDDR memory (graphics DDR)** — separate from system RAM. Optimized for high-bandwidth parallel access.
  — Typical amounts: **8–12 GB (mid-range)**, **16–24 GB (high-end)**, **32–48+ GB (workstation/AI)**.
  — Low-end / integrated GPUs use **shared system RAM** as VRAM.
  — Output ports: HDMI, DisplayPort, sometimes USB-C (DisplayPort Alt Mode / Thunderbolt).

• **Capture card**:
  — **Game capture card** — records/streams gameplay via HDMI pass-through
  — **HDMI capture card** — general video capture (consoles, camcorders, cameras)
  — **TV tuner card** — receives/records over-the-air or cable TV
  — **Internal** (PCIe) — lower latency, higher quality, professional use
  — **External** (USB/Thunderbolt) — portable, easy install, casual/mobile use

• **Sound card**:
  — **3.5mm audio jack** (aka "phone plug", "mini TRS connector") — standard analog audio connector.
  — PCIe/PCI card provides **better audio quality + additional features** vs. onboard audio chip.
  — May include onboard flash memory (**wavetables** for MIDI).
  — Multi-channel output: **mono, stereo (2.0), 2.1 (adds subwoofer), 5.1 (surround), 7.1 (extended surround)**.

• **Network Interface Card (NIC)**:
  — **Ethernet NIC** — adds a different network type (copper vs fiber), additional ports, or replaces a failed onboard adapter.
  — **NIC teaming / bonding** — combining multiple physical ports into one logical high-bandwidth link (also provides redundancy). Common in servers.
  — **Wi-Fi NIC** — supports various **802.11 standards**; some also support **cellular data** (WWAN).` },
        { heading: "DVI Types, VGA, Serial/PS/2, Adapters (Lesson 2C detail)", content: `**DVI — five types total**, identified by pin count/layout on the port:

| DVI Variant | Signals | Pin Layout | Resolution |
|-------------|---------|------------|------------|
| **DVI-A** | Analog only | Has flat blade + 4 surrounding pins, no digital pins | Max ~1920×1200 analog |
| **DVI-D Single-Link** | Digital only | 18 digital pins + flat blade | 1920×1200 @ 60Hz |
| **DVI-D Dual-Link** | Digital only | 24 digital pins + flat blade | **2560×1600 @ 60Hz** |
| **DVI-I Single-Link** | Both analog + digital | 18 digital pins + flat blade with 4 analog pins around it | 1920×1200 |
| **DVI-I Dual-Link** | Both | 24 digital pins + 4 analog pins | 2560×1600 |

**"Dual-link"** = second set of TMDS pairs for double bandwidth. Look at the pin cluster: single-link has a visible gap in the middle of the pins; dual-link fills it in.

**Passive adapter rules** (signal type must match):
• DVI-I → VGA: **passive** works (DVI-I carries analog on the 4 extra pins)
• DVI-D → VGA: **requires active converter** (no analog in DVI-D)
• DVI-D → HDMI: **passive** works (both are digital TMDS — same base signaling)
• HDMI → VGA: **requires active converter** (digital → analog)
• DisplayPort → HDMI: passive works if the DP port is "dual-mode" (DP++); else needs active.

**VGA (Video Graphics Array)** — legacy analog:
• **15-pin D-shell (DE-15 / HD15)** connector, **blue** housing, thumb screws on the cable.
• Analog RGB + horizontal/vertical sync.
• **Supports up to ~1920×1080 (Full HD)** depending on cable quality and length.
• Being phased out; many new systems ship without VGA.

**Serial ports (RS-232):**
• Transmits one bit at a time over a single wire; **start/stop/parity bits** format and verify each transmitted frame.
• **Data rate up to ~115 Kbps** (115,200 baud).
• **RS-232 standard specifies a 25-pin interface** (DB-25), but PCs almost always use the cheaper **9-pin D-subminiature (DB9)** female port.
• Windows calls the serial port a **COM port** (COM1, COM2, etc.).
• **Uses today**: console cables for network switches/routers/firewalls, some industrial/lab equipment, legacy barcode scanners and scales.

**PS/2 ports** (legacy keyboard/mouse):
• **6-pin mini-DIN connector**, color-coded:
  — **Green = mouse**
  — **Purple = keyboard**
• Pre-USB era; some motherboards still include **one combo PS/2 port** (usually purple with a green rim — works with either).
• Not hot-swappable — plug before boot.

**Adapter cables — active vs. passive:**
| Type | Does | Example |
|------|------|---------|
| **Passive** | Only converts connector type; signal passes unchanged | USB-A ↔ USB-C; DVI-D ↔ HDMI; DVI-I ↔ VGA |
| **Active** | Contains circuitry that **converts the signal** (digital ↔ analog, or between protocols) | HDMI → VGA; DisplayPort → VGA (from non-DP++ source); HDMI → Component |

**USB hub** — multiplies one USB port into several. **Powered (AC adapter)** vs **bus-powered**. High-draw devices (external HDDs) need a powered hub. Bus-powered hubs can chain up to 4 levels deep per USB spec.` },
        { heading: "CPU Pipeline, SMP vs CMP, Virtualization Extensions, Vendor Lineups", content: `**CPU instruction cycle** (the four basic operations per instruction):
1. **Fetch** — Control Unit fetches the next instruction from RAM into the pipeline.
2. **Decode** — Control Unit decodes it and routes to the appropriate execution unit:
   — **ALU (Arithmetic Logic Unit)** — integer math, logic ops
   — **FPU (Floating-Point Unit)** — decimal math
3. **Execute** — the ALU/FPU runs the instruction.
4. **Write-back** — result goes to a register, cache, or RAM.

Modern CPUs **pipeline** these stages: while instruction N is executing, N+1 is decoding, N+2 is fetching. Combined with **superscalar execution** (multiple ALUs) and **out-of-order execution**, a single core processes many instructions per clock.

**Registers** — tiny storage inside the CPU, operates at CPU clock speed. Smallest, fastest storage tier above L1 cache.

**x86 vs x64 — details:**
• **x86 (IA-32)** — 32-bit instruction set, addressing, and registers. **Maxes out at 4 GB RAM**.
• **x64 / x86-64 / AMD64 / Intel 64 (EM64T)** — 64-bit extension. Developed by AMD first as **AMD64**, adopted by Intel. Handles 64-bit instructions AND can run 32-bit code.
• **Compatibility rule**: A 64-bit OS runs both 32-bit and 64-bit applications. A 32-bit OS **cannot run** 64-bit apps.
• **Device drivers MUST match the OS architecture** — 64-bit OS needs 64-bit drivers.
• **Windows 11, current macOS, and modern Linux** are all 64-bit only. 32-bit OSes are effectively obsolete.

**DEP (Data Execution Prevention)** — security feature paired with 64-bit. Marks memory regions as non-executable; attempts to run code from data regions are blocked. Protects against buffer-overflow exploits. AMD calls it **NX (No-eXecute)**; Intel calls it **XD (eXecute Disable)**.

**ARM emulation on Windows / macOS:**
• **Apple Silicon (M1/M2/M3/M4)** runs x86 apps via **Rosetta 2** — translates x86 to ARM at install or run time. Performance penalty is small (Apple optimized it heavily).
• **Windows on ARM** (Surface Pro X, Snapdragon X Elite) — emulates x86/x64 apps with a more significant performance hit. Native ARM64 apps run at full speed.

**Multiprocessing models:**
| Model | Description | Example |
|-------|-------------|---------|
| **Single-core** | One execution unit, one task at a time | 2000s-era budget CPUs |
| **CMP (Chip-level Multiprocessing) = Multicore** | Multiple cores on one die. Most common today. | Core i7-14700K (20 cores) |
| **SMP (Symmetric Multiprocessing)** | Multiple **physical CPU packages** in multi-socket motherboard. All CPUs must be **identical model/spec**. Servers/workstations. | Dual Xeon, dual EPYC |
| **AMP (Asymmetric Multiprocessing)** | Different CPU types for different roles (rare in PCs, used in embedded) | big.LITTLE, Intel P+E cores |

**Intel's P-core / E-core hybrid (Alder Lake+)** — mixes high-performance "P-cores" with efficient "E-cores" on one die. OS scheduler (Windows 11's Thread Director) assigns tasks appropriately. Similar to ARM big.LITTLE.

**nC/nT notation** — e.g., **8C/16T** = 8 physical cores, 16 threads (with HT/SMT enabled).

**Hyper-Threading / SMT practical impact:**
• Useful when one thread stalls on memory access — the other thread uses the idle execution units.
• Gains in **multithreaded workloads**: 20–30% extra throughput on heavily threaded code (video encode, rendering).
• **Minimal gain for single-threaded apps** (games); can sometimes hurt (rare).
• Disable HT in BIOS if doing security-sensitive work (Spectre/Meltdown-style side channels).

**Virtualization hardware features** (must be enabled in BIOS to use hypervisors):
• **Intel VT-x / AMD-V** — CPU instruction-level virtualization. Without this, hypervisors can't run hardware-accelerated VMs.
• **Intel VT-d / AMD-Vi (IOMMU)** — Input/Output Memory Management Unit. Allows direct device passthrough to VMs (GPU passthrough for gaming VMs, PCIe device assignment in servers).
• **SLAT (Second Level Address Translation)** — hardware-accelerated page table translation for VMs. Intel: **EPT (Extended Page Tables)**. AMD: **RVI (Rapid Virtualization Indexing) / NPT (Nested Page Tables)**. Massive performance boost for VMs vs. software-only paging.

**CPU socket specifics — full picture:**

**Intel desktop sockets (LGA = pins on socket):**
| Socket | Generation | Memory | Notes |
|--------|-----------|--------|-------|
| **LGA 1151** | 6th–9th gen Core | DDR4 | Legacy consumer |
| **LGA 1200** | 10th–11th gen (Comet Lake, Rocket Lake) | DDR4 | Recent consumer |
| **LGA 1700** | 12th–14th gen (Alder/Raptor Lake) | DDR4 OR DDR5 | Current mainstream |
| **LGA 1851** | 15th gen+ (Core Ultra / Arrow Lake) | DDR5 | Newest |
| **LGA 3647** | Older Xeon Scalable | DDR4 | Enterprise |
| **LGA 4189** | Xeon Scalable (Ice Lake) | DDR4 | Enterprise |
| **LGA 4677** | Newer Xeon | DDR5 | Enterprise |

**AMD sockets:**
| Socket | Type | Generation | Memory | Notes |
|--------|------|------------|--------|-------|
| **AM4** | PGA | Ryzen 1000–5000 | DDR4 | Longest-lived consumer socket ever — unusual for AMD |
| **AM5** | **LGA** (switch!) | Ryzen 7000+ | DDR5 only | Current consumer |
| **TR4 / sTRX4** | LGA | Threadripper 1st–3rd gen | DDR4 | HEDT |
| **sTR5** | LGA | Threadripper 7000 | DDR5 | Current HEDT |
| **SP3** | LGA | EPYC 1st–3rd gen (Naples, Rome, Milan) | DDR4 | Server |
| **SP5** | LGA | EPYC 4th gen+ (Genoa, Bergamo, Turin) | DDR5 | Current server |

**CPU installation detail:**
1. **Align pin 1 / triangle marker** on the CPU with the socket's indicator (usually a small triangle or missing pin corner). Do NOT force — CPU drops in with gravity alone thanks to ZIF.
2. Close the retention arm. You'll feel resistance as the ZIF clamps the pins.
3. Apply thermal paste: **pea-sized drop** in the center, or an **"X" pattern** of four small lines. **Don't over-apply** — excess paste can overflow onto the socket and short contacts.
4. Attach cooler, connect to CPU_FAN header.

**Removing CPU + cooler:**
• Gently **twist** the heatsink to break the thermal-paste bond before lifting — pulling straight up can yank the CPU out of the (unlocked) socket and bend pins.
• **Release the CPU retention latch BEFORE removing** the CPU.

**Intel Core lineup** (current; know the tier hierarchy):
| Tier | Target user | Cores (typical) |
|------|-------------|-----------------|
| **Celeron / Pentium** | Entry / budget | 2–4 |
| **Core i3** | Entry mainstream | 4–6 |
| **Core i5** | Mainstream | 6–14 |
| **Core i7** | High-end enthusiast | 8–20 |
| **Core i9** | Enthusiast / content creator | 16–24 |
| **Core Ultra** | Newer branding for 15th gen+ | varies |
| **Xeon W** | Workstation | 8–60 |
| **Xeon Scalable / Platinum** | Server | 8–128 |

**AMD lineup:**
| Tier | Target user | Cores (typical) |
|------|-------------|-----------------|
| **Athlon** | Entry / budget | 2–4 |
| **Ryzen 3** | Entry mainstream | 4 |
| **Ryzen 5** | Mainstream | 6–8 |
| **Ryzen 7** | High-end | 8–12 |
| **Ryzen 9** | Enthusiast | 12–16 |
| **Threadripper** | HEDT / workstation | 24–96 |
| **Threadripper PRO** | Pro workstation | up to 96 |
| **EPYC** | Server | 16–192 |

**Use-case matching:**
• **Office productivity / web browsing** → Core i3 / Ryzen 3 or 5, integrated graphics, 16 GB RAM
• **Gaming** → high single-core clock + iGPU/discrete GPU. Core i5/i7, Ryzen 5/7.
• **Content creation / video editing** → high core count + lots of RAM. Core i9, Ryzen 9.
• **Virtualization / many VMs** → highest core count + SMT + ECC RAM. Threadripper, Xeon, EPYC.
• **3D rendering / AI** → high core count + strong discrete GPU(s).
• **Mobile / tablet** → ARM SoC. Power efficiency priority over raw speed.

**Mobile / laptop CPU considerations:**
• Usually **soldered (BGA)** to the laptop motherboard — **not upgradeable**.
• Lower TDP: 15 W (ultraportable) to 45–55 W (gaming laptop). Desktop 65–250 W.
• Different naming suffixes: Intel **U** (ultra low power), **P** (balanced), **H** (high performance); AMD **U** (ultra-low), **HS** (thin gaming), **HX** (extreme).` },
        { heading: "BIOS/UEFI In Depth (Lesson 4A) — Setup, Passwords, Secure Boot, TPM", content: `**Firmware basics:**
• **Firmware** — program code stored in flash memory on the motherboard that initializes hardware before the OS loads.
• **BIOS (Basic Input/Output System)** — legacy firmware standard. 16-bit, text UI, limited features.
• **UEFI (Unified Extensible Firmware Interface)** — modern replacement. Advantages over BIOS:
  — Supports **64-bit CPU operation** from firmware level
  — **Graphical interface with mouse support**
  — **Networking at boot** (PXE integration, firmware update over network)
  — **Secure Boot** for boot integrity
  — Supports **larger boot drives** (>2.2 TB via GPT) — BIOS/MBR caps at 2.2 TB
  — Faster boot
  — Can **still boot in legacy BIOS mode** (CSM — Compatibility Support Module) for old OSes

**Entering firmware setup:**
• Press a key during boot — usually when the vendor logo appears.
• Common keys: **Esc, Del, F1, F2, F10, F12**. Varies by manufacturer (check manual).
• Modern systems boot so fast you may miss the key window — use Windows alternative: **Shift+click "Restart"** on the login/Start menu → Troubleshoot → Advanced options → UEFI Firmware Settings.

**BIOS setup navigation** (legacy, keyboard-only):
• Arrow keys to move, Enter to select, **Esc** to go back.
• Save+Exit or Discard+Exit options, often F10 for save.
• **"Load default settings" / "Optimized defaults"** — reverts to factory defaults.
• UEFI adds mouse support but some advanced menus are still keyboard-only.

**Boot order / boot device priority** — the order firmware searches for a bootable device:
• **Fixed disks (HDD/SSD)** — OS drive. For SATA, **connect boot disk to the lowest-numbered SATA port** (SATA0). NVMe M.2 drives are usually labeled separately.
• **Optical drive** — for OS install/repair from DVD
• **USB** — for OS installer media, Windows PE, live Linux
• **Network / PXE (Preboot eXecution Environment)** — boots from a network server (TFTP-served boot image); used in enterprise imaging/deployment
• Press **F12 (or similar) at boot** for a **one-time boot menu** without altering the default order.

**USB permissions** — firmware can enable/disable individual USB ports or all USB ports as a security control. Used in environments where USB storage is a data-loss risk.

**Fan / cooling presets** — BIOS fan control typically offers:
| Mode | Behavior |
|------|----------|
| **Balanced** | Default — moderate noise/cooling |
| **Cool / Performance** | High RPM always — max cooling, loudest |
| **Quiet / Silent** | Lower RPM — accepts higher temps for quieter operation |
| **Fanless** | Disables fans — passive cooling only (risky) |
| **Custom / PWM curve** | User-defined temperature-to-RPM mapping |

**Duty cycle** — for PWM fans, the percentage of "on" time per cycle. Higher duty cycle = faster fan. Many BIOSes let you plot temp-vs-duty cycle curves.

**Temperature monitoring**:
• **In BIOS/UEFI** — sensors show CPU, motherboard, VRM temps in real time.
• **In OS** — third-party utilities (HWMonitor, Core Temp, HWiNFO) read the same sensors while the system runs normally.

**Firmware passwords — two distinct types** (IMPORTANT for exam):
| Password type | Also called | What it protects |
|---------------|-------------|------------------|
| **Supervisor / Setup / BIOS / Admin** | Config password | Access to the BIOS/UEFI setup program — system can still boot |
| **User / System / Boot / Power-on** | System password | Locks the entire system — nothing boots until unlocked |

• **Supervisor password** is for administrators; **System/User password** is for the person sitting at the machine.
• If you set a system password, you must share it with every user of the machine — undermines security for shared workstations.
• **Forgotten BIOS password reset**: usually remove the CMOS/CR2032 battery for a few minutes, or move the **CLR_CMOS jumper** on the board. Sometimes also just unplugging power for several minutes.

**Secure Boot**:
• UEFI feature that prevents malware from loading before the OS.
• Firmware verifies the **bootloader's digital signature** against pre-installed **platform keys (PKs)** and **key exchange keys (KEKs)**.
• **Pre-loaded keys** from Microsoft (Windows bootloaders), Fedora, openSUSE, Ubuntu (signed Linux bootloaders via shim).
• Unsigned or modified bootloaders **will not execute** — boot fails / rolls to recovery.
• Can be **disabled in BIOS** (required to boot some Linux distros or old OSes).
• **Windows 11 requires Secure Boot AND TPM 2.0** to install.

**Secure Boot + UEFI is the modern boot environment.** "Legacy Boot" / "CSM" boots the older MBR/BIOS way — needed for very old OSes or some dual-boot setups.

**Encryption vs Hashing** (related to TPM):
| Technique | Purpose | Reversible? |
|-----------|---------|-------------|
| **Encryption** | Confidentiality — scramble data so only key holder reads it | **Yes** with the decryption key |
| **Hashing** | Integrity — generate a fingerprint to detect tampering | **No** — one-way function |

**TPM (Trusted Platform Module) — what it really does:**
• Hardware chip (or firmware emulation — **fTPM** on AMD, **PTT / Platform Trust Technology** on Intel) on the motherboard.
• Stores **cryptographic keys, digital certificates, hashed passwords** in tamper-resistant hardware isolated from the OS.
• **Endorsement Key (EK)** — a **unique, unchangeable** private key burned into each TPM chip at manufacture. Establishes the TPM's identity / root of trust.
• **Measured boot** — during boot, TPM hashes firmware, bootloader, and OS kernel. Stored values compared across boots; tampering is detected.
• Used by **BitLocker** to seal disk-encryption keys — the TPM only releases the keys if boot measurements match (system unchanged). Move the disk to another machine → TPM doesn't have the keys → BitLocker recovery mode.
• Manageable from BIOS (enable/disable/clear) and OS (Windows Device Manager / tpm.msc).
• **TPM 2.0** is the current standard. **TPM 2.0 is REQUIRED for Windows 11.**
• Older **TPM 1.2** exists in legacy systems — not Windows 11 compatible.

**HSM (Hardware Security Module) — as defined by CompTIA for this exam:**
• A **dedicated, tamper-resistant device** for cryptographic key generation/storage/use.
• **Can be a USB thumb drive / smart card** — portable, "bring your keys with you."
• Also comes as **PCIe cards** and **network-attached appliances** for enterprise PKI.
• Usually requires authentication (PIN, password, fingerprint) to unlock.
• Use cases:
  — Portable key backup if motherboard TPM is damaged / drive moved to new PC
  — Computer doesn't have a TPM
  — Enterprise certificate signing (code signing, PKI)
  — Payment processing (PIN encryption for EMV)
• **Difference from TPM**: TPM is soldered on board, one per machine. HSM is typically **removable/portable** and may serve many computers.` }
      ]},
      { title: "3.6 — Power Supplies", sections: [
        { heading: "PSU Connectors, Efficiency & Types", content: `**AC input voltage:**
• **110–120 VAC** — North American standard
• **220–240 VAC** — most of Europe, Asia, Australia
• **Dual-voltage PSU** — most modern units auto-sense. Older PSUs have a red slider switch on the rear (115/230). **Setting the switch wrong will fry the PSU** (115 fed with 230V) or fail to power on (230 fed with 115V).

**DC output voltage rails:** +3.3V (board, RAM), +5V (USB, SATA), +12V (CPU, GPU, fans — carries most of the power).

**Connectors:**
• **20+4 pin ATX (aka "24-pin")** — main motherboard power. The 4-pin section detaches so the connector works with older 20-pin boards
• **4+4 / 8-pin EPS** — CPU power (12V)
• **6-pin PCIe** — 75W to GPU | **6+2-pin (8-pin) PCIe** — 150W to GPU
• **SATA power** — 15-pin for drives
• **Molex** — 4-pin legacy

**PSU types:** Non-modular (all cables fixed, cheap), semi-modular (essential fixed, others removable), fully modular (all detachable, best cable management).

**Wattage rating** — the maximum power (in watts) the PSU can deliver. Calculate system draw (CPU TDP + GPU TDP + drives + fans + overhead) and size PSU with **~30% headroom** above peak draw. Undersized PSU = random shutdowns under load, instability, premature failure. Oversized is fine (PSU only draws what components need) but wastes money and runs less efficiently at very low loads.

**80 Plus certification** [NEW] — rates efficiency at 20%, 50%, 100% load. Figures are **minimum efficiency floor**:
• 80 Plus (80%), Bronze (82%), Silver (85%), Gold (87%), Platinum (89%), Titanium (90%+)
• At 50% load: Gold=90%, Platinum=92%, Titanium=94%
• Higher efficiency = less waste heat, lower electricity cost

**Redundant PSU** — two hot-swap PSUs in one system. Enterprise/server only.` }
      ]},
      { title: "3.6 Deep Dive — CertMaster Additions", sections: [
        { heading: "Cooling Systems (Air, AIO, Custom Loop) & Certifications", content: `**Air cooling (by far most common):**
• **Heat sink** — finned metal block that absorbs heat from the CPU/GPU and dissipates it to the surrounding air. Usually aluminum fins on copper heatpipes.
• **Heatpipe** — sealed tube containing a working fluid that evaporates at the hot end (near CPU), condenses at the cold end (in the fins), and wicks back. Very efficient passive heat transport.
• **Fan** — forces air through the heat sink fins. Rated in **CFM (airflow)** and **dBA (noise)**. 4-pin PWM fans allow the motherboard to control speed by temperature; 3-pin fans run at a fixed voltage.
• **Thermal paste (TIM — Thermal Interface Material)** — fills microscopic gaps between the CPU IHS (integrated heat spreader) and the heatsink cold plate. Apply a pea-sized drop in the center; the pressure of installation spreads it. Reapply every few years or when reseating a cooler.
• **Thermal pads** — pre-formed silicone/ceramic pads used where a specific thickness gap must be filled (VRM, RAM chips, SSD controllers, laptop heatsinks). Simpler than paste for those use cases, doesn't pump out over time. Common on laptops and GPUs.

**Liquid cooling — two flavors:**
• **AIO (All-In-One) liquid cooler / closed-loop** — sealed pre-assembled unit: cold plate + pump + tubes + radiator + fans. No maintenance, factory-filled. Most consumers who go liquid use these. Sizes: 120mm, 240mm, 280mm, 360mm, 420mm radiators (by fan-slot width).
• **Custom / open loop** — enthusiast builds with separate pump, reservoir, GPU blocks, CPU blocks, quick-disconnects, tubing. Higher performance, requires fluid top-off every 6–12 months, risk of leaks. Not common outside enthusiast builds.

**Choosing cooling for a CPU**: Match the cooler's TDP rating to the CPU's TDP **plus headroom for overclocking/boost**. A 125W-TDP CPU under sustained load often draws 200W+; a 250W-rated 240mm AIO is safer than a 150W-rated tower cooler.

**Case airflow** — typically **positive pressure** (more intake than exhaust) to reduce dust ingress through unfiltered gaps. Dust filters on intakes. Cables managed out of airflow paths.

**Energy Star** — US EPA certification for energy-efficient electronics. Energy Star–qualified PSUs / PCs / monitors meet strict efficiency and standby-power standards. Unrelated to but complementary to 80 Plus (Energy Star covers the whole system's energy use; 80 Plus is just PSU efficiency at load).

**EPEAT** — similar rating for environmental impact (materials, recyclability). Required by many government procurement contracts.

**UPS (Uninterruptible Power Supply)** — not in 3.6 strictly but appears in the same module. Battery backup that gives you time to safely shut down during a power outage. Types: **Standby** (cheapest, brief switchover gap), **Line-Interactive** (regulates minor voltage sags without battery), **Online Double-Conversion** (always runs off battery, zero transfer time — for critical servers). Size by **VA** (volt-amps) and runtime needed.` },
        { heading: "PSU Internals, Rails, 80 PLUS Thresholds, Open-Loop Detail", content: `**PSU internal components** (inside the sealed unit):
• **Rectifier** — converts AC wall power to DC
• **Transformer(s)** — steps voltage down
• **Voltage regulator(s)** — maintains consistent DC output under varying load
• **Filters / capacitors** — smooth ripple from the rectifier
• **Fan** — dissipates heat from the regulators and transformer

**AC input voltage — tolerance ranges**:
• **Low-line: 100–127 VAC** (North America, Japan) — nominal 120V
• **High-line: 220–240 VAC** (Europe, Asia, Australia) — nominal 230V
• **Dual-voltage / autoswitching PSUs** — sense and adapt automatically. Most modern.
• **Fixed-voltage PSUs** — built for one region only. Some have a manual slider switch (115/230) on the back — **setting wrong = fried PSU (low→high damages) or won't start (high→low)**.

**Why high-line in data centers** — less current for the same wattage = thinner/cheaper wiring and slightly higher PSU efficiency.

**Wattage typical ranges:**
| System type | Typical PSU |
|------------|-------------|
| Basic office PC | 300–400 W |
| Standard desktop | **400–500 W** |
| Mid gaming | 600–750 W |
| High-end gaming | 850–1000 W |
| Workstation / multi-GPU | **1000 W+** (some 1600 W+) |
| Component CPU alone | 17–100+ W |

**Undersized PSU symptoms**:
• Random shutdowns/reboots under load
• Can't POST with new high-draw component installed
• Component damage from sustained over-spec operation

**P1 connector wire colors** (24-pin ATX):
| Color | Voltage |
|-------|---------|
| **Black** | Ground (GND) |
| **Orange** | +3.3V |
| **Red** | +5V |
| **Yellow** | **+12V** (the one that matters — most power) |
| Blue | −12V (very low current, ~0.8A, rarely used) |
| Purple | +5V standby (keeps chipset/USB/LAN alive with system "off") |
| Green | PS_ON# (signal — short to ground to turn the PSU on; "paperclip test") |
| Gray | Power Good / Power OK |
| White | −5V (legacy, often missing) |

**Power rail example distribution** (why +12V is king):

| Rail | Max Load | Max Wattage |
|------|----------|-------------|
| +3.3 V | 20 A | 130 W combined |
| +5 V | 20 A | with +3.3V limit |
| **+12 V** | **33 A+** | **~396 W+** (most of the PSU's total wattage) |
| −12 V | 0.8 A | 9.6 W |
| +5 V standby | 2.5 A | 12.5 W |

**Exam tip**: +3.3V and +5V often share a combined wattage limit. CPU and GPU draw almost entirely from +12V.

**20+4 pin adapter** — older 20-pin motherboards can use a 24-pin cable by leaving the extra 4-pin block detached. Newer PSUs always ship with the 24-pin as two-piece (20+4) for backward compatibility.

**80 PLUS certification — exact thresholds** (memorize the ~rounded Gold/Platinum numbers):

| Rating | @ 10% load | @ 20% load | @ 50% load | @ 100% load |
|--------|-----------|-----------|-----------|-------------|
| **80 PLUS** (white) | — | 80% | 80% | 80% |
| **Bronze** | — | 82% | 85% | 82% |
| **Silver** | — | 85% | 88% | 85% |
| **Gold** | — | **87%** | **90%** | **87%** |
| **Platinum** | — | 90% | 92% | 89% |
| **Titanium** | **90%** | 92% | **94%** | 90% |

**ENERGY STAR 80 PLUS baseline**: at least **80% efficient at 20–100% load**.

A 300 W system running on a 75% efficient PSU actually draws 400 W from the wall (100 W wasted as heat). At 94% Titanium efficiency, same load draws only ~320 W.

**Redundant PSU mechanics**:
• Two PSUs mounted in a shared bay, each plugged into separate circuits.
• Both connect to a **backplane** — circuit board that handles failover automatically.
• **Hot-swappable** — pull failed PSU, replace without powering down the server.
• Standard in enterprise servers / NAS; rare in desktops.

**Heat sink types:**
• **Passive heat sink / heat spreader** — no fan. Just finned metal. Used on RAM ("memory heat spreaders"), chipsets, M.2 drives. Relies on case airflow.
• **Active heat sink** — has a fan. Used on CPUs, GPUs, some chipsets with integrated graphics.
• **Copper vs aluminum** — copper transfers heat better but is heavier/costlier. Premium coolers use a copper base and aluminum fins.

**Heat sink retention mechanisms** (CPU):
• **Push pins** (older Intel stock) — half-turn the screwdriver slot to release/lock.
• **Backplate + screws** — most aftermarket coolers and modern AMD. Stronger, for heavier coolers.
• **Retention clip/lever** (AMD AM4 stock) — hooks over tabs on the socket frame.

**Fan airflow and case design:**
• Case airflow: front intake → across components → rear/top exhaust.
• **Thermometer sensors** at fan locations let the motherboard auto-adjust fan speeds (via 4-pin PWM) and detect fan failure (triggers an alarm/BIOS warning).
• **Plastic shrouds/baffles** channel airflow directly over the CPU on some OEM designs.
• **Blanking plates** cover empty expansion card slots to prevent air leakage (preserves positive pressure).

**Dust maintenance:**
• Clean heat sinks, fans, and air vents periodically.
• Use: **compressed air** (quick, effective), **soft brush** (gentle for delicate components), or a **PC-approved vacuum cleaner** (anti-static version to avoid ESD).
• **NEVER** use a regular household vacuum on electronics — generates static electricity.
• **Hold fans still** when blowing compressed air through them — spinning a fan backward can damage bearings and generate voltage.

**Open-loop vs. closed-loop liquid cooling:**
| Feature | Open-loop (custom) | Closed-loop / AIO |
|---------|---------------------|--------------------|
| Components | Reservoir, pump, tubing, water blocks, radiator(s), fans — all separate | Sealed unit: cold plate + pump + tubing + radiator + fans |
| Maintenance | Drain/clean/refill every 6–12 months | **None** (factory-sealed for the unit's life) |
| Cooling capacity | Higher (can cool CPU + multiple GPUs together) | CPU (or GPU) only |
| Risk | Leak risk, more complex to build | Minimal — but pump can fail silently |
| Transport | **Drain before moving the PC** | Safe to move |
| Typical use | Enthusiast / extreme overclocking | Mainstream high-end |

**Sound dampening** — liquid cooling is often quieter than air cooling for the same thermal load, but the pump itself is a small additional noise source.` }
      ]},
      { title: "3.7 — Printers & Settings", sections: [
        { heading: "Printer Types, Settings & Security", content: `**Unboxing & setup location:**
• Remove **all packing tape, foam, and orange shipping locks** before first power-on (laser toner carts often have pull tabs that must be removed)
• Place on **level, sturdy surface** — uneven surfaces cause feed/skew issues
• **Ventilation** — laser printers produce ozone/particulates; don't enclose in a sealed cabinet
• **Away from heat/humidity** — paper absorbs moisture → jams, curl
• **Near a network drop or within Wi-Fi range**; accessible power outlet (UPS for business printers)

**Connectivity:** USB (direct), Ethernet/RJ-45 (network, static IP recommended), Wi-Fi (convenient), Bluetooth (short range, mobile).

**Drivers — PCL vs. PostScript:**
• **PCL (Printer Command Language)** — HP-developed. Faster, lighter, good for general office text and simple graphics. Most common Windows default.
• **PostScript (PS)** — Adobe. Device-independent page description language. Renders complex graphics, fonts, and color **more accurately and consistently across devices**. Standard in graphic design, publishing, Mac environments.
• Always install the **driver matching the OS and architecture** (Windows x64, macOS, Linux). Wrong or generic driver = garbled output.

**Firmware** [NEW]: Printer's embedded software. Update via web interface for bugs, security patches, features.

**Configuration:** Duplex (two-sided), orientation (portrait/landscape), tray selection, quality (draft vs best), color vs monochrome.

**Public / shared devices:**
• **Printer share** — a printer directly connected (USB) to one PC that "shares" it over the network via that PC. The host must be powered on. Simple but fragile.
• **Print server** — dedicated server (or the printer's own built-in server) that queues and dispatches jobs to one or more printers. More reliable for multi-user environments. Windows Server has a Print Management role; many networked printers have an embedded print server.

**Security settings:**
• **User authentication** — login before print/scan/copy
• **Badging** — physical badge tap to release print jobs
• **Audit logs** — track who printed what and when
• **Secure print** — job held until user authenticates at printer

**Scan services:** Scan to email, scan to folder (network share), scan to cloud (OneDrive, Google Drive).

**Scanner types:**
• **ADF (Automatic Document Feeder)** — feeds multiple pages, can do duplex scanning
• **Flatbed** — glass surface, one page at a time. Better for photos, bound documents` },
        { heading: "3D Printers — FDM, SLA & Resin", content: `**3D printing** builds physical objects from digital models, one layer at a time ("additive manufacturing"). Two main technologies for 1201:

**FDM (Fused Deposition Modeling) — filament printers:**
• Most common home/office 3D printer
• Melts **plastic filament** (PLA, ABS, PETG, TPU) and extrudes it through a heated nozzle
• Builds object layer-by-layer on a heated print bed
• **PLA** — biodegradable, easy to print, good for prototypes
• **ABS** — stronger but fumes toxic; needs enclosed printer + ventilation
• **PETG** — balance of durability and ease
• **Layer height** 0.1–0.3 mm — smaller = finer detail, longer print time
• Slow: small objects can take hours; complex large objects take days

**SLA (Stereolithography) — resin printers:**
• Uses **liquid photopolymer resin** cured by UV laser or LCD light
• Higher resolution than FDM — fine detail for jewelry, dental, miniatures
• Post-processing: wash (isopropyl alcohol) + cure under UV light
• Resin is **toxic uncured** — nitrile gloves, mask, ventilation required

**Typical workflow:**
1. **Design or download** a 3D model (.STL, .OBJ, .3MF file)
2. **Slice** — software (Cura, PrusaSlicer, Lychee) converts model to layer-by-layer G-code/instructions
3. **Load filament/resin** and start print
4. **Post-process** — remove supports (FDM), wash + UV-cure (SLA), sand, paint

**Common 3D printer issues:**
| Symptom | Cause |
|---------|-------|
| **First layer not sticking** | Bed not level, bed temp too low, nozzle too far from bed |
| **Stringing / wisps between parts** | Retraction settings, nozzle temp too high, wet filament |
| **Clogged nozzle** | Dust, degraded filament, wrong temp — clean with cold-pull or replace |
| **Warping / lifting corners** | Bed not heated enough, draft cooling part unevenly (ABS) |
| **Layer shift** | Loose belt, stepper motor skipping steps, bed collision |
| **Under/over-extrusion** | Filament diameter mismatch, e-steps miscalibrated, flow rate off |
| **SLA: incomplete cure** | Exposure time too short, expired resin, cold resin |

**Maintenance:**
• **Keep filament dry** — moisture in PLA/PETG/ABS causes stringing, pops, brittleness. Store in sealed containers with desiccant.
• **Level the print bed** regularly (manually or auto-level probe)
• **Clean nozzle** — cold pulls, brass brush; replace if damaged (nozzles are consumables, $5 each)
• **Lubricate rods and lead screws** with PTFE or specialty lube (NOT WD-40)
• **Check belt tension** — too loose = layer shifts; too tight = wear
• **SLA: filter and replace resin** in vat periodically; clean LCD screen

⚠️ **Safety:**
• FDM: hot end reaches 200–260°C — **burn hazard**
• SLA: uncured resin is toxic and a skin/eye irritant — wear PPE
• ABS fumes contain **styrene** — print in ventilated area only
• Never leave a 3D printer unattended for long prints — fire risk from runaway heaters (some printers lack thermal runaway protection)` }
      ]},
      { title: "3.8 — Printer Maintenance", sections: [
        { heading: "Maintenance by Printer Type", content: `**Laser:**
• Replace **toner cartridge** when prints fade (most common maintenance)
• Replace **imaging drum** at recommended page count or when ghosting/lines appear
• Replace **fuser assembly** when toner smudges or doesn't adhere
• Clean or replace **transfer roller**, replace **pickup/separation rollers**
• Apply **maintenance kit** at recommended page count (includes fuser, rollers, separation pad)

**Inkjet:**
• Replace **ink cartridges** (individual colors or combined)
• Run **print head cleaning cycle** (built-in) for streaks/missing colors
• **Calibrate print heads** for alignment issues
• Replace **print head** if cleaning fails

**Thermal:**
• Replace **thermal paper** (heat-sensitive — prints without ink, think receipts)
• Clean **heating element** with isopropyl alcohol
• Replace **feed rollers** if paper doesn't advance

**Impact (dot matrix):**
• Replace **ribbon cartridge** when prints fade
• Replace **print head** if dots are missing
• Uses **multipart paper** [NEW] — carbon copy / NCR paper. This is the **only** printer type that can print multipart forms (physical striking force transfers through layers)` }
      ]},
      { title: "3.8 Deep Dive — CertMaster Additions", sections: [
        { heading: "Printer Internal Components (Laser / Inkjet / Impact / Thermal)", content: `**Laser imaging process — 7 steps in order** (CompTIA **will** test this):

| # | Step | What happens |
|---|------|--------------|
| 1 | **Processing** | Printer receives raw data from computer, rasterizes to a bitmap representing the page |
| 2 | **Charging** | Primary charge roller applies **uniform negative charge** (−600V) across the photosensitive drum |
| 3 | **Exposing** | Laser (or LED array) scans the drum, **discharging** areas where toner should stick (to about −100V) |
| 4 | **Developing** | Toner roller (biased about −200V) attracts toner particles to the less-negative exposed areas on the drum |
| 5 | **Transferring** | Transfer roller underneath the paper carries a **positive charge** that pulls toner off the drum onto the paper |
| 6 | **Fusing** | Fuser unit (heat + pressure rollers, ~200°C / 400°F) **melts toner into the paper fibers**. Permanent bond. |
| 7 | **Cleaning** | Cleaning blade scrapes residual toner off the drum; erase lamp resets the drum to neutral |

Mnemonic: **"People Can Exchange Dollars To Find Change"** (Processing–Charging–Exposing–Developing–Transferring–Fusing–Cleaning) or **"Please Come Every Day To Fresh Cake"**.

**Laser printer components** (serviceable parts):
• **Toner cartridge** — contains toner powder. Some cartridges also include drum, corona wire, cleaning blade (combined; throw-away design).
• **Imaging drum / photosensitive drum (OPC drum)** — coated cylinder that holds the image. Scratches = lines down every printed page.
• **Fuser assembly** — heats and presses toner into paper. Long-life consumable; replaced as part of the maintenance kit.
• **Transfer roller / transfer belt (color laser)** — under the paper path, charges paper to attract toner.
• **Pickup / separation / feed rollers** — rubber rollers that pull paper into the path. Wear down → paper jams, multi-feeds.
• **Maintenance kit** — bundled replacement package (fuser + rollers + separation pad) installed at the manufacturer's rated page count.

**Inkjet printer components:**
• **Ink cartridges** — CMYK (cyan, magenta, yellow, black); photo printers add light cyan/magenta. Individual-color vs. combined-color vs. integrated (cartridge + printhead in one).
• **Printhead** — the nozzle array that sprays ink droplets. Two technologies:
  — **Thermal (bubblejet, HP/Canon)** — heating element vaporizes ink, forming a bubble that ejects a droplet.
  — **Piezoelectric (Epson)** — crystal flexes with voltage, mechanically pushing out ink. More reliable, no heat.
• **Carriage** — the moving assembly that **holds the printhead (and often the cartridges)** and slides horizontally across the paper on a rail. Driven by a belt and stepper motor. If the carriage is stuck/jammed, the printer can't print.
• **Belt / feed rollers** — move paper through the printer one line at a time.
• **Duplexing assembly** — optional unit that flips paper for two-sided printing.
• **Maintenance**: run the built-in **print head cleaning cycle** for streaks; **calibrate (align)** print heads if vertical lines aren't straight; replace cartridges before they run dry to avoid drying out the nozzles.

**Impact (dot-matrix) printer components:**
• **Print head** — array of pins (typically 9, 18, or 24) driven by solenoids. Pins strike ribbon → ink transfers to paper.
• **Ribbon cartridge** — inked fabric ribbon. Only wearing part besides the head. Replace when prints fade.
• **Platen** — **the hard rubber roller behind the paper** that the print head strikes against. Provides the backing resistance for the impact. Worn platens → uneven print darkness.
• **Tractor feed (pin feed)** — sprocketed wheels that engage the **holes on the edges of continuous-form paper** (tractor-feed paper / green-bar paper). Pull paper through precisely for long continuous forms — payroll checks, pick tickets, multi-part invoices.
• **Friction feed** — standard feed using rubber rollers against the platen, for cut sheets. Most impact printers support both feed methods.

**Thermal printer components:**
• **Thermal print head (heating element)** — array of tiny heaters that selectively darken heat-sensitive paper directly (no ink/toner). Used in receipt printers, shipping labels, airline baggage tags.
• **Special thermal paper** — coated with heat-reactive chemicals. Fades over time, especially in sunlight/heat (why old receipts become unreadable).
• **Feed assembly** — rollers advance the paper roll across the head.
• **Maintenance**: clean head with **isopropyl alcohol** (70%+), remove paper dust/lint, replace paper roll. No ink/toner to replace.` }
      ]}
    ]
  },
  {
    id: 4, domain: "Virtualization & Cloud", weight: 11, color: "#bb86fc",
    topics: [
      { title: "4.1 — Virtualization Concepts", sections: [
        { heading: "Hypervisors, Containers & VMs [NEW]", content: `**Hypervisor types** [NEW for 1201]:

| Type | Runs On | Examples | Use Case |
|------|---------|---------|----------|
| **Type 1 (Bare-metal)** | Directly on hardware (no host OS) | VMware ESXi, Hyper-V (server), XenServer | Enterprise/data centers. Best performance |
| **Type 2 (Hosted)** | On top of a host OS | VirtualBox, VMware Workstation, Parallels | Desktop, testing, development |

Type 1 = no OS underneath, directly on hardware. Type 2 = needs an OS first, hypervisor runs on top.

**Containers** [NEW for 1201]:
• Lighter-weight alternative to VMs. Share host OS kernel, isolated app environments.
• Faster start (seconds vs minutes), use less resources. Example: Docker.
• VMs virtualize the **entire machine** (hardware + OS). Containers virtualize only the **application environment**.

**Purposes:** Sandbox/testing (run malware safely, delete VM if infected), test/development (different OSes), application virtualization (run app without installing).

**Resource allocation:** CPU (virtual cores), RAM (dedicated per VM), storage (virtual hard disks as files), network (bridged = own IP, NAT = shares host IP, host-only = isolated).

**VDI (Virtual Desktop Infrastructure):** Desktop environments on central server, streamed to thin clients. Centralized management, security, cheaper hardware.` }
      ]},
      { title: "4.1 Deep Dive — CertMaster Additions", sections: [
        { heading: "Snapshots, CPU Virtualization Extensions & VM Security", content: `**Snapshots / checkpoints** — a point-in-time capture of a VM's state (disk + memory + settings). 
• Take a snapshot **before** a risky change (installing software, OS upgrade). If something goes wrong, revert in seconds.
• Snapshots are NOT backups — they live on the same storage. A host failure loses both the VM and its snapshots.
• Snapshots grow over time (they track disk changes since creation). Don't leave long-lived snapshots — they slow performance and bloat storage.
• **Hyper-V** calls these "checkpoints"; **VMware** calls them "snapshots."

**CPU virtualization extensions** (must be enabled in BIOS/UEFI to run most hypervisors):
• **Intel VT-x** (plus **VT-d** for I/O / device passthrough)
• **AMD-V** (plus **AMD-Vi / IOMMU** for I/O)
• Without these enabled, you may get errors like "this processor does not support VT-x" or "Hyper-V requires hardware virtualization."

**Nested virtualization** — running a hypervisor inside a VM that's already running on a hypervisor. Required for things like Hyper-V in a Windows VM on VMware. CPU and hypervisor must both support it.

**Virtual networking modes** (how a VM talks to the network):
| Mode | Effect |
|------|--------|
| **Bridged** | VM gets its own IP on the physical network (appears as a separate machine) |
| **NAT** | VM shares host's IP, behind an internal NAT (outbound works, inbound needs port forwarding) |
| **Host-only / Internal** | VM can only talk to the host and other VMs; no external network |
| **Not connected** | Isolated for malware analysis |

**VM security considerations** (all three layers need attention):
• **Hypervisor security** — patch the hypervisor; a compromised hypervisor exposes every VM on it.
• **Host security** — the physical machine running a Type 2 hypervisor is a security boundary. If the host OS is malware-infected, all VMs on it are at risk.
• **Guest OS security** — each VM needs its own patching, AV, firewall, authentication — they're full systems.

**Live migration / vMotion** — moving a running VM from one host to another with no downtime. Enterprise feature (VMware vSphere, Hyper-V Live Migration). Requires shared storage and compatible CPUs.` }
      ]},
      { title: "4.2 — Cloud Computing Concepts", sections: [
        { heading: "Service & Deployment Models", content: `**Service models:**

| Model | You Manage | Provider Manages | Examples |
|-------|-----------|-----------------|----------|
| **IaaS** | OS, apps, data, middleware | Hardware, virtualization, network, storage | AWS EC2, Azure VMs |
| **PaaS** | Applications and data only | Everything else (OS, runtime, hardware) | Heroku, Azure App Service, Elastic Beanstalk |
| **SaaS** | Nothing (just use it) | Everything | Microsoft 365, Gmail, Salesforce, Dropbox |

Analogy: IaaS = buy ingredients and cook. PaaS = frozen pizza (add toppings). SaaS = order delivery.

**Deployment models:**
• **Public** — shared, multi-tenant (AWS, Azure, GCP). Pay-as-you-go.
• **Private** — dedicated to one organization. More control, higher cost.
• **Hybrid** — mix of public and private. Most common enterprise model.
• **Community** — shared among orgs with common requirements (government agencies).

**Cloud characteristics:**
• **Shared resources** — multi-tenant, logically isolated
• **Dedicated resources** — single tenant gets exclusive hardware
• **Metered utilization** — pay for what you use
  — **Ingress** [NEW] — data INTO cloud (uploads). Often free.
  — **Egress** [NEW] — data OUT of cloud (downloads). Usually costs money.
• **Rapid elasticity** — scale up/down instantly
• **High availability** — redundant data centers, automatic failover
• **File synchronization** — cloud storage syncs across devices
• **Multitenancy** [NEW] — multiple customers share infrastructure, logically isolated` }
      ]},
      { title: "4.2 Deep Dive — CertMaster Additions", sections: [
        { heading: "Additional Service Models, Scalability vs Elasticity, Cloud Storage", content: `**Additional "*-as-a-Service" models beyond the big three:**
• **DaaS (Desktop as a Service)** — cloud-hosted virtual desktops. Provider runs the VDI infrastructure; users connect from thin clients or laptops. Examples: Azure Virtual Desktop, Amazon WorkSpaces. Pay per user per month.
• **FaaS (Function as a Service) / Serverless** — upload a function; the provider runs it on-demand and you pay per invocation (no idle server cost). Examples: AWS Lambda, Azure Functions, Cloudflare Workers.
• **XaaS (Anything as a Service)** — umbrella term covering any cloud delivery model.
• **STaaS (Storage as a Service)** — cloud storage (S3, Azure Blob, Dropbox Business).
• **DBaaS (Database as a Service)** — managed databases (RDS, Cosmos DB).

**Scalability vs. Elasticity** (the exam distinguishes these):
• **Scalability** — the ability to handle larger workloads by adding resources. Long-term capacity planning.
  — **Vertical scaling (scale up)** — bigger instance (more CPU/RAM). Limited by max instance size.
  — **Horizontal scaling (scale out)** — more instances. Nearly limitless.
• **Elasticity** — the ability to **automatically and quickly** scale resources up AND down to match current demand. Driven by metrics (CPU %, request rate). Load-balanced group of instances grows during a traffic spike and shrinks after.

**Pay-as-you-go (consumption-based) billing** — you pay for metered usage (compute seconds, GB-hours, API calls, data transferred). Removes the up-front capex of servers in favor of opex. Cost control requires monitoring; runaway workloads can generate surprise bills.

**Cloud file storage patterns:**
• **File synchronization** — files mirrored across devices and the cloud (OneDrive, Dropbox, iCloud Drive). Edit on one, it appears on all others.
• **Block storage** — raw disks for VM mounting (AWS EBS, Azure Managed Disks).
• **Object storage** — files as objects with metadata, accessed via HTTP API (AWS S3, Azure Blob). Essentially unlimited scale; not a mounted filesystem.

**Cloud shared responsibility model** — the provider and customer each have security duties, and the split depends on the service model:
• **IaaS** — provider secures the physical facility, hardware, hypervisor; customer secures the OS, apps, data, network config, IAM.
• **PaaS** — provider handles more (OS, runtime). Customer secures app code, data, user access.
• **SaaS** — provider handles nearly everything. Customer secures user accounts, MFA, data classification.
In all cases, **the customer always owns data classification, user access, and endpoint security.**

**Regions and availability zones** — cloud providers organize global data centers into **regions** (geographic — "US East (N. Virginia)") containing multiple **availability zones (AZs)** (isolated data centers within a region). Designing across AZs protects against single-DC failure; across regions protects against disasters and provides data sovereignty.` }
      ]}
    ]
  },
  {
    id: 5, domain: "HW & Network Troubleshooting", weight: 28, color: "#ff8a65",
    topics: [
      { title: "Troubleshooting Methodology", sections: [
        { heading: "⚠️ NOT a Formal 1201 Objective", content: `CompTIA explicitly states the troubleshooting methodology "does not constitute a formal objective" on the 1201. It was tested on the 1101 but was **removed**. It remains as a "competency standard" best practice only.

**The 6 steps** (know as best practice):
1. **Identify the problem** — gather info, question changes, check logs, reproduce
2. **Establish a theory of probable cause** — question the obvious first, research if needed
3. **Test the theory** — if confirmed, plan fix. If not, new theory. Escalate if beyond skill level.
4. **Establish a plan and implement** — plan fix, get authorization, notify users
5. **Verify full system functionality** — confirm fix, test related systems, preventive measures
6. **Document findings, actions, outcomes** — record for knowledge base

The **mindset** applies to every scenario question: least invasive first, gather info before changes, "what should you do NEXT?" = next logical step, not the final fix. Eliminate extreme words ("always", "never"). When two answers seem correct, pick the one that gathers more info.` },
        { heading: "Cause vs. Symptom vs. Consequence", content: `CompTIA distinguishes three different aspects of a problem — the exam may phrase scenarios using any of these terms:

| Aspect | Meaning | Example |
|--------|---------|---------|
| **Cause** | The root technical fault | Hard disk drive has failed |
| **Symptom** | What the user/system observes | "Blue screen of death" appears |
| **Consequence** | The business impact | User cannot complete their work |

**Business-first prioritization** — from a business perspective, resolving the **consequence** matters more than the cause. Giving the user a spare workstation while the drive is being replaced may be the correct first action, even though it doesn't fix the root cause.

**Priority and severity** — not all problems get equal attention:
• A single-user hard drive issue **cannot take priority** over a data-center-wide power outage affecting hundreds of users.
• Severity scales (P1/P2/P3/P4 or Critical/High/Medium/Low) formalize this in ticketing systems.

**Cause can itself be a symptom** — recurring problems mean the visible "cause" is actually a symptom of something larger. If a disk drive keeps failing in the same machine, the real cause might be environmental (temperature, vibration, PSU instability) or a supply-chain bad batch — not just the individual drive.` },
        { heading: "Step 1 Detail — Identify the Problem", content: `**Sub-steps under "Identify the problem":**
1. Gather information from the user, identify user changes, and **perform backups before making changes** if applicable.
2. **Begin documentation** of the problem — update throughout the entire process, not just at the end.
3. Inquire regarding **environmental or infrastructure changes** (new construction, HVAC work, power events, network changes by another team).

**Questions to ask the user** (core diagnostic interview):
• What are the **exact error messages** appearing on screen or from the speaker?
• Is **anyone else** experiencing the same problem?
• **How long** has the problem been occurring?
• What **changes have been made recently** to the system? Initiated by the user or via another support request?
• If it worked previously and now fails mechanically — any changes from the user or the environment/infrastructure?
• Have you **tried anything** to solve the problem?

**Perform backups before changes** — if there's user data on the machine and no recent backup exists, back up before reconfiguring. This is a recoverable precaution; not doing it can turn a small problem into unrecoverable data loss.` },
        { heading: "Steps 2–3 Detail — Theory & Testing", content: `**Research techniques** when the user can't fully describe the problem:
• **Physical inspection** — look and listen. Scorched motherboard, "sick"-sounding disk drive, no fan noise, capacitor bulging.
• **Reproduce the problem** — repeat the exact circumstances that produced the error. **Intermittent problems** (not reliably repeatable) are the hardest to troubleshoot.
• Check **system documentation, installation logs, event logs, and diagnostic tools**.
• **Consult other technicians** who may have worked on the system recently, or from another team that may have made infrastructure changes without notice.
• **Vendor documentation**, web searches, and forums for known issues with existing fixes.

**Compartmentalized troubleshooting** — break the system into subsystems and eliminate each in turn:
• Power → Hardware components → Drivers/firmware → Software → Network → User actions

**For a PC specifically:**
1. Decide whether the problem is hardware or software.
2. Which hardware subsystem? (drive, PSU, RAM, etc.)
3. Within that subsystem — is it the physical unit or the connectors/cables?
4. Test your theory.

**"Known good" substitution** — the most powerful hardware test. Swap the suspected bad component with a confirmed-working duplicate. If the problem moves, you've isolated the faulty part.

**Base configuration** — if the problem resists isolation, strip the system down to its minimum (CPU + 1 RAM stick + integrated or single GPU + boot drive) and add components back one at a time, testing after each.

**Escalation** — if your theory testing doesn't resolve it, escalate rather than waste time:
• Senior technical/admin staff, SMEs, developers within your company
• Suppliers/manufacturers via warranty or support contracts, helplines, web portals
• Other support contractors, websites, and social media (**with authorization** — never disclose proprietary, confidential, or personal information publicly)
• When escalating, **document what you've found out and tried so far** — don't make the next person start from zero.` },
        { heading: "Steps 4–6 Detail — Plan, Implement, Verify, Document", content: `**Three generic approaches to resolving an IT problem:**

| Approach | When to use |
|----------|-------------|
| **Repair** | Cost of repair is less than replacement and time permits |
| **Replace** | Often more expensive; may take time if parts unavailable. Also an **opportunity to upgrade** the part/software while swapping |
| **Workaround** | When neither repair nor replace is cost-effective — document the issue and move on (or defer) |

**RMA (Returned Materials Authorization)** — ticket number the vendor issues for returning a defective part under warranty. Required before shipping a part back.

**When building your plan of action**, assess:
• Resources (people, tools, spare parts)
• Time required
• Cost
• **Potential impact on the rest of the system** (a software patch that fixes one program may break another)

**Change and configuration management system** — formal processes in enterprises ensure:
• You understand what connects to what (dependencies)
• You seek proper authorization before making changes
• Changes are scheduled during low-impact windows

**Implementation discipline:**
• **Test after each change.** If it didn't fix the problem, **reverse that change** before trying something else. Cascading untested changes makes the system impossible to reason about.
• Schedule disruptive changes during maintenance windows; notify affected users.

**Verify full-system functionality:**
• Try the original failing task yourself and/or with the user present
• Inspect status/indicator LEDs on affected components
• Consult logs to confirm clean operation
• Update software/drivers where appropriate
• **Get customer acceptance** before closing the ticket. Restate the problem and the fix; confirm they agree it's resolved.

**Preventive measures** — don't stop at fixing the immediate failure. Address root causes:
• Power cable blew a fuse? → Check for building-wide power problems that may have caused it.
• Virus infection? → Ensure AV is updating regularly and users are trained on malware risks.

**Documentation — the permanent record:**
• Findings, lessons learned, actions, outcomes — all go in the ticket.
• Consolidated into a **Knowledge Base / FAQ** for future incidents. Same problem category → check if the same solution applies.
• Ticket logs also analyze IT health (problem frequency/types) and **demonstrate value to the business** — especially important for MSPs and third-party contractors.
• Write clearly and concisely; someone else will read these. Check spelling and grammar — logs may be presented to customers.` }
      ]},
      { title: "5.1 — Motherboard, RAM, CPU & Power", sections: [
        { heading: "POST, Beep Codes & Crash Screens", content: `**POST (Power-On Self-Test)** — runs at power on. BIOS/UEFI verifies CPU, RAM, video before OS handoff.

**POST beep codes** (vary by BIOS manufacturer — AMI, Award, Phoenix):
• **1 short beep** = POST successful, normal
• **Continuous short beeps** = PSU or motherboard failure
• **Repeating long beeps** = RAM not detected or failing
• **1 long, 2 short beeps** = video card / display adapter failure
• **No beep at all** = PSU dead, motherboard dead, or speaker disconnected

You won't memorize codes per manufacturer. Know that beeps = POST failures and match patterns to components.

**Proprietary crash screens** [NEW for 1201]:
• **Windows BSOD** — kernel crash. Drivers, bad RAM, failing storage
• **macOS kernel panic** — spinning pinwheel, similar causes
• **Linux kernel panic** — text display, driver/hardware failure` },
        { heading: "Common Symptoms & Causes", content: `| Symptom | Most Likely Cause |
|---------|-------------------|
| No power at all | Dead PSU, bad cable, failed motherboard, tripped breaker |
| Power on, no display | Bad GPU, unseated RAM, CPU failure, monitor cable/input |
| Sluggish performance | Insufficient RAM, failing HDD, overheating (thermal throttling) |
| Overheating / shutdown | Failed fan, dried thermal paste, blocked airflow, dust |
| **Burning smell** | Failing capacitor, shorted component, overloaded PSU — **POWER OFF IMMEDIATELY** |
| Random shutdowns | Overheating, failing PSU, bad RAM, loose power connections |
| Application crashes | Bad RAM (run memtest), corrupted OS files, driver conflicts |
| Grinding/clicking noise | Failing HDD — **backup data immediately**. Or fan obstruction |
| Capacitor swelling/bulging | Failing motherboard — domed or leaking capacitors. Replacement needed |
| Inaccurate date/time | Dead CMOS battery (CR2032). Replace battery on motherboard |

⚠️ "Burning smell" = **stop and power off immediately**. "Clicking HDD" = **backup first**, then replace.

**Thermal paste** — fills gaps between CPU and heatsink. Dries out over time → thermal throttling, shutdowns.
**CMOS battery (CR2032)** — maintains BIOS settings and clock when off. Dead = date resets, settings lost, boot errors.` }
      ]},
      { title: "5.1 Deep Dive — CertMaster Additions", sections: [
        { heading: "Power Supply Tester, Multimeter, POST Code Diagnostics", content: `**No power / power issues — diagnostic flow:**

1. **Verify wall outlet** — plug another device in, or use an outlet tester / voltmeter. Check the PSU switch on back of case (0/I) and the input voltage switch (115/230) if present.
2. **Check power cable** — swap with a known-good C13 cable.
3. **Listen for fan spin / LEDs** on the motherboard. If nothing, the PSU is suspect.
4. **Test the PSU:**
   • **PSU tester** — inexpensive tool that plugs into the 24-pin and CPU connectors. Reads out each rail's voltage; some flag missing rails/short circuits. Fast, safer than a multimeter for beginners.
   • **Multimeter** — set to DC volts, back-probe each rail while connected to motherboard or use the "paperclip test" (short pins 15 and 16 — green and any black — on a 24-pin ATX connector to force the PSU to turn on standalone). Expected rails: +3.3V, +5V, +12V (ATX spec allows ±5% tolerance; anything outside = bad PSU).
   • **Swap** with a known-good PSU of sufficient wattage.
